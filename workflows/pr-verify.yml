name: Shipline PR verify

# Runs on every PR push. Also responds to `/implement <ID>` and
# `/verify-pr` comments from authorized users.
#
# Authentication: this workflow supports either auth mode. Set whichever
# matches your plan:
#   - CLAUDE_CODE_OAUTH_TOKEN: subscription-backed auth tied to your
#     Claude Code Enterprise / Pro / Team plan (preferred — no
#     separate billing)
#   - ANTHROPIC_API_KEY: API account on console.anthropic.com (separate
#     billing line)
# At least one must be set; if both are set, CLAUDE_CODE_OAUTH_TOKEN
# takes precedence.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Run verify-pr skill
        env:
          # Prefer subscription auth; fall back to API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude --skill verify-pr \
            --input '{ "prNumber": ${{ github.event.pull_request.number }} }'

  implement-on-comment:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude /implement') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Parse contract ID from comment
        id: parse
        run: |
          ID=$(echo "${{ github.event.comment.body }}" | grep -oP '/implement\s+\K[A-Z]+-\d+')
          echo "contractId=$ID" >> $GITHUB_OUTPUT
      - name: Run implement skill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          claude --skill implement \
            --input '{ "contractId": "${{ steps.parse.outputs.contractId }}", "prNumber": ${{ github.event.issue.number }} }'
