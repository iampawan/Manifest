name: Manifest verify deployment

# Runs after a successful deploy to QA or pre-prod. Reads the contract
# behind the release, runs the platform-appropriate suite (Playwright for
# web, xcodebuild/gradlew for native mobile, API smoke for backend),
# samples telemetry, and posts a verdict.
#
# NATIVE MOBILE: this job defaults to `runs-on: ubuntu-latest`. For an
# iOS-native contract, switch to `runs-on: macos-latest` (xcodebuild is
# macOS-only). For Android-native, add the Android SDK / `setup-java`.
# Verification of native uses Firebase Test Lab + Crashlytics — see the
# verify-deployment skill Sub-mode D and GUIDE §3 "Native mobile setup".

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      contractId:
        description: "Contract ID (e.g., SC-005)"
        required: true
      environment:
        description: "qa | preprod | prod"
        required: true
      url:
        description: "Deployed URL"
        required: true

jobs:
  verify-deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps
      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Determine inputs
        id: inputs
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "contractId=${{ inputs.contractId }}" >> $GITHUB_OUTPUT
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "url=${{ inputs.url }}" >> $GITHUB_OUTPUT
          else
            # Deployment event — parse contract ID from deployment payload
            ID=$(echo '${{ github.event.deployment.payload }}' | jq -r '.contractId')
            ENV=$(echo '${{ github.event.deployment.environment }}')
            URL=$(echo '${{ github.event.deployment_status.target_url }}')
            echo "contractId=$ID" >> $GITHUB_OUTPUT
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            echo "url=$URL" >> $GITHUB_OUTPUT
          fi
      - name: Wait for traffic
        run: sleep 60  # let the deploy receive some traffic before sampling
      - name: Run verify-deployment skill
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          PLAYWRIGHT_BASE_URL: ${{ steps.inputs.outputs.url }}
        run: |
          claude --skill verify-deployment \
            --input '{
              "contractId": "${{ steps.inputs.outputs.contractId }}",
              "environment": "${{ steps.inputs.outputs.environment }}",
              "url": "${{ steps.inputs.outputs.url }}"
            }'
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ steps.inputs.outputs.contractId }}-${{ steps.inputs.outputs.environment }}
          path: .manifest/contracts/*.deploy-*.md
