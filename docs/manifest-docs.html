<script id="docdata" type="application/json">{"version":"0.19.0","generated":"2026-06-30","docCount":22,"sections":[{"title":"Overview","docs":[{"id":"QUICKSTART","path":"QUICKSTART.md","base":"QUICKSTART.md","title":"Start here","md":"# Start here\n\nManifest is a helper for Claude Code (and Cowork) that turns a rough idea or a\nbug into well-checked, shippable work — without you having to remember any\nprocess. You say what you want in plain words; it asks the right questions,\ncatches the gaps people usually miss, and helps get it built.\n\nYou don't need to learn the whole thing. Install it, try one command, and stop\nthere. Everything else can wait until you actually want it.\n\n## 1. Install it\n\nIn Claude Code or Cowork, paste these two lines:\n\n```\n/plugin marketplace add https://github.com/iampawan/Manifest\n/plugin install manifest@manifest\n```\n\nThat's the setup. No account, no config files to get started.\n\n## 2. Say hello\n\n```\n/manifest\n```\n\nIt introduces itself, checks your setup, and points you to the first thing worth\ntrying. If anything's missing, it tells you in plain language.\n\n## 3. Do one real thing\n\nPick whichever matches what you have right now — describe it like you'd tell a\nteammate:\n\n**Fix a small bug:**\n\n```\n/fix the Save button stays clickable when the form is empty\n```\n\nIt works out the cause, writes the fix and a test, and opens a pull request.\n\n**Or shape a new feature:**\n\n```\n/contract pickup let people export their data as a CSV\n```\n\nIt drafts a short spec, then quietly checks it for the things that bite later —\nmissing edge cases, unclear states, security gaps — and shows you what to tighten\n*before* any code is written.\n\nThat's it. You've used Manifest.\n\n## What just happened\n\nIt met you where you were — a bug or an idea — and did the easy-to-forget parts\nfor you: asking the right questions, catching gaps, and writing things down so\nnothing slips. Its notes live as plain files inside your project. Nothing to log\ninto, nothing to maintain.\n\n## When you want more (no rush)\n\nOnly reach for these when you feel like it:\n\n- `/status` — what's in flight and what's next.\n- `/implement \u003cid>` — have it build a spec you've shaped.\n- [GUIDE.md](GUIDE.md) — the full picture, the day you want it.\n\nOne command is enough to start. Grow into the rest whenever.\n\n---\n\n*If it ever asks to connect GitHub, that just lets it read your code so its\nchecks are sharper — say yes when you're ready, or skip it for now. Either way\nworks.*\n"},{"id":"README","path":"README.md","base":"README.md","title":"Manifest","md":"# Manifest\n\n[![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](LICENSE)\n![Version](https://img.shields.io/badge/version-0.18.2-blue.svg)\n![Tests](https://img.shields.io/badge/tests-node%20--test-green.svg)\n\nA Claude Code / Cowork plugin that takes a PRD (\"contract\") through the full\nlifecycle — spec → implement → ship → land — with quality gates that won't\nlet an under-specified spec progress.\n\nThe contract lives as **markdown in your repo** at `.manifest/contracts/*.md`.\nCritics produce findings as adjacent files. Reports are committed alongside.\nGit is your audit trail; no external database required.\n\nFor the full walkthrough — mental model, day-by-day flow, recovery\nplaybooks — read **[GUIDE.md](GUIDE.md)**.\n\n> **New in 0.18 — dev-led Spec flow.** Most PMs write PRDs in JIRA,\n> Google Docs, Slack, or Notion and hand them off; the dev does the\n> homework to make the spec build-ready. **`/contract pickup\n> \u003csource>`** is the entry point for that case — paste any source\n> and the agent does the code archaeology, runs the critics, and\n> presents every gap in three buckets (auto-fill from code, dev\n> decides, only PM can answer). Questions for the PM go out as one\n> batched JIRA comment / Slack DM in the dev's voice — PM never has\n> to touch Manifest. See [skills/contract-pickup/SKILL.md](skills/contract-pickup/SKILL.md)\n> and [ROADMAP.md](ROADMAP.md). Enable per repo via\n> `pickup.enabled: true` in `repos.yml`.\n\n## Pick the right path — process proportional to risk\n\nManifest scales the ceremony to the change. Four tiers:\n\n| Change | Path | Process |\n|---|---|---|\n| Typo, single CSS value, config flip | just edit + commit | none |\n| One-line bug, copy tweak, dep bump | **`/fix`** (express lane) | triage → fix + regression test → PR; minutes |\n| New behavior, 1 platform, ≤3 behaviors | **`/contract pickup`** → Small | full pipeline, 24h SLA |\n| ≤2 platforms, ≤8 behaviors, additive schema | **`/contract pickup`** → Medium | full pipeline, 72h SLA |\n| Breaking change, migration, auth/billing | **`/contract decompose`** → epic | broken into Small/Medium children; migrations human-led |\n\n`/contract pickup \u003csource-or-description>` is the canonical Spec\nentry — it accepts a JIRA / Linear / Notion / Google Doc / Slack URL,\na Figma file, pasted text, an image, or a free-form description. The\nagent fetches whatever you give it, drafts a contract, runs the\ncritics inline, and walks you through the gaps. There's no separate\n\"author\" step.\n\n## What the full pipeline does (Small / Medium)\n\n| Stage | What runs | Output |\n|---|---|---|\n| **Spec** | `/contract pickup \u003csource-or-description>` — fetches the PRD (JIRA / Linear / Notion / Google Doc / Slack / paste / image), runs the validator + relevant judgment critics inline, sorts every gap into 3 buckets (auto-fill from code, dev decides, only PM can answer), drafts batched questions back to the PM in their own tool | `.manifest/contracts/\u003cID>.md` + `.findings.{md,json}` + `.qa.md` sidecar |\n| **Promote** | `/contract promote` | Frozen revision, JIRA epic, SLA timer (24h/72h) |\n| **Implement** | `/implement \u003cID>` (PR comment, runs in CI) | PR with code + tests in the repo's stack |\n| **Verify PR** | `pr-verify.yml` → `verify-pr` (AC conformance) + `code-review` (code-level defects) | coverage comment + `CR-` findings; open blockers gate merge |\n| **Review→fix** | `@claude /fix-pr \u003cID>` (Implementer fix-mode) | findings addressed + re-pushed, bounded by `maxFixIterations` |\n| **Verify deploy** | `verify-deploy.yml` (platform-aware: web/Flutter/backend) | per-AC pass/fail + canary verdict |\n| **Canary guard** | `rollback-guard.yml` (every 30 min) + `/canary`, `/rollback-check` | proceed / hold / recommend-rollback + next ramp step (recommends only) |\n| **Launch report** | `launch-monitor.yml` (cron, 4 weeks) | Slack DM at day 1/7/14/28 |\n| **Bug watch + route** | `bug-triage` (daily) | tickets with contract refs, routed to `/fix` or `/contract` (gated) |\n| **Rollback** | `/postmortem \u003cID>` (after a revert) | `landed: rolled-back`, blameless postmortem, reopened follow-up |\n\nAnytime: **`/status [\u003cID>]`** shows phase, SLA time-left (IST + UTC),\nreadiness, and next action — for one contract or everything in flight.\n\n## Sizing\n\nThe deterministic validator classifies each verified contract as\n**Small (24h)**, **Medium (72h)**, or **Large**. Small and Medium use\nthe automated pipeline. **Large is decomposed** (via `/contract\ndecompose`) into a dependency-ordered sequence of Small/Medium child\ncontracts — Manifest doesn't refuse Large, it makes it tractable. The\ntruly tiny stuff goes through the `/fix` express lane (no contract at\nall). See \"Pick the right path\" in `/manifest` or GUIDE section 1b.\n\n## How verification works (two layers)\n\nVerification runs in two layers, not one pile of LLM prompts:\n\n- **Deterministic layer** (`scripts/validate.mjs`) — real code that\n  checks everything mechanical: every behavior has instrumentation /\n  perf budget / comms states, every behavior has an acceptance\n  criterion, platforms are in scope, sizing arithmetic, and the\n  readiness verdict. 100% reproducible, free (no tokens), unit-testable.\n  Also validates critic output against a strict schema — out-of-schema\n  severities like \"high\"/\"medium\" are rejected, not silently accepted.\n\n- **Judgment layer** (LLM critics) — only genuine reasoning: missing\n  edge cases, security analysis, scalability, cross-repo regression,\n  copy quality, platform-specific UX. Bounded by `reference/CRITIC-PROTOCOL.md`\n  (one shared rule definition) and schema-validated.\n\nThe readiness verdict is computed by code, never judged by an LLM. See\n`reference/CRITIC-PROTOCOL.md` for the rules and `docs/RELIABILITY.md` for the full\nhardening plan and what's built vs still planned.\n\n**Requires Node + `js-yaml`** for the validator: `cd scripts && npm install`.\n\n---\n\n# Installation\n\nThree ways to install Manifest depending on your situation. Pick one.\n\n| Method | When to use | Effort |\n|---|---|---|\n| **A. Marketplace install** | You're trying it out and someone has already published the repo. Pull and install in two commands. | Lowest |\n| **B. Direct file install** | You have the plugin folder locally (this folder you're reading from). Drop it into Claude Code's plugins directory. | Low |\n| **C. Development mode** | You're authoring or modifying the plugin itself. Run from the source folder so edits are live. | Lowest for iteration |\n\nAll three work in both **Claude Code** and **Cowork mode** — user-scoped\nplugins are visible in both.\n\n---\n\n## Method A — Marketplace install (recommended)\n\nThe cleanest path — two commands:\n\n```\n/plugin marketplace add https://github.com/iampawan/Manifest\n/plugin install manifest@manifest\n```\n\nThen confirm it loaded:\n\n```\n/plugin                       # shows installed plugins\n/manifest                     # runs the tutorial\n```\n\n> **Installing from a private fork?** The clone uses your existing git\n> credentials. If you hit `Permission denied (publickey)`, the\n> marketplace defaulted to SSH and your machine has no SSH key. Either\n> force HTTPS and authenticate once —\n> `export CLAUDE_CODE_PLUGIN_PREFER_HTTPS=1` then `gh auth login` —\n> or clone locally and install from the path:\n> ```bash\n> git clone https://github.com/\u003cyour-fork>/manifest ~/work/manifest\n> # then in Claude Code:\n> /plugin marketplace add ~/work/manifest\n> ```\n\n**Updates:** Claude Code pins the commit at install time and doesn't\nauto-refresh — see [Updating Manifest](#updating-manifest) below.\n\n---\n\n## Method B — Direct file install (recommended for first-time setup)\n\nIf you have the `manifest/` folder on your machine (e.g., you cloned\nit or were handed the folder), drop it into Claude Code's plugins\ndirectory:\n\n```bash\n# 1. Copy the plugin into Claude Code's user-scope plugins directory\ncp -r manifest ~/.claude/plugins/manifest\n\n# 2. Verify the structure — the manifest must be inside .claude-plugin/\nls ~/.claude/plugins/manifest/.claude-plugin/plugin.json\n# Expected: ~/.claude/plugins/manifest/.claude-plugin/plugin.json\n```\n\nThen in Claude Code:\n\n```\n/plugin                       # confirms manifest is loaded\n/manifest                     # runs the tutorial\n```\n\nSkills auto-discover from `skills/*/SKILL.md`; slash commands\n(`/contract`, `/implement`, `/verify-pr`, `/code-review`, `/verify-deploy`,\n`/canary`, `/rollback-check`, `/postmortem`, `/launch`, `/manifest`)\nbecome available immediately.\n\n---\n\n## Method C — Development mode (for plugin authors)\n\nIf you're iterating on the plugin itself, run Claude Code with the\nplugin pointed at your working folder so edits take effect without\nrecopying:\n\n```bash\ncd ~/path/to/manifest\nclaude --plugin-dir .\n```\n\nOr, if you want it loaded persistently while you develop, symlink:\n\n```bash\nln -s ~/path/to/manifest ~/.claude/plugins/manifest\n```\n\nEdits to SKILL.md files are picked up on next invocation. Edits to\nthe manifest may require a Claude Code restart.\n\n---\n\n## Updating Manifest\n\nClaude Code does **not** auto-update an installed plugin — it pins what\nit captured at install time. Update the way that matches how you\ninstalled (the `version` in `.claude-plugin/plugin.json` and the\n[CHANGELOG](CHANGELOG.md) tell you what you're on vs. what's latest):\n\n**Method A — Marketplace.** Refresh the marketplace, then re-install:\n\n```\n/plugin marketplace update manifest\n/plugin install manifest@manifest      # re-install to pull the latest\n```\n\nRestart Claude Code if commands don't reflect the new version. For\nreproducible upgrades across a team, install a tagged release rather\nthan tracking `main` (if the author tags releases):\n\n```\n/plugin install manifest@manifest@v0.7.0\n```\n\n**Method B — Direct file install.** Re-copy the folder over the old one,\nthen restart Claude Code (or `/plugin` to confirm the new version). If\nyou got it from git, pull first:\n\n```bash\ncd ~/path/to/manifest && git pull         # if it's a clone\ncp -r manifest ~/.claude/plugins/manifest # overwrite the installed copy\n```\n\n**Method C — Development mode.** Just `git pull` in your working folder.\nWith `claude --plugin-dir .`, SKILL.md edits are picked up on next\ninvocation; changes to `plugin.json`/`marketplace.json` need a restart.\nA symlinked install behaves the same.\n\n**Don't forget the workflows.** The GitHub Actions files\n(`workflows/*.yml`) are **copied into your repo's `.github/workflows/`**\nat setup — they live in your repo, not the plugin, so updating the\nplugin does **not** update them. After an update that changed any\nworkflow (the CHANGELOG will say), re-copy them:\n\n```bash\ncp ~/.claude/plugins/manifest/workflows/*.yml .github/workflows/\n```\n\nLikewise, `repos.yml` is yours once copied — diff it against\n`examples/repos.yml.example` after an update to pick up new `conventions`\nkeys (e.g., `perfBudget`, `rolloutPlan`).\n\n---\n\n## Post-install: wire your project\n\nWhichever install method you used, the next step is the same. In the\nrepository where you'll author contracts (typically a product repo\nor a separate \"specs\" repo):\n\n```bash\n# 1. Make a contracts directory\nmkdir -p .manifest/contracts\n\n# 2. Copy the example repos config and edit it\ncp ~/.claude/plugins/manifest/examples/repos.yml.example .manifest/repos.yml\n# Edit .manifest/repos.yml — replace org/repo placeholders with yours\n\n# 3. (Optional, for CI later) Copy the GitHub Actions workflows\ncp ~/.claude/plugins/manifest/workflows/*.yml .github/workflows/\n\n# 4. Commit\ngit add .manifest/ .github/workflows/\ngit commit -m \"chore: add Manifest pipeline\"\n```\n\nFor the full setup — MCPs to connect, GitHub secrets, Slack channels,\nchoosing your pilot feature — see **[GUIDE.md section 3](GUIDE.md)**.\n\n---\n\n## MCPs you need to connect\n\nThese are referenced by the skills. Connect whichever you have access\nto via your Claude Code MCP settings:\n\n| MCP | Required? | What it's for |\n|---|---|---|\n| **GitHub** | Required | Read code across repos, open PRs, post comments |\n| **Sentry** | Required | Errors, releases, performance per release |\n| **Slack** | Required | Human gates, daily reports, contract threads |\n| **Firebase Analytics** | Recommended | Richest source for launch-report success metrics |\n| **Amplitude** | Recommended | Alternative client analytics |\n| **Atlassian (JIRA)** | Recommended | Pull contracts from JIRA tickets, auto-file bugs |\n| **Figma** | Optional | Design coverage check, asset reference |\n| **Postgres / DB** | Optional | Fallback for record-count launch metrics |\n| **Google Cloud Logging / Datadog** | Optional | Fallback for server-side event counts |\n\nYou can start with just GitHub + Slack and add the others as you\nneed them. The plugin gracefully degrades — if a measurement source\nisn't available, launch reports use whatever fallback is.\n\n---\n\n## Verify your install\n\nAfter installing via any method, these should work:\n\n```\n/plugin           # lists installed plugins, manifest should appear\n/manifest         # opens the tutorial / welcome flow\n/setup            # checks what MCPs you have connected\n/skills           # auto-discovered skills\n```\n\nIf `/manifest` runs and gives you the welcome tutorial, you're set.\nRun `/setup` next — on first run it's an **interactive wizard** that\nauto-detects your repos, frameworks, event SDKs, and test patterns,\nasks only the few things it can't detect, and writes a complete\n`.manifest/repos.yml` for you (no placeholders to hand-edit). On later\nruns `/setup` confirms your MCPs and scopes. Then try\n`/contract pickup \"a small feature\"` (or paste any JIRA / Google Doc\n/ Slack URL).\n\n---\n\n## Troubleshooting\n\n**\"marketplace not found\"** — Check the URL points to a GitHub repo\nthat has `.claude-plugin/marketplace.json` at its root.\n\n**\"plugin not found after install\"** — Run `/plugin` to confirm\nstatus. If it shows installed but commands don't work, restart\nClaude Code.\n\n**Private repo auth errors** (`Permission denied (publickey)`) — the\nmarketplace defaulted to SSH and the machine has no SSH key. Either set\n`CLAUDE_CODE_PLUGIN_PREFER_HTTPS=1` and run `gh auth login`, or use the\nlocal-clone workaround: clone the repo manually, then\n`/plugin marketplace add \u003clocal-path>`.\n\n**Slash commands missing** — Confirm via `/plugin` that the plugin\nis enabled (not just installed). If still missing, check that\n`commands/*.md` files have proper frontmatter.\n\n**Skills not triggering** — Each SKILL.md needs a `description` field\nin frontmatter that tells Claude when to invoke it. If a skill\nisn't triggering, its description may need to be more specific.\n\n---\n\n## Try it\n\nOnce installed:\n\n```\n/manifest                              # 3-minute tutorial\n/contract pickup \"your first feature\"  # or paste a JIRA / Doc / Slack URL\n```\n\nFor a comprehensive walkthrough, read **[GUIDE.md](GUIDE.md)**.\n\nFor sharing with teammates, point them at\n**[docs/INSTALL-FOR-TRYERS.md](docs/INSTALL-FOR-TRYERS.md)** — a focused doc\non Method A.\n\n---\n\n## Files\n\n```\nmanifest/\n├── .claude-plugin/\n│   ├── plugin.json                      # plugin manifest (Claude Code discovers from here)\n│   └── marketplace.json                 # marketplace entry (points at iampawan/Manifest)\n├── README.md                            # this file (entry + install)\n├── GUIDE.md                             # how it works, end to end\n├── CHANGELOG.md                         # version history\n├── reference/                           # specs the skills read at runtime\n│   ├── CONTRACT-FORMAT.md               # the contract schema\n│   ├── CRITIC-PROTOCOL.md               # shared rule layer (severity enum, output schema)\n│   └── STACK-PROFILES.md                # per-stack toolchains — skills assume no stack\n├── docs/                                # human planning docs\n│   ├── RELIABILITY.md                   # hardening plan — built vs planned\n│   └── INSTALL-FOR-TRYERS.md            # focused install doc for teammates\n├── scripts/\n│   ├── validate.mjs                     # DETERMINISTIC: checks, schema, sizing, readiness, --sla/--status/--check-*\n│   ├── detect.mjs                       # DETERMINISTIC: framework/SDK/test detection per repo\n│   ├── recall.mjs                       # DETERMINISTIC: scores critic findings vs the golden set\n│   ├── migrate-contract.mjs             # DETERMINISTIC: reformat old contracts to the grouped layout\n│   ├── render-diagram.mjs               # DETERMINISTIC: contract Mermaid → standalone viewable HTML\n│   └── package.json                     # depends on js-yaml\n├── eval/\n│   ├── validate.test.mjs                # validator + SLA + phase + review/guard schema tests\n│   ├── detect.test.mjs                  # stack-detector tests  (93 total, all green)\n│   ├── recall.test.mjs                  # recall-scorer tests\n│   ├── migrate.test.mjs                 # migrator tests (value/body preservation, idempotent)\n│   ├── render-diagram.test.mjs          # diagram extraction/render tests\n│   ├── golden/                          # expected judgment findings (recall harness)\n│   └── contracts/                       # clean + seeded-gaps + judgment-gaps fixtures\n├── examples/\n│   ├── EX-001-saved-cards.md            # example contract\n│   ├── repos.yml.example                # multi-repo configuration template\n│   └── repos.example.multistack.yml     # sample config for a multi-stack product\n├── skills/\n│   ├── tutorial/SKILL.md                # /manifest welcome\n│   ├── setup-init/SKILL.md              # /setup wizard — auto-detects + writes repos.yml\n│   ├── setup-check/SKILL.md             # /setup verify — MCPs + scopes\n│   ├── contract-status/SKILL.md         # /status — phase + SLA + next\n│   ├── contract-new/SKILL.md            # intake (JIRA / Linear / Notion / text)\n│   ├── contract-verify/SKILL.md         # two-layer orchestrator (validator → judgment critics)\n│   ├── contract-promote/SKILL.md        # freeze + start SLA + Slack anchor\n│   ├── contract-decompose/SKILL.md      # Large → epic of Small/Medium children\n│   ├── quick-fix/SKILL.md               # /fix express lane for trivial changes\n│   ├── critic-minimality/SKILL.md       # } judgment critics — all reference\n│   ├── critic-edge-cases/SKILL.md       # } reference/CRITIC-PROTOCOL.md; run conditionally.\n│   ├── critic-platform-parity/SKILL.md  # } minimality is the scope counterweight (always runs)\n│   ├── critic-instrumentation/SKILL.md\n│   ├── critic-comms-completeness/SKILL.md\n│   ├── critic-perf-budget/SKILL.md\n│   ├── critic-regression/SKILL.md       # multi-repo + cross-repo API tracing\n│   ├── critic-security/SKILL.md\n│   ├── critic-scalability/SKILL.md\n│   ├── implement/SKILL.md               # the heavy agent — stack-agnostic; build + fix modes\n│   ├── code-review/SKILL.md             # PR-stage code-level review (CR- findings)\n│   ├── verify-deployment/SKILL.md       # platform-aware (web / Flutter / backend)\n│   ├── rollback-guard/SKILL.md          # rollout-window health watch + next-ramp-step (recommends only)\n│   ├── rollback-postmortem/SKILL.md     # blameless postmortem + reopen after a rollback\n│   ├── launch-report/SKILL.md           # the loop-closer\n│   └── bug-triage/SKILL.md\n├── commands/\n│   ├── manifest.md                      # /manifest welcome + reference\n│   ├── setup.md                         # /setup (init wizard or verify)\n│   ├── status.md                        # /status [\u003cID>]\n│   ├── contract.md                      # /contract pickup|promote|decompose|fix|diagram (also: legacy new, power-user verify)\n│   ├── fix.md                           # /fix \u003cbug-or-change>\n│   ├── implement.md                     # /implement \u003cID>\n│   ├── verify-pr.md                     # /verify-pr \u003cPR>\n│   ├── code-review.md                   # /code-review \u003cPR>\n│   ├── verify-deploy.md                 # /verify-deploy \u003cID> \u003cURL>\n│   ├── rollback-check.md                # /rollback-check \u003cID>\n│   ├── canary.md                        # /canary \u003cID> — current stage + next step\n│   ├── postmortem.md                    # /postmortem \u003cID> — after a rollback\n│   ├── bug-triage.md                    # /bug-triage \u003cID>\n│   └── launch.md                        # /launch \u003cID>\n└── workflows/\n    ├── pr-verify.yml                    # PR-triggered Implementer + verify-pr + code-review + fix loop\n    ├── verify-deploy.yml                # post-deploy verification + telemetry\n    ├── rollback-guard.yml               # rollout-window health watch (every 30 min)\n    ├── launch-monitor.yml               # 28-day landing cron\n    └── eval.yml                         # runs the test suite on every change\n```\n\n## Contributing\n\nContributions welcome. The deterministic layer is plain Node with no\nbuild step:\n\n```bash\ncd scripts && npm install        # installs js-yaml\ncd .. && node --test eval/*.test.mjs   # run the full eval suite (must be green)\n```\n\n- **Skills** live in `skills/*/SKILL.md` — markdown with frontmatter\n  (`name`, `description`). The `description` is what tells Claude when to\n  invoke the skill, so keep it specific.\n- **Slash commands** live in `commands/*.md`.\n- **Validator / sizing / detection logic** lives in `scripts/*.mjs` and is\n  unit-tested under `eval/` — add or update a test for any change there.\n- Critic rules are defined once in `reference/CRITIC-PROTOCOL.md`; the\n  readiness verdict is computed by code, never judged by an LLM.\n\nPlease run the eval suite before opening a PR and keep commit messages in\nthe conventional style (e.g. `feat:`, `fix:`, `docs:`). See\n[CONTRIBUTING.md](CONTRIBUTING.md) for the full guide.\n\n## License\n\n[MIT](LICENSE) © Pawan Kumar\n"},{"id":"GUIDE","path":"GUIDE.md","base":"GUIDE.md","title":"Manifest — how it works","md":"# Manifest — how it works\n\nRead this once. It's the only doc you need before running your first\ncontract through the pipeline. The **[README](README.md)** is the\ntable of contents and the installation reference; this is the\nmanual for using it.\n\n**If you haven't installed Manifest yet, read [README.md\nInstallation](README.md#installation) first.** Section 3 below\nassumes the plugin is installed and walks you through the rest of\nthe setup (MCPs, secrets, repos.yml, picking a pilot feature).\n\n---\n\n## 1. The mental model\n\nManifest turns a PRD into a typed, machine-checkable artifact called a\n**contract**. The contract is the source of truth at every stage. The\nimplementer reads it, the PR verifier checks the diff against it, the\ndeployment verifier runs its acceptance criteria against a live URL,\nthe launch monitor checks its success metrics against telemetry.\nNothing in the system interprets prose.\n\nThe contract has four states:\n\n```\ndraft  →  verifying  →  verified  →  promoted\n```\n\nA contract in `verified` can be edited — and re-verified — for free.\nThe moment you `promote` it, a revision file freezes the state, the\nSLA timer starts, and the build phase reads from the revision, not\nthe live contract. Edits after promote fork a new revision; the\nrunning pipeline keeps using the snapshot it started with.\n\nEverything lives in your repo at `.manifest/contracts/`:\n\n```\n.manifest/contracts/\n├── SC-005.md                              # the live contract\n├── SC-005.r1.md                           # immutable revision snapshot\n├── SC-005.findings.md                     # critic output (human view)\n├── SC-005.findings.json                   # critic output (machine-readable; recall harness reads this)\n├── SC-005.implementation-plan.md          # implementer's plan\n├── SC-005.pr-review.json                  # code-review findings (CR-*); gates the merge + feeds the fix loop\n├── SC-005.deploy-qa-2026-05-19T10:00.md   # verifier reports per env\n├── SC-005.guard-2026-05-21T14:00.md       # rollback-guard health checks during rollout\n├── SC-005.launch-report-day1.md           # post-launch reports\n├── SC-005.launch-report-day7.md\n├── SC-005.launch-report-day14.md\n├── SC-005.launch-report-day28.md\n├── SC-005.bug-log.md                      # cumulative bug findings + routing state\n└── SC-005.postmortem.md                   # only if rolled back: blameless postmortem\n```\n\n(At day 28 the contract auto-archives to `.manifest/archive/\u003cyear>/\u003cID>/`,\nkeeping the contract + final report and pruning the process exhaust —\nsee section 1e.)\n\nGit is your audit trail. Every transition is a commit. Anyone with\nrepo access can answer \"what did we decide, when, and why\" without\nasking you.\n\n---\n\n## 1b. Pick the right path — process proportional to risk\n\nNot every change deserves the full contract pipeline. Match the\nceremony to the risk:\n\n| Change | Path | Why |\n|---|---|---|\n| Typo, single CSS value, config flip | just edit + commit | process would cost more than the change |\n| One-line bug, copy tweak, dep bump, localized fix | **`/fix`** (express lane) | triage → fix + regression test → PR, minutes; no critics/SLA/launch report |\n| New behavior, 1 platform, ≤3 behaviors | **`/contract`** → Small | full ceremony pays off; 24h target |\n| ≤2 platforms, ≤8 behaviors, additive schema | **`/contract`** → Medium | 72h target |\n| Breaking change, migration, auth/billing, 3+ platforms | normal cycle (Large) | too risky to agent-ship; use Manifest for the spec + critics only |\n\nThe `/fix` express lane (the **quick-fix** skill) triages first: if a\n\"quick fix\" turns out to add a new event, span platforms, or change\nthe schema, it stops and routes you to `/contract new`. That gate is\nwhat keeps the fast path safe — you get speed on trivial changes\nwithout sneaking real features through unverified.\n\nManifest's overhead is a feature, not a tax: it's the verification\nthat prevents prod bugs on *risky* changes. On trivial changes it gets\nout of the way.\n\n---\n\n## 1c. Works with whatever infrastructure you have\n\nManifest degrades honestly. The spec/build half (which is where most\nbugs are prevented) needs NO infrastructure — only GitHub. The ship/\nland half uses whatever you have and is clear about what it can't do.\n\n| You have | Ship step | \"Did it land?\" verdict |\n|---|---|---|\n| **Full** (feature flags + Sentry + analytics) | staged canary 1→100%, telemetry-gated | metric movement at day 1/7/14/28 |\n| **Partial** (flags + Sentry, no analytics — the typical pilot) | canary via flags, error-gated by Sentry | \"no regression\" from Sentry + DB-count / server-log / manual for the metric |\n| **Bare** (nothing — no flags, no Sentry, no analytics) | deploy to prod directly; rollback = manual revert | manual day-28 review + support tickets; report says `unmeasured` for the quant metric |\n\nWhat's **constant across all three** — the value that doesn't depend\non infrastructure:\n- A complete, critic-verified spec (edge cases, regression, security\n  caught at PRD time)\n- A verified implementation with AC tests in the repo's stack\n- Cycle-time tracking (intake → prod), computed from git/CI, not telemetry\n\nWhat **degrades without infrastructure**: only the post-launch\n*quantitative* \"did the metric move\" verdict. On a bare repo, the\nlaunch report honestly says `unmeasured — shipped without regression,\nlanding not confirmed` and recommends the cheapest fix: one structured\nlog line per success action (no analytics product needed). That's\ninformation, not failure — it tells you which features you're flying\nblind on.\n\n**No feature-flag system?** The \"canary\" step becomes \"deploy to prod\n+ watch + manual revert if needed.\" You lose the gradual blast-radius\ncontrol, not the rest of the cycle. The verifier still runs the AC\ntests against the deployed environment first.\n\nSo: pilot on your flags+Sentry repos for the full-confidence loop, and\nrun bare repos too — the pipeline still prevents bugs at spec time and\nships verified code; it just can't promise a measured landing where\nthere's nothing to measure.\n\n---\n\n## 1d. Where contracts live — central state\n\nContracts are the source of truth, so they need one home. Pick based\non your repo layout:\n\n- **Single product repo** → `.manifest/contracts/` in that repo, on\n  `main`. Done.\n- **Multiple repos** (web + mobile + backend, like most teams) → a\n  **dedicated specs repo** (`your-org/manifest-contracts`). A\n  cross-repo contract can't sensibly live inside one code repo, and a\n  single specs repo on one `main` branch gives you consistent central\n  state for free: git's total commit order means no two devs get\n  diverging findings for the same contract. Code PRs in the product\n  repos reference the contract by ID.\n\nSet it up once:\n\n```bash\ngit init manifest-contracts && cd manifest-contracts\nmkdir -p .manifest/contracts\ncp ~/.claude/plugins/manifest/examples/repos.yml.example .manifest/repos.yml\n# edit repos.yml to point at your product repos (github: org/repo)\ngit add -A && git commit -m \"init manifest contracts\" && git push\n```\n\nThen author/verify/promote from there. `/status` run in this repo is\nyour live dashboard of everything in flight.\n\n**Advisory locks.** `owner`, `lockedBy`, `lockedAt` help teammates not\nstep on each other — `/contract verify` and `/implement` warn if\nsomeone else holds a recent lock. They're advisory (git is the real\narbiter), and only meaningful on the single-branch specs-repo model.\n\n**What this is NOT:** a real-time service. Two people editing the\n*same* contract at once get a normal git merge conflict (rare; git\nhandles it), and you `git pull` to see the latest. A backend service\nthat adds real-time locking + a query API is the v2+ upgrade, deferred\nuntil single-branch git actually causes friction. The plugin is built\nso that service would wrap the same contract format, not replace it.\n\n---\n\n## 1e. Lifecycle & retention — does `.manifest/` grow forever?\n\nIt grows, but it's text in git — thousands of contracts is tens of MB,\nnot a storage problem. The real concern is *clutter*, and most\nper-contract files are **ephemeral** (useful during the cycle, not\nafter). So Manifest archives, it doesn't hoard.\n\n**When a contract lands** (day-28 final verdict), its files move to\n`.manifest/archive/\u003cyear>/\u003cID>/`. The active `.manifest/contracts/`\nfolder then holds only in-flight + recently-landed work. History is\npreserved and searchable; the working view stays lean. `/status` is\nunaffected — it already shows only in-flight contracts.\n\n**What's kept vs. pruned on archive:**\n- **Kept** (lasting history): the contract `\u003cID>.md` and the final\n  `launch-report-day28.md` — the \"what we built + did it land + cycle\n  time\" record, useful for audits, onboarding, and your cycle-time\n  distribution.\n- **Pruned by default** (process exhaust): findings, implementation\n  plan, deploy reports, day-1/7/14 reports, bug-log (mirrored to\n  JIRA), interim revisions. Git history still has them if you ever\n  need them. Set `conventions.retention: keep-all` in `repos.yml` to\n  archive everything instead of pruning.\n\n**So is the folder needed after a product is live?** The *active*\ncontracts folder only ever holds current work. The *archive* is\noptional long-term memory — keep it for audit/retro value (it's\ncheap), or `git rm -r .manifest/archive` if you decide the git\nhistory alone is enough. Nothing in the live product depends on\n`.manifest/` at runtime; it's a development-time record, not a runtime\nartifact.\n\nArchiving happens automatically at day-28, or manually any time via\n`/contract archive \u003cID>`.\n\n---\n\n## 1f. Solo / zero-footprint mode (use it as an IC, no team buy-in)\n\nYou don't need the team's repo to contain a single Manifest file, and\nyou don't need their CI to run anything. Manifest splits cleanly:\n\n- **Brainwork half** (contract authoring, the critics, `/code-review`,\n  edge-case analysis) runs **locally in your Claude Code session** and\n  only produces markdown you read. It never has to be committed to the\n  team repo or run in their Actions.\n- **Automation half** (the `.github/workflows/*.yml`, the `@claude`\n  CI triggers, the launch-monitor cron, rollback-guard) is the *only*\n  part that adds files/Actions to a repo. As a solo IC, you skip it.\n\n**The zero-footprint setup:**\n\n1. **Keep contracts OUT of the team repo.** Put `.manifest/contracts/`\n   and `repos.yml` in a **separate private repo you own** (e.g.\n   `you/manifest-contracts`) — or even a local-only folder you don't\n   push anywhere. `repos.yml` points at the team's code repo by its\n   `github:` slug; the regression/edge-case critics read it through the\n   GitHub MCP using **your existing read access**. Zero writes to the\n   team repo.\n2. **Don't copy any workflows** into the team repo. No\n   `.github/workflows/manifest-*.yml`, no new secrets, no bot.\n3. **Run the skills locally**, from your contracts repo or with the team\n   repo checked out: `/contract new`, `/contract verify`,\n   `/code-review \u003cbranch-or-diff>`, even `/implement` (it writes code to\n   your local branch — you push normal commits; you do NOT need the\n   `@claude` CI trigger).\n4. **Open a normal PR.** Your branch contains only the feature code. The\n   team reviews exactly what any contributor would send — they never see\n   a contract, a workflow, or a Manifest comment unless you choose to\n   paste one.\n\n**What about all the `.md` files?** Every Manifest artifact — the\ncontract, its `.r\u003cN>` revisions, `.findings.md/.json`, the\n`.implementation-plan.md`, `.pr-review.*`, `.deploy-*`, `.guard-*`,\n`.launch-report-*`, `.bug-log.md`, `.postmortem.md` — lives in **your\ncontracts location**, never the team repo. The *only* things that ever\nland in the team branch are the **actual feature code and its tests**.\nTests aren't Manifest footprint — they're normal PR content the team\nwants anyway. So when `/implement` runs in solo mode, it writes code +\ntests to the target repo's branch and writes its plan/findings to your\ncontracts location; nothing Manifest-shaped appears in the diff the team\nreviews.\n\nWhat you give up by skipping the automation half: the scheduled\npost-launch launch reports, the canary rollback-guard cron, and CI-side\nauto-verification on every push. You still get the highest-value part —\na critic-checked spec and a code-reviewed diff — entirely on your side.\nIf the team later wants the full loop, you add the workflows then; the\ncontract format doesn't change.\n\n(If you ever do keep `.manifest/` inside the team repo's working tree\nfor convenience, add `/.manifest/` to *your* local `.git/info/exclude`\nso it's never even staged — local ignore, no shared `.gitignore` edit.)\n\n---\n\n## 1g. Pickup flow — the canonical Spec entry\n\nIn real-world teams most PRDs arrive from outside Manifest. The PM\nwrites one in JIRA, a Google Doc, a Slack thread, or a Notion page,\nassigns it to a dev, and walks away. The dev is the one who has to\nfigure out what's missing — because the PM doesn't know the code,\nthe history, the dependencies, or what might break.\n\n`/contract pickup \u003csource-or-description>` is the canonical entry\nfor the Spec phase. Dev pastes any source — a URL, free-form text,\nor an image — and Manifest does the code archaeology, drafts the\ncontract, runs the validator + relevant judgment critics inline,\nand sorts every gap into three buckets the dev can act on in minutes.\nThere's no separate author / verify two-step; pickup does both.\n\n**The mental model.**\n\n- *You* are the dev. Manifest is on your side.\n- *PM* is an asynchronous input source. The agent talks to PM through\n  their existing tool — a JIRA comment, a Slack reply, a Notion\n  comment — in your voice. **PM never has to touch Manifest.**\n- The contract is your working document — captures decisions, gaps,\n  history, the PM's answers — but it lives in git for audit and feeds\n  the rest of the pipeline like any other contract.\n\n**How it runs.**\n\n```\n/contract pickup https://your-org.atlassian.net/browse/ENG-1234\n/contract pickup https://docs.google.com/document/d/\u003c...>\n/contract pickup https://yourcorp.slack.com/archives/C123/p1234567890\n/contract pickup                              # then paste text or drop an image\n```\n\nThe agent does four things, mostly in parallel:\n\n1. **Fetches the source via the right MCP** (Atlassian, Google Drive,\n   Slack, Notion, Linear, Confluence, Figma, GitHub) and follows\n   embedded links one level deep — Figmas linked from a JIRA ticket,\n   tech specs linked from a Google Doc.\n2. **Pulls related history in the background** — past contracts on\n   the same surface (especially archived `rolled-back` or `partial`\n   ones — they're full of lessons), past postmortems, recent Sentry\n   clusters, open PRs touching the same files, past Slack threads\n   with this PM mentioning this feature.\n3. **Runs the standard critics + a new dev-side critic\n   (`critic-code-context`) in parallel.** The new critic proposes\n   auto-fillable defaults from the codebase: stack-default\n   perfBudget, event names from your existing catalog, copy from\n   i18n keys, AC patterns from similar landed contracts.\n4. **Sorts every gap into three buckets** and shows you one card:\n\n   - **A. Agent fills from code/history** — high-confidence proposals\n     with a source. One tap to accept.\n   - **B. Dev decides** — engineering judgment the PM can't give\n     (past rolled-back patterns, dependency budgets, shared modules,\n     locale branches). [Yes] / [No] / [Show me more].\n   - **C. Only PM can answer** — genuine product unknowns. Each\n     drafted as a PM-facing question, scoped to a behavior, in plain\n     language. [Ask PM] / [I'll handle it] / [Skip].\n\n**PM-channel posting.** When you hit \"Send to PM,\" the agent composes\n*one batched message in your voice* on the channel the source came\nfrom — a JIRA comment on the ticket, a reply in the Slack thread, a\nNotion comment, a Google Doc suggestion. Optional `— \u003cyou> (via\nManifest)` audit footer. PM sees a normal message from you and\nanswers in their tool.\n\n**Answer watcher.** After you send, the agent watches for replies.\nPolls every 5 min for 2h, then every 15 min for 24h, hourly after.\nWhen PM answers, the agent parses the reply, applies it as an AC\nedit with a provenance comment (`\u003c!-- From: Q-N · \u003cPM> · \u003cdate> --\u003e`),\nmoves the question to the sidecar `\u003cID>.qa.md` log, re-verifies\nincrementally on just the changed fragments, and pings you with a\none-line summary. Implementation on non-blocking behaviors can run\nin parallel while you wait.\n\n**Why this is fast.** End-to-end review time for a typical small\ncontract: about 3–5 minutes. Compare to today's \"read PRD + grep\nrepo + check Slack history + ask around\" cycle, which can take an\nhour. The wins come from the agent doing the code archaeology, the\nthree-bucket sort, and the batched PM message (one round-trip\ninstead of five Slack pings spread across the day).\n\n**Opt-in per repo.** In `.manifest/repos.yml`:\n\n```yaml\npickup:\n  enabled: true            # opt in\n  identifyAgent: true      # \"(via Manifest)\" footer on PM-facing posts\n  defaultChannel: jira     # or: slack | notion | gdoc\n  blockingByDefault: false # questions are non-blocking unless you flag them\n  cacheTTL: 24h            # codebase analysis cache lifetime\n```\n\nWithout `pickup.enabled: true`, `/contract pickup` falls back to\n`/contract new` with a notice. No surprises for repos that don't opt\nin. See `skills/contract-pickup/SKILL.md` for the full skill spec and\n`docs/releases/v0.18.0.md` for the release notes including known\ngaps in this first cut.\n\n**When to use which entry point.**\n\n| Situation | Use |\n|---|---|\n| Anything that needs a real spec | `/contract pickup \u003csource-or-description>` |\n| Quick bug fix, no real spec | `/fix` |\n| Power-user re-check after manual `.md` edits | `/contract verify \u003cID>` |\n| Legacy author flow (pre-0.18 muscle memory) | `/contract new` — works but prefer pickup |\n\nPickup doesn't replace anything. It adds the missing entry point.\nOnce a contract has been picked up, everything downstream (verify,\npromote, implement, canary, launch) is identical to a contract that\ncame in through `/contract new`.\n\n---\n\n## 2. The four phases (for Small/Medium contracts)\n\n### ① SPEC — author and verify\nWhere: in your editor with Manifest loaded (local Claude Code or Cowork).\n\nYou write the contract using `/contract new` (from a JIRA/Linear/Notion\nlink, or plain text). You review the draft. You run `/contract verify`,\nwhich runs in **two layers**:\n\n1. **Deterministic validator** (`scripts/validate.mjs`, real code) runs\n   first — checks every behavior has instrumentation / perf budget /\n   comms states, every behavior has an acceptance criterion, platforms\n   are in scope, computes sizing and readiness. Reproducible, free, no\n   LLM variance.\n2. **Judgment critics** (LLM) run second — only for things that need\n   reasoning: missing edge cases, security, scalability, cross-repo\n   regression, copy quality, platform UX. Their output is schema-checked\n   by the validator, so they can't emit out-of-schema severities.\n\nYou resolve findings inline by editing the contract (or dismiss with a\nreason). Re-run verify until readiness goes green — the verdict is\ncomputed by code, not judged by an LLM. Then `/contract promote`.\n\n**Verify is built to be fast on the edit→re-verify loop.** Almost all\nthe time is the LLM critics (the validator is \u003c1s), so verify does the\nsmallest correct amount of work:\n\n- *No-op* — nothing changed since last verify → reuse findings, run zero\n  critics.\n- *Incremental* — after an edit, only the critics over the **changed\n  behaviors** re-run; unchanged findings are reused, and the regression\n  repo-scan (the slowest part) is reused unless the contract's API\n  surface actually moved. Fixing one finding and re-verifying is quick,\n  not a full re-run.\n- *`--fast`* — `/contract verify \u003cID> --fast` runs only edge-cases +\n  security and skips the regression scan, for a quick draft-loop check.\n  It's **not promotable** — run a full verify before promote (promote\n  refuses a fast-only verify).\n- *Model tiering* — heavy critics (edge-cases/security/regression/\n  scalability) use a strong model, light ones a fast model.\n\n### ② BUILD — implement and review\nWhere: GitHub (the heavy work runs in CI, not on your laptop).\n\nYou open a draft PR. From the PR, comment `@claude /implement SC-005`.\nThe `pr-verify.yml` workflow picks this up and runs the Implementer\nagent headlessly in CI. It clones the repo, reads the revision,\nplans the changes, writes code + tests in the repo's stack, iterates\nuntil local tests pass, and pushes commits to your PR. On completion,\nit posts an AC coverage comment.\n\nOn every push the workflow runs **two checks**:\n- **`verify-pr`** — *did they build the right thing?* AC coverage,\n  instrumentation events, flag gate, no hardcoded strings.\n- **`code-review`** — *is the code itself sound?* Security, correctness,\n  performance, and maintainability defects on the diff, as `CR-`\n  findings (same blocker/warning/info enum, schema-checked). Open\n  blockers fail the check and gate the merge.\n\nIf code-review (or verify-pr) leaves open blockers, comment\n`@claude /fix-pr SC-005` to run the **review→fix loop**: the Implementer\nreads the open findings, fixes them narrowly, re-pushes, and CI\nre-verifies. The loop is bounded by `maxFixIterations` (default 3) —\nafter the cap it stops and pings a human rather than churning.\n\nA human reviewer looks at the PR — usually about 30 minutes for a\nsmall contract — and merges. The reviewer's job is \"does this look\nsane,\" not \"did the tests pass\" (they did), \"does it match the spec\"\n(verify-pr shows that), or \"is the code dangerous\" (code-review caught\nthe blockers).\n\n### ③ SHIP — deploy and canary\nWhere: GitHub Actions and your hosting provider.\n\nMerging to main triggers `verify-deploy.yml`. The Verifier agent\nruns the same Playwright suite against the deployed QA URL,\nsamples telemetry from Sentry and Amplitude, and posts a verdict:\n`ready-for-canary | hold | rollback`.\n\nIf ready, you get a Slack ping asking you to approve canary start.\nYou click. Remote Config (or your flag system) rolls out 1% → 10%\n→ 50% → 100%.\n\nWhile it ramps, **`rollback-guard.yml`** runs on a tight cadence\n(every 30 min). The guard samples Sentry errors, crash-free rate, and\nrelease adoption against the contract's budgets (and any\n`rollbackTriggers` you set) and posts a recommendation: `proceed`\n(healthy, keep ramping), `hold` (a warning or too-little data — pause\nthe ramp), or `recommend-rollback` (a clear breach — it posts a\ntop-level Slack alert to the owner with the breached signal and the\nexact action). **The guard recommends; it never acts** — a human flips\nthe flag or reverts. Run it on demand any time with\n`/rollback-check SC-005`, and `/canary SC-005` shows the current stage\n+ next recommended ramp step.\n\nIf you do roll back, run `/postmortem SC-005` once the flag is off: it\nrecords `landed: rolled-back`, writes a blameless postmortem from the\ncontract's timeline + guard reports + Sentry, and reopens the work as a\nfollow-up (never closes it as done). That's the rollback ending of the\nloop — see ④.\n\n### ④ LAND — monitor and verify\nWhere: the `launch-monitor.yml` cron in GitHub Actions.\n\nEvery day for 28 days, the cron runs. The Launch Monitor reads\ntelemetry, errors, and qualitative signals (support tickets, app\nstore reviews, Slack channels if connected) and computes a verdict\nagainst the contract's success metrics. Reports land in Slack at\nday 1, 7, 14, and 28. At day 28, the final verdict — `landed |\npartial | not-landed | rolled-back` — is committed to the contract\nand the monitoring window closes.\n\nThe Bug Watcher (`bug-triage`) runs daily alongside, looking for new\nerror clusters and filing JIRA tickets with contract back-references —\nthen **routing each new bug back into the pipeline** instead of leaving\nit in a queue: a trivial, high-confidence cluster (or any S0/S1) can\nauto-enter the `/fix` express lane; anything bigger drafts a `/contract`\nstub. Everything else is *proposed* and waits for a human, it never\nauto-merges, and it caps auto-starts per run. The follow-up is recorded\non the contract as `bugFollowups`, so an open fix tempers the `landed`\nverdict — the loop stays closed even after launch.\n\n---\n\n## 3. Setup walkthrough\n\n### 3.1 Install the plugin\n\nThree install methods documented in detail in **[README.md\nInstallation section](README.md#installation)**: marketplace\n(`/plugin marketplace add`), direct file copy\n(`cp -r manifest ~/.claude/plugins/`), or development mode\n(`claude --plugin-dir .`). Pick whichever matches your situation\nand come back here for the post-install configuration.\n\nAfter install, verify with:\n\n```\n/plugin           # confirms manifest is loaded\n/manifest         # opens the tutorial\n```\n\nThe same install works in **Cowork mode** — user-scoped plugins\nare visible in both.\n\n### 3.2 Connect required MCPs\n\nManifest reads from the MCPs your client has connected. You need at\nminimum:\n\n| MCP | What it's for |\n|---|---|\n| **GitHub** | Read code, open PRs, post comments |\n| **Sentry** | Errors during canary; bug-watcher input; LaunchReport |\n| **Slack** | Human gates, daily reports, contract threads |\n\nStrongly recommended:\n\n| MCP | What it's for |\n|---|---|\n| **Amplitude** (or Firebase Analytics) | Event telemetry for LaunchReport — without one of these, the quantitative half of post-launch verification is hollow |\n| **Atlassian (JIRA)** | Auto-file bugs with contract refs |\n\nOptional:\n\n| MCP | What it's for |\n|---|---|\n| **Figma** | Design coverage check; Implementer can read Figma frames |\n\nConnect each via your client's MCP settings. The plugin skills will\ncall the right tools automatically.\n\n### 3.3 Wire your target repo\n\nIn the repository where you'll ship features:\n\n```bash\n# Contracts directory\nmkdir -p .manifest/contracts\necho \".manifest/*.tmp\" > .manifest/.gitignore\n\n# Copy the workflows\ncp ~/.claude/plugins/manifest/workflows/*.yml .github/workflows/\n\n# Commit\ngit add .manifest/ .github/workflows/\ngit commit -m \"chore: add Manifest pipeline\"\n```\n\n### 3.4 Set GitHub secrets\n\nThe workflows reference these. Add them in repo Settings → Secrets:\n\n| Secret | Used by |\n|---|---|\n| `ANTHROPIC_API_KEY` | All workflows (Claude CLI auth) |\n| `SENTRY_AUTH_TOKEN` | `verify-deploy.yml`, `launch-monitor.yml` |\n| `AMPLITUDE_API_KEY` | `verify-deploy.yml`, `launch-monitor.yml` |\n| `SLACK_BOT_TOKEN` | `launch-monitor.yml` |\n| `JIRA_API_TOKEN` | `launch-monitor.yml` (bug watcher) |\n\n`GITHUB_TOKEN` is provided automatically by Actions.\n\n### 3.4b Native mobile (iOS / Android) setup\n\nThe default workflows run on `ubuntu-latest`, which is fine for web and\nAndroid but **not iOS** (`xcodebuild` is macOS-only). For a native repo,\nadjust its copy of the workflows:\n\n**iOS-native repo** — switch the `/implement` job and `verify-deploy.yml`\nto a macOS runner and set up Xcode:\n\n```yaml\njobs:\n  verify-deploy:\n    runs-on: macos-latest          # was ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: maxim-lobanov/setup-xcode@v1\n        with: { xcode-version: latest-stable }\n      # ... then the Manifest verify-deployment step (Sub-mode D: iOS)\n```\n\n**Android-native repo** — stay on `ubuntu-latest`, add Java + the SDK:\n\n```yaml\n      - uses: actions/setup-java@v4\n        with: { distribution: temurin, java-version: '17' }\n      - uses: android-actions/setup-android@v3\n      # connectedAndroidTest needs an emulator (reactivecircus/android-emulator-runner)\n```\n\n`repos.yml` for each: `framework: ios-native` (or `android-native`) so\nthe Implementer and verifier resolve `xcodebuild` / `gradlew` from\nSTACK-PROFILES. Per-repo secrets you'll also need: signing\n(certs/keystore), `GOOGLE_APPLICATION_CREDENTIALS` for Firebase Test\nLab, and the Claude auth token — each lives in its own repo's secrets.\n\n**Two separate native features, two repos, two teams** (your case): make\neach a single-platform contract (`platforms: [ios]` / `platforms:\n[android]`) in its own repo's `.manifest/contracts/`. They're\nindependent — no shared specs repo or cross-platform parity needed; the\nplatform-parity critic won't even fire on a single-platform contract.\nYou drive both since you have access; each team's CI secrets stay in\ntheir repo. Verification uses **Sub-mode D** (xcodebuild / gradlew +\nFirebase Test Lab + Crashlytics); rollout is **store staged release**,\nnot a flag, so a `rollback` verdict means *halt the staged rollout*.\n\n### 3.5 Decide your Slack channel\n\nBy convention, Manifest posts to `#manifest` for cross-contract events\nand a per-contract thread for everything else. Create the channel and\ninvite the bot user that owns `SLACK_BOT_TOKEN`.\n\n### 3.6 Pick your pilot feature\n\nThe single most important setup step. Pick something genuinely **Small\nbucket** — one platform, ≤3 behaviors, no schema, no auth changes. A\ncopy change, a new filter chip, a CSV export button. Resist the urge\nto test on something exciting.\n\n**Bonus criterion: pick a project that has some measurement infra\nin place.** Firebase Analytics is ideal; structured server logs are\nfine; a database the launch report can query also works. If none of\nyour candidate projects has any of these, Manifest still works — the\ncritics, Implementer, Verifier, and Bug Watcher all run regardless —\nbut the launch report will mark success metrics as \"unmeasured\"\nrather than confirming the feature landed. That's an honest verdict,\njust less compelling for the demo. If you have a choice, pilot on\nthe project with the richest measurement first.\n\n---\n\n## 4. Your first feature, hour by hour\n\nReal walkthrough on a Small contract with a 24h SLA. Times are illustrative.\n\n### T+0:00 — Tuesday 9:00 AM\nOpen Claude Code in your repo. Run:\n\n```\n/contract new \"Add CSV export button to /admin/users\"\n```\n\nThe intake skill asks five questions. You answer in ~5 minutes. A\ndraft contract lands at `.manifest/contracts/AU-007.md`.\n\n### T+0:15 — Verify\n```\n/contract verify AU-007\n```\n\nNine critics run in parallel. Total wall time: ~90 seconds. You get\nback a findings file with:\n- 2 warnings (instrumentation field empty on B1; comms-completeness\n  missing error state)\n- 1 info (perf budget defaulting to suggested values)\n\nYou open `AU-007.md`, fill in the missing fields. Re-run verify.\n\n### T+0:30 — Readiness green\nFindings file shows `readiness: verified`, complexity: `small`.\n\n```\n/contract promote AU-007\n```\n\nA revision file is created at `AU-007.r1.md`. A JIRA epic gets\nopened. A GitHub tracking issue lands with the SLA timer prominently\nshown: \"Due: 2026-05-20 09:30 (T+24h)\". A Slack message hits\n`#manifest`: \"🚀 *Add CSV export to admin users* (AU-007) promoted —\nsmall · SLA 24h\".\n\n### T+0:45 — Open the PR\nYou open a draft PR with a one-line description referencing the\ncontract. Comment on the PR:\n\n```\n@claude /implement AU-007\n```\n\nThe `pr-verify.yml` workflow fires. You see \"Implementer running…\"\nappear in the PR's Checks tab.\n\n### T+1:00 to T+8:00 — Implementer works\nYou go about your day. The Implementer:\n1. Clones the repo\n2. Reads `AU-007.r1.md`\n3. Writes `.manifest/contracts/AU-007.implementation-plan.md`\n4. Adds the CSV export button, the export endpoint, and the\n   instrumentation event\n5. Generates `tests/AU-007.spec.ts` with one Playwright test per AC\n6. Runs lint, typecheck, unit tests, Playwright locally — all green\n7. Pushes commits\n\nPeriodically the workflow re-runs verify-pr on each push and updates\nthe AC coverage comment.\n\n### T+8:00 — Slack ping\nYou get a Slack DM: \"PR #142 ready for your review. 3 ACs covered.\nAll tests green. AC coverage report attached.\"\n\n### T+8:30 — Human review (30 min)\nYou open the PR. Read the AC coverage comment. Skim the diff. The\ntests passed, so you're not verifying behavior — you're verifying\nthat the diff is sane and the approach matches house style. Looks\ngood. Approve. Merge.\n\n### T+9:00 — Deploy to QA\nYour existing CI deploys main to QA. The `verify-deploy.yml`\nworkflow fires. The Verifier agent:\n1. Runs Playwright against the QA URL\n2. Samples Amplitude for the `users_csv_exported` event firing\n3. Checks Sentry for new errors tagged to this release\n4. Posts a verdict: `ready-for-canary`\n\n### T+10:00 — Slack approval for canary\n\"AU-007 ready for canary at 1%. Error rate baseline 0.02%. No\nregressions. Approve?\"\n\nYou click ✅ in Slack.\n\n### T+10:00 to T+18:00 — Staged rollout\nYou bump the flag through the `rolloutPlan` stages: 1% → 10% → 50% →\n100%. At each stage, `rollback-guard` samples Sentry every 30 minutes\nand posts a verdict + the next recommended step (`/canary AU-007` shows\nit any time): \"healthy, baked 2h — advance to 10%.\" No breach, so you\nadvance at each green check. Reaches 100% by T+18:00. The guard\nrecommends; you flip the flag — it never advances the rollout for you.\n\nYou leave for the day. SLA met with 6h to spare.\n\n### T+24:00 — Day 1 launch report\nNext morning, you wake up to a Slack DM: \"*Add CSV export to admin\nusers* — Day 1 launch report. Verdict: *landed (preliminary)*.\n`users_csv_exported` firing at 23/day, error rate 0.05% (budget 0.5%).\nNo bug clusters.\"\n\n### T+7, 14, 28 days — landing window\nDaily bug triage runs. Launch reports at day 7, 14, 28. Final\nverdict at day 28: `landed`. The contract's `landed: true` is\ncommitted. Monitoring window closes. Done.\n\n---\n\n## 5. Medium feature variant\n\nSame flow, longer cycle. The differences:\n\n- **Spec phase** takes ~8 hours instead of 1, because the contract\n  spans web + iOS and has 5+ behaviors that need parity specs.\n- **Build phase** runs the Implementer twice in parallel — once per\n  platform. The plugin opens two linked PRs and the AC coverage\n  comments are split per platform.\n- **Human review** is ~1 hour, not 30 minutes, because there's more\n  ground to cover.\n- **Canary** holds at each stage longer (4h at 10%, 8h at 50%) to\n  catch cross-platform interactions.\n- **Total budget**: ~72h.\n\nEverything else is the same.\n\n---\n\n## 6. What happens when things go wrong\n\n### A critic emits a blocker you can't resolve\n**Common case**: regression critic flags a conflict with existing code.\n**Fix**: edit the contract to resolve (clarify the interaction, or\nchange the approach). Mark the finding `dismissed` with a reason\n*only* if the critic is wrong — and prefer to fix the contract over\ndismissing.\n\n### The Implementer's tests don't pass\n**The agent iterates on its own**. It only pushes when local tests are\ngreen. If it gets stuck (5+ iterations without progress), it posts a\ncomment asking the human for guidance and stops. The contract may\nhave a contradiction the agent couldn't resolve.\n**Fix**: read the agent's last comment. Usually it identifies the\nambiguity. Update the contract, re-run `/implement`.\n\n### Verifier says `hold` after QA deploy\nSome AC failing or some event not firing.\n**Fix**: read the deploy report. The Verifier files a Task back to\nthe Implementer with the failure detail; the Implementer iterates on\nthe same PR. No human re-review needed unless the failure suggests\nthe contract was wrong.\n\n### Verifier says `rollback`\nCritical AC fails OR error rate exceeds budget OR zero events firing.\n**Fix**: revert the deploy (your normal CI process). Don't bump the\ncanary. Run `/postmortem \u003cID>` to record `landed: rolled-back`, capture\na blameless postmortem, and reopen the work — then fix the contract or\nthe implementation and start the build phase over. The SLA timer pauses\nwhile you're in rollback (mark the tracking issue accordingly).\n\n### Sentry spikes mid-canary\n`rollback-guard` (running every 30 min) flips its verdict to `hold` or\n`recommend-rollback` and posts a top-level Slack alert with the breached\nsignal and the recommended action. It does not pause or revert the\nrollout itself — you assess: real regression or noise?\n**Real**: flip the flag back to 0% and run `/postmortem AU-007` to\ncapture what happened. Don't progress to 100% until fixed.\n**Noise**: hold at the current stage, then advance once the next guard\ncheck is green again.\n\n### Launch report says `not-landed` at day 28\nThe feature shipped but didn't move the metric. This is information,\nnot failure.\n**Fix**: read the qualitative section of the report for hypotheses.\nFile a follow-up contract that addresses the gap. Don't quietly drop\nthe metric — the verdict is committed to the contract for posterity.\n\n### A finding keeps coming back after you \"fixed\" it\nThe critic's prompt is wrong for your context. Edit the critic's\nSKILL.md to be more specific to your codebase, your conventions,\nor your team's definition. Skills are markdown — change them in\nplace. This is the *whole point* of skills being editable.\n\n---\n\n## 7. The skill catalog (quick reference)\n\n### Authoring\n| Skill | Purpose |\n|---|---|\n| `contract-new` | Five-question intake → draft contract markdown |\n| `contract-verify` | Validator + relevant judgment critics; compute readiness |\n| `contract-promote` | Freeze revision, start SLA, create JIRA epic + GH issue |\n\n### Critics (run by `contract-verify`)\n| Critic | What it checks |\n|---|---|\n| `critic-edge-cases` | Missing scenarios, state transitions, error paths |\n| `critic-platform-parity` | Behaviors specified for each platform in scope |\n| `critic-instrumentation` | Every behavior has an event; success metrics map to events |\n| `critic-comms-completeness` | Empty/loading/success/error states + notifications |\n| `critic-perf-budget` | Every behavior has explicit TTI/latency/error thresholds |\n| `critic-regression` | Reads codebase; flags conflicts with existing behaviors |\n| `critic-security` | Auth, PII, injection surfaces, audit logging |\n| `critic-scalability` | N+1 risks, unbounded growth, hot paths, external deps |\n| `critic-sizing` | Runs LAST; classifies as Small / Medium / Large |\n\n### Agents\n| Skill | Purpose |\n|---|---|\n| `implement` | Heavy. Reads revision, writes code + Playwright tests, opens PR |\n| `verify-deployment` | Runs ACs against a live URL, samples telemetry, posts verdict |\n| `launch-report` | Day 1/7/14/28 post-launch verdict with quant + qual evidence |\n| `bug-triage` | Daily scan of Sentry + support + reviews; files JIRA |\n\n---\n\n## 8. Slash command catalog\n\n```\n/contract new \"\u003cdescription>\"       # Start a new contract\n/contract verify \u003cID>                # Run all critics\n/contract promote \u003cID>               # Freeze + start SLA\n/implement \u003cID>                      # Trigger Implementer (best run in PR comment)\n/verify-pr \u003cPR-URL>                  # Re-run AC coverage on an existing PR\n/launch \u003cID> [--day N]               # Manual launch report for a contract\n```\n\n---\n\n## 9. FAQ\n\n**Q: Can I edit a contract after promote?**\nYes. Edits fork a new revision. The currently-running pipeline keeps\nusing its snapshot revision; the next promote uses the new state.\n\n**Q: Can the Implementer run locally on my laptop?**\nYes (`/implement \u003cID>` in your editor), but the recommended pattern\nis to trigger from a PR comment so the heavy work runs in CI and\nyour laptop is free.\n\n**Q: What if my team uses a different test framework than Playwright?**\nEdit `skills/implement/SKILL.md`. Replace the Playwright references\nwith your framework. The skill is markdown — that's the whole point.\n\n**Q: What if our PRDs are 30 pages?**\nThe contract format is opinionated about structure. If your existing\nPRDs don't fit, do the intake fresh via `/contract new` rather than\ntrying to import. The structure is what makes critics tractable.\n\n**Q: Do we need all the MCPs to start?**\nNo. Start with GitHub + Sentry + Slack. Add Amplitude/Firebase\nAnalytics when you want real launch reports. Add JIRA when you want\nbug auto-filing. Each addition unlocks more.\n\n**Q: What about features that don't fit the format — research,\nexploration, A/B tests?**\nThose use the regular cycle. The critic-sizing skill will refuse\nto size them as Small or Medium, and Large bucket exits the\npipeline. Manifest is for \"we know what we want, ship it\" features.\n\n**Q: Can multiple contracts run through the pipeline at once?**\nYes. They're independent. The orchestrator handles them in parallel.\nJIRA epics, tracking issues, and Slack threads are per-contract.\n\n**Q: What if I promote a contract and then realize it's wrong?**\nUpdate the contract, re-verify, re-promote (which forks a new\nrevision). The running build phase uses its snapshot, so the in-flight\nwork may need to be discarded — close the PR, file a new one against\nthe new revision.\n\n**Q: Where do I customize critic behavior for my team?**\nEach critic is a markdown SKILL.md file. Edit it. The system prompt\nin the file IS the critic. Add team-specific rules, examples, or\nconstraints. Commit the changes to the plugin and the whole team\ngets them.\n\n**Q: How do I know if a critic is over-firing or missing things?**\nRun the pipeline on 2–3 real features. Track which findings turned\nout to be useful vs noise. Tighten or loosen the SKILL.md\naccordingly. Critics improve with use, not with speculation.\n\n---\n\n## 10. Where to go next\n\nAfter your first pilot completes (ideally a small feature run end to\nend in 24h):\n\n1. **Tune the critics** that over-fired or missed things on your real\n   feature. Edit SKILL.md files in place.\n2. **Add one missing critic** if the pilot revealed a gap not covered\n   by the existing nine.\n3. **Run a Medium pilot** once you trust the Small flow.\n4. **Connect optional MCPs** — Amplitude/Firebase, JIRA, Figma — and\n   feel each one earn its place.\n5. **Don't touch Large bucket** until you've done at least 5 Small\n   and 3 Medium successfully.\n\nThe whole point of Manifest being a plugin is that you can iterate on\nit. Skills are markdown. Workflows are YAML. Commit and the team gets\nthe upgrade. Start small. Improve in flight.\n"},{"id":"CHANGELOG","path":"CHANGELOG.md","base":"CHANGELOG.md","title":"Changelog","md":"# Changelog\n\nAll notable changes to Manifest. Versions follow semver. Install a\nspecific version by tag rather than tracking `main`, so your team gets\nreproducible behavior:\n\n```\n/plugin install manifest@manifest   # pulls the tagged release in the marketplace\n```\n\nEvery findings file records the `pluginVersion` that produced it (see\n`CRITIC-PROTOCOL.md`), so you can always tell which version verified a\ngiven contract.\n\n## [0.19.0] — self-tuning models: smart routing, advisor escalation, cost observability, and a learning loop\n\nThe system now chooses the right model for each task itself, escalates the\nhard calls to a stronger model, measures its own token cost, guards its own\ndeterminism, and learns from each incident — without anyone having to pick a\nmodel. The consistent rule: everything non-deterministic (model-choice\nvariance, the advisor, token cost) is kept strictly out of the verdict path,\nso the \"verdict is computed, not judged\" property is unchanged.\n\n### Added\n\n- **Smart per-critic model routing (`computeModelPlan`).** The validator now\n  emits a `modelPlan` that assigns each critic a model deterministically from\n  the contract's `sizing` — light critics on a fast model, heavy critics\n  (regression/security/scalability) on a strong model **only** when the\n  contract is large/risky (8+ behaviors, 3+ platforms, or an auth/billing/\n  migration flag). A trivial fix verifies cheap; an auth-flow change across\n  three platforms automatically pulls the strong model onto the heavy critics.\n  Nobody picks a model. Override per-critic with `conventions.criticModels` in\n  `repos.yml`. Routing is pure code over an already-deterministic input, so it's\n  reproducible — not an LLM classifier.\n\n- **`/advisor` escalation.** The Implementer (the token-heaviest step) can pair\n  a mid-tier main model with a strong advisor it consults at decision points —\n  before committing to a plan, before declaring done, when a fix loop is stuck.\n  Opt-in via the `MANIFEST_ADVISOR_MODEL` / `MANIFEST_IMPLEMENTER_MODEL` repo\n  variables in `pr-verify.yml` (Anthropic-API only; unset = unchanged). Critics\n  may also consult the advisor on borderline **`warning`/`info`** calls only,\n  opt-in via `conventions.criticAdvisor` — never blockers (enforced; see below).\n\n- **Cost / token observability (`/manifest cost`).** A deterministic rollup\n  (`validate.mjs --cost`) prices recorded token `usage` from\n  `reference/model-pricing.json` and reports spend by complexity, model tier,\n  and critic, across both verify critics (`findings.json`) and the Implementer\n  (`\u003cID>.implement.json`). This closes the loop on routing — you can measure\n  whether tiering and the advisor actually saved money. Usage is observability\n  only: never a gate or provenance input.\n\n- **Finding-stability / variance tracker (`recall.mjs --stability`).** Scores N\n  repeated runs of a fixture — per-gap hit rate, run-to-run stdev of required\n  recall, and a flaky-gap list — failing if a required gap drops below\n  `stabilityThreshold`. Guards the judgment layer against drift introduced by\n  per-tier model routing. Opt-in `eval.yml` sweep gated on\n  `MANIFEST_STABILITY_RUNS` (off by default — it multiplies LLM cost by N).\n\n- **Postmortem → bug-pattern learning loop.** When `/postmortem` finds a\n  diff-detectable bug class, it proposes a candidate in\n  `reference/bug-patterns.candidates.md` (staging — unenforced). A maintainer\n  promotes accepted patterns into `BUG-PATTERNS.md`, where `code-review`\n  enforces them on every future diff, so the same class of bug can't ship\n  twice. Safety: human-accept gate + `warning`-until-proven default. A\n  deterministic catalog validator (`--check-patterns`, `--next-pattern-id`)\n  guards structure (well-formed entries, unique + monotonic ids) and runs in CI.\n\n- **Context-compaction resilience for long Implementer runs.** Multi-hour runs\n  overflow the context window and the runtime auto-summarizes lossily. The\n  Implementer now externalizes its working state to\n  `\u003cID>.implement-state.json` (AC status, files touched, decisions),\n  checkpoints after every behavior, and re-reads spec/plan/state files as\n  ground truth instead of trusting summarized memory.\n  `validate.mjs --implement-status \u003cID>` recovers what's done and what's left in\n  ~100 tokens after a summarization and makes runs resumable. Schema + status\n  unit-tested.\n\n- **Compact critic rule digest (`CRITIC-RULES.md`) — cuts input tokens ×N.**\n  The ~9 critics fanned out per verify each re-read the full `CRITIC-PROTOCOL.md`\n  (≈290 lines) every run. They now load a compact digest (~70 lines) with only\n  what's needed to emit valid output — schema, severity enum, ID prefixes,\n  determinism caps, anti-patterns, framing, the advisor constraint. The full\n  protocol stays the source of truth for orchestrator/maintainer concerns\n  (provenance, cost, model pinning); a test enforces the digest can't drift from\n  the validator's enum/prefixes/caps. The orchestrator also passes critics the\n  spec content, not the machine provenance/sidecars.\n\n### Changed\n\n- **Findings provenance schema → v2 (`protocolVersion` 1 → 2).** `verifiedWith`\n  now records a per-tier `models` map + `complexity` instead of a single\n  `model` scalar, because critics run on different models. Documented in\n  `CRITIC-PROTOCOL.md`. **Compatibility:** this bump invalidates v1 verify\n  caches by design — a findings file written under the old schema can't say\n  which model produced each finding, so the next verify re-runs. No action\n  needed; it self-corrects on first re-verify.\n\n- **The promotability gate stays deterministic even with the advisor.**\n  `validateFindings` now **rejects** any advisor-influenced finding\n  (`metadata.advisorConsulted: true`) that is a `blocker`. Advisor escalation is\n  structurally confined to the advisory layer, so the gate (zero open blockers)\n  is never influenced by a non-deterministic call. Enforced in code and gated by\n  `--check-findings` in CI, not just documented.\n\n### Notes\n\n- Token `usage` blocks populate only when the runtime exposes per-subagent token\n  counts; when unavailable the block is omitted and everything else is\n  unaffected.\n- Design rationale for the whole release is in\n  `docs/proposals/model-tiering-and-advisor.md` and\n  `docs/proposals/next-features-roadmap.md`.\n\n## [0.18.2] — code quality hardening + dashboard-style PRs + plain-English comments\n\nDriven by Cursor BugBot findings on the first Manifest-shipped PRs.\nThree categories of bug were slipping past `code-review` and getting\ncaught in PR review instead. This patch closes them at three layers\n(spec, implementer, critic) and reshapes the PR body so reviewers\nread a single dashboard, not scattered comments.\n\n### Changed\n\n- **`critic-edge-cases`: new state-machine consistency check.** Catches\n  contracts that contradict themselves about the same state transition\n  (e.g. \"only tap/Esc/blur ends the session\" alongside \"errors stop the\n  session\"). For every named transition the contract mentions, the\n  critic now enumerates every statement about it and flags\n  disagreements as blockers when the spec is genuinely undecidable.\n  The \"rapid double-action\" finding also escalates from warning to\n  blocker when no concrete guard (AC / outOfScope) is named — race\n  conditions on rapid clicks were the second Cursor-flagged pattern.\n\n- **`code-review`: three new high-recurrence patterns added to the\n  checklist.** Each catches a real Cursor-flagged class:\n  - Empty catch followed by state mutation / analytics / side effects\n    that assume the try block succeeded → blocker.\n  - `useState` flag used as a race guard (handler reads stale state\n    across rapid double-clicks) → warning with `useRef` / `disabled`\n    fix suggestion.\n  - No-op error handling (caught and not re-thrown, logged, or\n    surfaced) → warning, blocker when hiding user-visible failure.\n\n- **`code-review`: findings now require plain-English fields.** Output\n  schema gains `plainTitle`, `whatHappens`, `whyItMatters`, `theFix`,\n  `codeSnippet` alongside the legacy `message`/`suggestion`. Findings\n  render in the four-part style from `reference/PR-COMMENT-STYLE.md`\n  — a busy reviewer (or a PM, or a junior dev) can act on a finding\n  in 10 seconds. No more \"useState flag used as concurrency guard\"\n  as the lead.\n\n- **`implement`: pre-write reconnaissance is mandatory.** Before\n  creating any file or symbol, the implementer must (a) grep for\n  existing matches in the target repo, (b) read 1–3 sibling files in\n  the target folder to learn conventions, (c) consult\n  `.manifest/.cache/code-context.json` for existing events / i18n /\n  flags / shared modules / similar past contracts. The recon findings\n  go into the PR body so the reviewer can see what was checked. This\n  is the single change that prevents duplicate-utility and\n  convention-mismatch bugs.\n\n- **`implement`: mandatory pre-push self-review pass.** The\n  implementer now runs the `code-review` critic on its own diff\n  *before* the first push. Max 2 fix iterations to clear blockers\n  in-place; if anything remains, push with a self-review comment\n  naming the open issues. Catches the empty-catch / race / no-op-error\n  class before CI does. The implementer's own self-review summary\n  becomes a section in the PR body so the reviewer can see what was\n  caught and fixed.\n\n- **`implement`: PR body becomes a dashboard.** New required template\n  with sections: \"What this PR does\" (plain English), Contract +\n  SLA + acceptance criteria count, **Mermaid diagram of the\n  change**, Files changed (one-liner per file), AC coverage map,\n  \"What I read before writing code\" (recon report), Self-review\n  summary, How to test locally, Risk callouts. A reviewer with 30\n  seconds knows what / why / what to look at; a reviewer with 5\n  minutes can merge confidently without opening other tabs.\n\n- **`reference/BUG-PATTERNS.md` — new living catalog of bug shapes.**\n  Every external reviewer finding (Cursor BugBot, human reviewer,\n  postmortem) that wasn't already caught is permanently added as a\n  `BP-NNN` entry. The implementer reads the catalog before writing\n  (pre-empts every pattern); the `code-review` critic checks the\n  catalog on every diff. The catalog is one-way ratchet — patterns\n  never get caught twice. Seeded with three entries from recent\n  Cursor findings (empty-catch + side-effects, useState-as-race-\n  guard, no-op error handling) plus two adjacent (analytics-before-\n  success, state-after-unmount) and one common React (missing\n  effect deps).\n\n- **`reference/RECOMMENDED-LINT-RULES.md` — copy-paste lint configs\n  per stack.** Most of BUG-PATTERNS is mechanically catchable by the\n  right linter rules at the right severity. Document gives the\n  exact ESLint / Dart analyzer / golangci-lint / ruff blocks plus\n  TypeScript / mypy strictness flags. Repos that adopt all four\n  sections typically see Cursor findings drop by ~70% within a few\n  PRs — the catalog patterns get rejected at editor save time.\n\n- **Self-review must re-scan the FULL catalog on every iteration.**\n  This is the structural fix to the \"Cursor finds new things each\n  round\" problem. Fixing one finding often introduces (or reveals)\n  another. The implementer's pre-push loop now runs `code-review`\n  with the entire BUG-PATTERNS catalog on each iteration — not just\n  the previous round's class. Convergence: by iteration 2, every\n  pattern has been scanned; round 3 catches only genuinely-new\n  issues, not the next-shape-in-line.\n\n- **Self-review is tunable, default on.** New `repos.yml` keys:\n  - `selfReview: on | off | auto` — `auto` runs only when the diff\n    has ≥ `selfReviewMinChangedLines` changed lines (default 0;\n    set higher to skip on small diffs).\n  - `selfReviewMaxIterations: 2` — cap on fix rounds before pushing\n    with a self-review comment that names the unresolved issues.\n  Cost note (in the example config + this release's docs): self-\n  review adds ~30s – 3min per i
