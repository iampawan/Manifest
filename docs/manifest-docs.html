sistency.** For every named transition (start / stop / end /\nrestart / error / timeout / teardown / etc.):\n\n1. Enumerate every place that transition is mentioned in the\n   contract.\n2. Compare the statements.\n3. Flag disagreements — blocker if the spec becomes genuinely\n   undecidable, warning otherwise.\n4. The suggestion must include the exact disambiguating language\n   to add (not just \"this contradicts itself\").\n\nPlus the \"rapid double-action\" finding (which existed but defaulted\nto warning) is now escalated to blocker unless an AC or `outOfScope`\nline names a concrete guard.\n\n### Code layer — `code-review` got three high-recurrence patterns\n\nEvery Cursor BugBot finding from the test PRs maps to a pattern now\nexplicit in `skills/code-review/SKILL.md`:\n\n- **Empty catch + side effects.** Any `catch (e) {}` / `catch {}`\n  followed by state mutation / analytics / navigation that pretends\n  the try block succeeded → blocker. Must re-throw, log + bail, or\n  contain only genuinely side-effect-free logic.\n- **`useState` as race guard.** Handler reading a React state value\n  to decide \"am I running?\" races against batched re-renders → warning\n  with `useRef` / `disabled` fix suggested.\n- **No-op / silently-swallowed errors.** Caught errors that aren't\n  re-thrown, reported to error tracking, or surfaced to the user →\n  warning minimum; blocker when hiding user-visible state failure.\n- Plus two adjacent patterns: analytics fired before the action\n  succeeded (skews funnels), and state writes after unmount / dispose\n  (memory bugs / warnings).\n\n### Finding format — plain English, four parts, code snippet\n\n`reference/PR-COMMENT-STYLE.md` is the new canonical style. Every\nfinding now renders in this shape:\n\n> 🐛 **Race condition on rapid clicks**\n>\n> When the user clicks the mic button twice quickly, the second\n> click runs before React has updated `isRecording`. The guard\n> thinks the session is still off and fires again — resetting\n> `insertedCharCount` to 0.\n>\n> **Why it matters.** Users who double-tap (common on mobile,\n> common when impatient) will lose their dictation character count\n> and may see weird state during the brief overlap.\n>\n> **The fix.** Use `useRef` for the \"is it running\" flag instead\n> of `useState`. Refs update synchronously, so the second click\n> sees the right value.\n>\n> ```ts\n> // before\n> const [isRecording, setIsRecording] = useState(false)\n> // after\n> const isRecordingRef = useRef(false)\n> ```\n>\n> `voice-dictation-toolbar-button.tsx:42`\n\nSame finding, before this release:\n\n> CR-007: useState flag used as concurrency guard. The handler reads\n> `isRecording` from state which is stale across rapid renders.\n> Suggest `useRef`.\n\nThe output schema now requires `plainTitle`, `whatHappens`,\n`whyItMatters`, `theFix`, `codeSnippet` fields. Legacy `message` and\n`suggestion` are kept for tooling. Findings missing the new fields\nare surfaced as critic bugs — the old terse format can't leak\nthrough.\n\n### Implementer — pre-write reconnaissance + pre-push self-review\n\nTwo structural changes in `skills/implement/SKILL.md`:\n\n**Pre-write recon (now mandatory, step 3 in the skill):**\n- `grep` for every symbol the plan says to create. If it exists, use\n  it. Don't create `formatDate2` next to `formatDate`.\n- Read 1–3 sibling files in the target folder. The plan says *what*\n  to build; the sibling shows *how this team builds it*. Copy the\n  structure.\n- Consult `.manifest/.cache/code-context.json` — existing events,\n  i18n keys, flags, shared modules, similar past contracts, rolled-\n  back history. Use what's there; don't duplicate.\n- Note the recon findings in the PR body — transparency for the\n  reviewer.\n\n**Pre-push self-review (step 7b, now mandatory):**\n- Run the `code-review` critic on the diff *before* pushing.\n- Max 2 in-place fix iterations to clear blockers.\n- If anything remains, push with a self-review comment naming the\n  open issues — don't churn.\n- Catches the empty-catch / race / no-op-error class before CI does.\n\n### PR body — dashboard, not a paragraph\n\nThe implementer's PR body now follows a required template\n(in `skills/implement/SKILL.md` step 8):\n\n```\n## What this PR does\n\u003c2–3 sentences. Plain English. PM + new-engineer test.>\n\n## Contract\n\u003cID · title · sizing · SLA · AC count · link to revision>\n\n## Shape of the change\n\u003cMermaid diagram, either from the contract's Diagrams section or\ngenerated for this PR. Required, not optional.>\n\n## Files changed\n\u003cTable: file | one-liner of why it changed.>\n\n## AC coverage\n\u003cTable: AC | what it checks | test file:line | ✅/❌>\n\n## What I read before writing code\n\u003cThe recon report — sibling files read, code-context cache used,\nexisting patterns followed.>\n\n## Self-review summary\n\u003cCode-review critic findings the implementer caught and fixed\nitself, plus any genuinely open issues.>\n\n## How to test locally\n\u003cExact commands + a manual path the reviewer can walk in a minute.>\n\n## Risk callouts\n\u003cWhere to look first if this breaks. Required section — write\n'no risky areas' if true; don't skip it.>\n```\n\nA reviewer with 30 seconds knows what / why / what to scrutinize.\nA reviewer with 5 minutes can merge without opening other tabs.\n\n### The \"Cursor never finds anything new\" mechanism\n\nThe bigger structural fix in 0.18.2 is the bug-pattern catalog +\nmandatory full-scan self-review. The problem we were solving:\n\n> *Cursor catches issue A → dev fixes → Cursor catches B → dev\n> fixes → Cursor catches C → ...* Each round wastes dev time.\n\nThe fix isn't smarter critics for \"this PR.\" It's a catalog that\ngrows every time something slips through, and a self-review loop\nthat always scans the full catalog — so fixing pattern A doesn't\nleave the agent ignorant of pattern B.\n\n**`reference/BUG-PATTERNS.md`** is the catalog. Six entries seeded\nfrom recent Cursor findings (BP-001 ... BP-006); intended to grow\none direction only. Every Cursor / human / postmortem finding that\nwasn't already in the catalog becomes a permanent `BP-NNN`. The\nimplementer pre-empts the patterns at write time; the code-review\ncritic verifies at self-review time. Same source of truth.\n\n**`reference/RECOMMENDED-LINT-RULES.md`** is the mechanical layer.\nMost of the catalog patterns are catchable by the right ESLint /\nDart analyzer / golangci-lint / ruff rules at the right severity.\nDocument gives the exact configs per stack. Repos that adopt all of\nthem typically see Cursor findings per PR drop ~70% within a few\nPRs — because the linter rejects the patterns at editor save time,\nbefore the AI sees the diff.\n\n**Self-review now re-scans the full catalog on every iteration.**\nPreviously the implementer's pre-push self-review fixed the round's\nfindings and pushed. The agent didn't know to look for the next\npattern in the catalog. Now: every iteration loads\n`reference/BUG-PATTERNS.md` and checks every active pattern. By\niteration 2, the agent has scanned for every known shape. Round 3\neither catches genuinely-new issues (which then become new BP\nentries) or is empty.\n\nThe end state: external reviewers should find nothing new on a\ngiven PR. When they do, the finding gets added to the catalog and\nthe next PR pre-empts it. Whack-a-mole becomes a ratchet.\n\n### Self-review is tunable\n\nDefault is on. If your team measures and finds self-review eats\nmore than it saves on your diff sizes, dial it via `repos.yml`:\n\n```yaml\nimplementer:\n  selfReview: on             # default — always run\n  # selfReview: off          # skip; CI / external reviewers\n                             #   become first line of defense\n  # selfReview: auto         # run only on diffs ≥ threshold\n  selfReviewMinChangedLines: 0   # used only when \"auto\"\n  selfReviewMaxIterations: 2\n```\n\nThe math (per PR):\n\n| Scenario | Before 0.18.2 | After (selfReview: on) | Delta |\n|---|---|---|---|\n| Clean PR, never any findings | ~5 min | ~9 min | **+4 min** (per run) |\n| PR with 1 external-reviewer round | ~20 min | ~10 min | **-10 min** |\n| PR with 3 external-reviewer rounds | ~45 min | ~12 min | **-33 min** |\n\nCompute roughly 1.5–2× per PR (the critic runs once pre-push and\nagain in CI). The agent-time tradeoff is worth it for any team\nwhere dev attention is more expensive than agent compute and where\nPRs would otherwise take more than 1 iteration. If your PRs ship\nclean on first push consistently, `selfReview: auto` with a\nthreshold (e.g. 30) keeps the cost only where the value is.\n\n### Workflow — optional static-check block\n\n`workflows/pr-verify.yml` now has a commented-out section with the\ncanonical lint / typecheck / test commands per stack (Node / Flutter /\nGo). Repos relying on Manifest for CI can uncomment their block;\nrepos whose own CI already runs these can leave it off. The AI\ncritics run regardless — this just catches the mechanical issues\nfaster and cheaper.\n\n---\n\n## Upgrade\n\n```\n/plugin marketplace update manifest\n/plugin install manifest@v0.18.2\n```\n\nNo config changes. Existing contracts, repos.yml, and workflows\nkeep working unchanged. The next implementer run produces the new\nPR body automatically; the next pickup run uses the consistency\ncheck automatically.\n\n---\n\n## What this is NOT\n\n- Not a fix to existing PRs already shipped (those got the old\n  output — re-run `@claude /implement \u003cID>` or `@claude /fix-pr \u003cID>`\n  to refresh).\n- Not a change to the contract format. Existing contracts stay\n  valid as-is.\n- Not stack-aware static checks turned on by default — that's the\n  uncommented block in the workflow; opt in if you want it.\n\n---\n\n## Why this is 0.18.2, not 0.18.1\n\n0.18.1 fixed the *pickup* skill (the Spec entry). 0.18.2 fixes the\n*implementer + reviewer* skills (the Build phase). Different code\npaths, different bugs, different test PRs. The motivating Cursor\nfindings landed in the implementer's output and should never have\nreached the reviewer in their original form.\n\n---\n\n## Try the difference\n\nRe-run the implementer on a contract you've shipped recently. You\nshould see:\n\n1. The PR body opens with a Mermaid diagram of the change, not a\n   prose paragraph.\n2. The body has a \"What I read before writing code\" section listing\n   the sibling files and code-context entries consulted.\n3. The body has a \"Self-review summary\" showing what the\n   implementer caught and fixed before pushing.\n4. Any `code-review` comments use the plain-English four-part\n   format — title with emoji, what-happens, why-it-matters,\n   the-fix with snippet, file:line.\n5. If you put a contract through pickup with a self-contradiction\n   (e.g., two clauses about the same state transition disagreeing),\n   the verify step flags it as a blocker with the specific\n   disambiguating language to add.\n\n---\n\n**Full changelog:** see [CHANGELOG.md](../../CHANGELOG.md#0182--code-quality-hardening--dashboard-style-prs--plain-english-comments).\n"},{"id":"docs-releases-v0-18-1","path":"docs/releases/v0.18.1.md","base":"v0.18.1.md","title":"v0.18.1 — pickup skill hardening from first real-run feedback","md":"# v0.18.1 — pickup skill hardening from first real-run feedback\n\n**TL;DR.** Three fixes to `/contract pickup` from the first real\nend-to-end test. The skill prose was the difference between \"works on\npaper\" and \"behaves the way the docs claim.\" No API changes, no new\ndependencies, no migration. Existing 0.18.0 contracts and `repos.yml`\nconfigs keep working.\n\nIf you tried 0.18.0 and felt that pickup almost-but-not-quite did\nwhat it said on the tin, this is the patch that closes the gap.\n\n---\n\n## What changed\n\n### 1. Phase 2 now runs the full critic set inline, unambiguously\n\n**What was wrong in 0.18.0.** The skill prose said \"run critics in\nparallel\" but left enough ambiguity that the agent could draft the\ncontract, run only `critic-code-context` (the new dev-side critic),\nand then suggest `/contract verify` as the next step. The first real\ntest produced exactly that: a card with Bucket A populated but no\nedge-cases / security / instrumentation findings, and \"next: run\n`/contract verify`\" at the bottom. That's the *old* two-step flow,\nnot pickup.\n\n**What's fixed.** The skill is now explicit: pickup IS the verify. In\nPhase 2 the agent runs:\n\n- The deterministic validator (`scripts/validate.mjs`).\n- The standard judgment critics selected per content — edge-cases,\n  regression, security (unless purely cosmetic), instrumentation (if\n  metrics/events), comms-completeness (if user-facing), platform-\n  parity (if >1 platform), scalability (if data/server), perf-budget\n  (if non-default budget).\n- `critic-code-context` for the auto-fill proposals.\n\nAll in **one parallel Task batch**, and `.findings.md` +\n`.findings.json` get written exactly as `contract-verify` would write\nthem. Two new anti-patterns explicitly forbid (a) suggesting\n`/contract verify` as a next step and (b) producing a card with only\nBucket A.\n\n### 2. Phase 1.0 preflight — no more silent degradation\n\n**What was wrong in 0.18.0.** Running pickup without\n`.manifest/repos.yml` produced a card with a casual note at the end:\n\"PM-channel automation and answer-watcher are inert — fine here.\" That\nhid a real loss: the cross-repo regression scan, the cached auto-fill\ncatalog, the PM-channel routing, and the answer-watcher all depend on\n`repos.yml`. The dev shouldn't be told it's \"fine\" by the agent — the\ndev should be told what's actually missing and decide.\n\n**What's fixed.** Pickup now starts with a preflight check (Phase\n1.0) before fetching anything. If `.manifest/repos.yml` is missing:\n\n> Heads up — there's no `.manifest/repos.yml` in this repo, so\n> pickup is going to run with these pieces missing:\n>\n>   - Cross-repo regression scan — won't see related code in\n>     other repos.\n>   - Auto-fill from code (Bucket A) — limited to whatever I can\n>     find in this repo on the fly; no cached event catalog / i18n.\n>   - PM-channel automation — questions won't be routed to the\n>     right tool because I don't know which channel your team uses.\n>   - Answer-watcher — nothing to poll.\n>\n> Two options:\n>\n>   1. Set it up first — I'll run `/manifest setup`, ~30 seconds.\n>      Then I'll resume pickup.\n>   2. Skip and continue — pickup will still draft a useful\n>      contract from the source, but those four features above\n>      won't kick in.\n\nIf the dev picks (1), the agent invokes `/manifest setup` and resumes\npickup after it completes. If (2), the contract gets\n`pickup.degradedMode: true` in frontmatter so the rest of the pipeline\nknows not to expect the missing pieces. Same gate triggers when a\ncritical MCP isn't connected for the pasted source URL.\n\n### 3. Card output reframed for someone reading their first pickup\n\n**What was wrong in 0.18.0.** Sample output:\n\n```\nSC-001 — Voice dictation in the script editor · draft · medium · web\n\nBucket A — auto-filled from code (4) ✅\n┌──────────────────────┬─────────────────────────────────────────────┐\n│ Item                 │ Value                                       │\n├──────────────────────┼─────────────────────────────────────────────┤\n│ Text insertion API   │ editor.tf.insertText() via useEditorRef()   │\n│ Toolbar wiring       │ ToolbarTypes → ToolbarMapper → index.tsx    │\n│ Punctuation commands │ Reuse applyPunctuationCommands (extract …)  │\n│ Analytics shape      │ BUTTON_CLICK + action/screen pattern        │\n└──────────────────────┴─────────────────────────────────────────────┘\n```\n\nFine for someone who already knew the codebase. Opaque if you don't.\nA new team member, a stakeholder, or anyone reading the contract\nlater sees random IDs and file paths with no context.\n\n**What's fixed.** Card layout rules now:\n\n- **Feature title in plain English leads.** The contract ID\n  (`SC-001`) drops to a small metadata row, not the title.\n- **Bucket headlines in plain English.** \"Agent filled in 4 from your\n  code\" instead of \"Bucket A — auto-filled from code (4)\". Bucket\n  letters stay in the JSON findings for tooling but don't surface in\n  the human card.\n- **Every technical reference gets a plain-English line above it.**\n  `editor.tf.insertText() via useEditorRef()` is the receipt; the\n  prose (\"How the new text gets inserted into the editor — same\n  pattern as the existing draft handler\") is the answer.\n- **File paths drop to `↳ refs:` footnotes.** Table columns made\n  refs feel load-bearing; footnotes signal \"auditable detail.\"\n- **Jargon gets a parenthesized gloss the first time it appears.**\n  \"AnalyserNode tap (a tiny audio-meter that doesn't store audio)\"\n  on first mention; terse on later mentions.\n- **Question IDs (`Q-1…Q-4`) never appear in the human card.** They\n  live in the contract frontmatter and the `qa.md` sidecar.\n\nSame information density; more accessible default.\n\n---\n\n## Upgrade\n\nTwo commands:\n\n```\n/plugin marketplace update manifest\n/plugin install manifest@v0.18.1\n```\n\nOr, if you track the tag-based install:\n\n```\n/plugin install manifest@manifest\n```\n\n…will pull v0.18.1 once published.\n\nNo config changes required. Existing `repos.yml` entries keep\nworking. Contracts authored under 0.18.0 don't need migration — the\nnew preflight only triggers for new pickups.\n\n---\n\n## What this is NOT\n\n- Not a security or correctness fix in the validator / critics / CI\n  workflows.\n- Not a change to the contract `.md` format or the critic protocol.\n- Not a new entry point or new subcommand.\n\nThis is purely skill prose hardening. The agent's behavior catches\nup to what the 0.18.0 docs already promised.\n\n---\n\n## Test the difference\n\nRe-run pickup on the same task that gave you the confusing 0.18.0\noutput. You should see:\n\n1. If you have no `repos.yml`: the agent stops at the preflight\n   and asks before proceeding. The 0.18.0 silent-degrade ending\n   (\"fine here\") is gone.\n2. The card leads with your feature in plain English, not the\n   `SC-NNN` ID.\n3. Bucket items have a plain-English line per item with `↳ refs:`\n   underneath, not table columns.\n4. The \"Next steps\" line does NOT suggest `/contract verify`. It\n   suggests review/edit, the fix loop, sending PM questions,\n   `/contract promote`, or `/implement`.\n\n---\n\n**Full changelog:** see [CHANGELOG.md](../../CHANGELOG.md#0181--pickup-skill-hardening-from-first-real-run-feedback).\n"},{"id":"docs-releases-v0-18-0","path":"docs/releases/v0.18.0.md","base":"v0.18.0.md","title":"v0.18.0 — dev-centric pickup flow","md":"# v0.18.0 — dev-centric pickup flow\n\n**TL;DR.** Most real-world PRDs live in JIRA / Google Docs / Slack /\nNotion — not in Manifest. The PM writes one, hands it off, and walks\naway. The dev does the rest. v0.18.0 ships a new entry point for that\ncase: `/contract pickup \u003csource>`. The dev pastes any link or text;\nthe agent does the code archaeology and surfaces every gap in three\nbuckets you can act on in minutes.\n\nOpt-in per repo. Existing flows unchanged. See \"Known gaps\" below\nfor what's still deliberately deferred.\n\n---\n\n## Why this release\n\nThe PM-authors-the-contract flow we shipped in 0.17 works when the PM\nis in Cowork / Claude Code with you. In the real world, most PMs:\n\n- Write PRDs in JIRA, Google Docs, Slack, Notion, or as a screenshot\n  of slides.\n- Don't know the code, the history, or the dependencies.\n- Hand the PRD to a dev and move on to the next thing.\n\nSo the dev is the one who has to make the PRD build-ready — by reading\nthe code, grepping the archive, checking Slack for prior context,\nfinding past bugs on the same surface, and going back to the PM with\nthe *right* questions (without pinging them five times across the day).\n\nManifest 0.18 does that work *for* the dev. The PM stays in their\nnormal tool and never has to touch Manifest.\n\n---\n\n## What's new\n\n### `/contract pickup \u003csource>`\n\nA new subcommand. Source is anything:\n\n| You paste this | Agent reads via |\n|---|---|\n| `https://your-org.atlassian.net/browse/ENG-1234` | Atlassian MCP |\n| `https://docs.google.com/document/d/...` | Google Drive MCP |\n| `https://linear.app/...` | Linear MCP |\n| `https://notion.so/...` | Notion MCP |\n| `https://yourcorp.slack.com/archives/.../p...` | Slack MCP |\n| `https://figma.com/file/...` | Figma MCP |\n| Pasted text | direct |\n| A dropped image | multimodal |\n\nThe agent fetches it, follows links inside it one level deep (Figma\ninside JIRA, tech spec inside the Google Doc, the linked Notion\npage), and pulls related history in the background — past contracts\non the same surface, postmortems, recent Sentry, open PRs touching\nthe same files.\n\nThen it shows you one card with every gap sorted into three buckets.\n\n### The three-bucket gap sorter\n\nEvery gap in the PRD lands in exactly one of:\n\n- **A. Agent fills from code/history.** High-confidence proposals\n  with a source. Things like \"perfBudget = 50ms (stack default)\",\n  \"event name = `filter_applied` (matches your event catalog)\",\n  \"empty-state copy = reuse `i18n/search.no_results`\", \"AC for B3\n  drafted from SC-088's combined-filter AC.\" Each one is a single\n  tap to accept or edit.\n- **B. Dev decides.** Engineering judgment the PM can't give. Things\n  like \"past contract SC-103 hit a memory leak in chip rendering —\n  use the new pattern from SC-211 instead?\", \"search endpoint p95 is\n  50ms; two filters will push past — add a cache layer?\", \"open PR\n  #4421 also touches this path — coordinate?\"\n- **C. Only PM can answer.** Genuine product unknowns. Each is\n  drafted as a PM-facing question scoped to a behavior, in plain\n  language. You review the wording, edit if needed, hit send. All of\n  them go out as **one batched JIRA comment / Slack reply / Notion\n  comment** in your voice. PM answers in their tool. You move on.\n\n### PM-channel question posting\n\nDrafted Bucket C questions go to the PM via the channel the source\ncame from:\n\n- JIRA ticket → JIRA comment on the same ticket\n- Slack thread → reply in thread\n- Notion → page comment\n- Google Doc → suggestion comment\n\nPosted in *your* voice, with your name on it. The PM sees a normal\nmessage from the dev they handed work to. Optional `— \u003cyou> (via\nManifest)` footer for audit trail (`pickup.identifyAgent` in\n`repos.yml`).\n\n### Answer watcher\n\nAfter you send, the agent watches the PM channel for replies.\nPolling cadence: every 5 min for the first 2h, every 15 min for the\nnext 24h, hourly after that. When the PM answers:\n\n1. Parses the answer per question.\n2. Applies it as an AC edit (new AC, refined behavior description,\n   or `outOfScope` add).\n3. Drops a provenance comment: `\u003c!-- From: Q-N · \u003cPM> · \u003cdate> --\u003e`\n4. Moves the resolved question to a sidecar `\u003cID>.qa.md` log file.\n5. Re-verifies incrementally on just the changed fragments.\n6. Pings you with a one-line summary of what changed.\n\nImplementation on non-blocking behaviors can run in parallel while\nyou wait. Default is non-blocking; you flag a question as blocking\nif you genuinely can't start without the answer.\n\n### `critic-code-context`\n\nA new dev-side critic. Different from `critic-regression` (which\nflags *risks*); this one proposes *answers*. It feeds the Bucket A\nauto-fills and Bucket B dev-decides items by reading a precomputed\ncache of:\n\n- The event catalog and naming conventions in your code.\n- All i18n keys.\n- Stack defaults for perf budgets and required comms states.\n- Similar past contracts on the same surface (especially archived\n  rolled-back / partial ones — they're full of lessons).\n- The dependency graph: shared modules, feature flags, A/B tests,\n  endpoint budgets.\n- Locale / device / segment branches the code already handles that\n  the PRD might not address.\n\nEvery Bucket A proposal points to its source (a file path + line, or\na contract ID + fragment). Your trust is in the trace, not the\nsuggestion.\n\n---\n\n## How to try it\n\nPull v0.18.0 and turn pickup on for one repo first:\n\n```yaml\n# .manifest/repos.yml\npickup:\n  enabled: true\n  identifyAgent: true       # adds \"(via Manifest)\" footer to PM-facing posts\n  defaultChannel: jira      # or: slack | notion | gdoc\n  blockingByDefault: false  # questions are non-blocking unless you flag them\n  cacheTTL: 24h             # codebase analysis cache lifetime\n```\n\nThen on a real JIRA ticket your PM assigned you:\n\n```\n/contract pickup https://your-org.atlassian.net/browse/ENG-1234\n```\n\nYou'll see a card with the draft contract + the three-bucket gap\nview in ~30 seconds. Tap through Bucket A, walk Bucket B, send\nBucket C to your PM in one click.\n\nWithout `pickup.enabled: true`, the command falls back to\n`/contract new` with a notice. Nothing changes for repos that don't\nopt in.\n\n---\n\n## When to use which entry point\n\n| You're in this situation | Use |\n|---|---|\n| PM is in Cowork with you, writing the spec together | `/contract new` (unchanged) |\n| PM wrote the spec elsewhere and handed it off | `/contract pickup \u003csource>` *(new)* |\n| Quick bug fix, no real spec | `/fix` (unchanged) |\n| Already-promoted contract going through CI | unchanged: `@claude /implement`, `verify-pr`, etc. |\n\nThe pickup flow doesn't replace anything; it adds the missing entry\npoint for the case the rest of the pipeline assumed away.\n\n---\n\n## What also shipped (folded in mid-cycle)\n\nTwo pieces that started as \"known gaps\" made it into v0.18 itself:\n\n- **`scripts/build-code-context.mjs`** — the cache builder for\n  `critic-code-context`. Scans repos for event catalogs, i18n keys,\n  flags, shared modules; indexes past contracts by surface; flags\n  rolled-back / partial history. Output: `.manifest/.cache/code-context.json`.\n  Sub-second lookups after the first build. Runnable locally OR on\n  the nightly cron at `workflows/code-context-build.yml`.\n\n- **`scripts/answer-watcher.mjs`** — polls PM channels for replies to\n  open pickup-flow questions. Emits a JSON report the contract-pickup\n  skill consumes in apply-mode. Runnable locally OR on the 15-minute\n  cron at `workflows/answer-watch.yml`.\n\n## Known gaps (still deferred)\n\nThese are listed so you know what to expect when you first try it:\n\n- **Answer-watcher channel adapters return `mcp-unavailable` from a\n  raw Node process.** They log what they would call when you pass\n  `--verbose`. Production detection needs either (a) running from\n  inside Claude Code / Cowork (the relevant MCP is available there)\n  or (b) a thin REST proxy on the MCP host. The harness + report\n  schema ship in v0.18; production wiring is the next patch. As a\n  workaround: re-run `/contract pickup` after your PM replies — the\n  skill picks up the new comment via MCP.\n- **Cross-repo cache builder** reads from local clones via the\n  `path:` field in `repos.yml`. Entries with only `github:` (no\n  local clone) are skipped — pulling source via the GitHub MCP from\n  the builder is a follow-up.\n- **Slack message-link parsing** covers the common URL shape\n  (`/archives/\u003cchannel>/p\u003ctimestamp>`). Exotic workspace URLs may\n  need a follow-up.\n- **PM-facing wording** is sometimes too jargony on first run. The\n  skill instructs the agent to use plain language, but until you've\n  picked up a few contracts on your team's vocabulary, *read the\n  drafted message before sending*. Edit freely; the default text is\n  a starting point, not final.\n\n---\n\n## Existing flows — unchanged\n\nIf you don't enable pickup, this is a no-op release. All v0.17.0\nbehavior is preserved:\n\n- `/contract new`, `/contract verify`, `/contract fix`,\n  `/contract promote`, `/contract decompose`, `/contract diagram`,\n  `/contract migrate`, `/contract archive`\n- `@claude /implement`, `@claude /fix-pr`\n- `verify-pr.yml`, `verify-deploy.yml`, `rollback-guard.yml`,\n  `launch-monitor.yml`\n- `/fix`, `/status`, `/canary`, `/rollback-check`, `/postmortem`,\n  `/launch`\n\nNo frontmatter changes to existing contracts. No new required\nfields. No migration needed.\n\n---\n\n## Install / upgrade\n\nIf you installed via the marketplace:\n\n```\n/plugin install manifest@manifest\n```\n\n…will pull 0.18.0 once the tag is published.\n\nIf you're tracking a specific tag:\n\n```\n/plugin install manifest@v0.18.0\n```\n\nIf you cloned for development, just `git pull` on `main` (after the\n0.18.0 merge lands).\n\n---\n\n## Roadmap context\n\nThis release is the first piece of a broader vision laid out in\n[ROADMAP.md](../../ROADMAP.md) — UGC Agents covering Development,\nCustomer Support, and Operations. Pickup is the dev-handoff piece of\nthe Development pillar. Next likely shipments:\n\n- Cache builder for `critic-code-context` (turns first pickup from\n  ~30s to sub-second).\n- Cron-backed answer watcher (so you don't have to re-run pickup\n  when PM answers).\n- Post-launch tracking agent (4-week DM cadence after 100% rollout\n  with quantitative + qualitative verdict).\n- NTO ticket auto-debug for the Customer Support pillar.\n\n---\n\n## Credits + feedback\n\nTested on a small set of repos before this release. If you try\npickup, the most useful feedback is:\n\n- Which Bucket A proposals were wrong (so the cache schema can\n  improve).\n- Which PM-facing question wordings you had to rewrite (so the\n  drafting prompts can improve).\n- Which sources the fetcher tripped on (links it should have followed\n  but didn't, formats it choked on).\n\nOpen an issue with `[pickup]` in the title.\n\n---\n\n**Full changelog:** see [CHANGELOG.md](../../CHANGELOG.md#0180--dev-centric-pickup-flow-opt-in).\n"}]}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('docdata').textContent);
  var byId = {}, byBase = {};
  DATA.sections.forEach(function(s){ s.docs.forEach(function(d){ byId[d.id]=d; byBase[d.base]=d; }); });
  document.getElementById('ver').textContent = 'v' + (DATA.version||'');
  document.getElementById('meta').textContent = DATA.docCount + ' documents · generated ' + DATA.generated;

  // sidebar — pin a prominent "Start here" CTA at the top for onboarding
  var nav = document.getElementById('nav');
  var startDoc = byBase['QUICKSTART.md'];
  if (startDoc){
    var sa=document.createElement('a'); sa.className='start'; sa.href='#'+startDoc.id;
    sa.innerHTML='★ Start here<small>5-minute quickstart — new to Manifest?</small>';
    sa.dataset.id=startDoc.id; sa.dataset.search='start here quickstart onboarding getting started new';
    nav.appendChild(sa);
  }
  DATA.sections.forEach(function(s){
    var docs=s.docs.filter(function(d){ return !startDoc || d.id!==startDoc.id; });
    if(!docs.length) return;
    var g = document.createElement('div'); g.className='group'; g.textContent=s.title; nav.appendChild(g);
    docs.forEach(function(d){
      var a=document.createElement('a'); a.href='#'+d.id; a.textContent=d.title;
      a.dataset.id=d.id; a.dataset.search=(d.title+' '+d.path).toLowerCase(); nav.appendChild(a);
    });
  });

  if (window.marked) marked.setOptions({ gfm:true, breaks:false });

  function render(id){
    var d = byId[id] || DATA.sections[0].docs[0];
    var el = document.getElementById('doc');
    el.innerHTML = '<div class="crumbs">'+d.path+'</div>' + marked.parse(d.md);
    // heading anchors
    el.querySelectorAll('h1,h2,h3,h4').forEach(function(h){
      if(!h.id) h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    });
    // rewrite cross-doc .md links to in-page hashes
    el.querySelectorAll('a[href]').forEach(function(a){
      var href=a.getAttribute('href'); if(!href) return;
      var b=href.split('/').pop().split('#')[0];
      if(byBase[b]) a.setAttribute('href','#'+byBase[b].id);
      else if(/^https?:/.test(href)) a.target='_blank';
    });
    // highlight
    if(window.hljs) el.querySelectorAll('pre code').forEach(function(c){ try{hljs.highlightElement(c);}catch(e){} });
    // active link
    document.querySelectorAll('nav a').forEach(function(a){ a.classList.toggle('active', a.dataset.id===d.id); });
    document.querySelector('.main').scrollTop=0;
    var act=document.querySelector('nav a.active'); if(act) act.scrollIntoView({block:'nearest'});
    document.title = d.title + ' — Manifest Docs';
    document.querySelector('.side').classList.remove('open');
  }

  window.addEventListener('hashchange', function(){ render(location.hash.slice(1)); });
  render(location.hash.slice(1) || DATA.sections[0].docs[0].id);

  // search filter
  var search=document.getElementById('search');
  search.addEventListener('input', function(){
    var q=this.value.toLowerCase().trim();
    document.querySelectorAll('nav a').forEach(function(a){
      a.classList.toggle('hide', q && a.dataset.search.indexOf(q)===-1);
    });
    document.querySelectorAll('.group').forEach(function(g){
      var n=g.nextElementSibling, any=false;
      while(n && n.tagName==='A'){ if(!n.classList.contains('hide')) any=true; n=n.nextElementSibling; }
      g.style.display = any || !q ? '' : 'none';
    });
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && document.activeElement!==search){ e.preventDefault(); search.focus(); }
  });
})();
</script>
</body>
</html>
