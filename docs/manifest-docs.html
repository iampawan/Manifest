 by side effects assuming success\n\n**Where it bites**: A failed action reports as successful in the UI,\nanalytics, or downstream state. User sees \"recording started\" but no\nrecording happens. Funnels are skewed.\n\n**The shape**:\n\n```ts\ntry {\n  recognition.start()\n} catch (e) {\n  // empty\n}\nsetIsRecording(true)                      // pretends success\ntrackEvent('dictation_started', { ... })  // pretends success\n```\n\n**Why it slips past basic review**: TypeScript and the basic `no-empty`\nESLint rule allow `catch {}` if `allowEmptyCatch: true`. Reviewers\nfocused on the happy path miss the catch. The bug only surfaces when\n`start()` actually throws (mic busy, prior session not torn down).\n\n**The fix**:\n\n```ts\ntry {\n  recognition.start()\n  setIsRecording(true)\n  trackEvent('dictation_started', { ... })\n} catch (e) {\n  reportError(e, { surface: 'dictation' })\n  toast('Couldn't start dictation. Check your microphone.')\n  // do NOT setIsRecording(true); do NOT fire the start event\n}\n```\n\n**Where first observed**: example-app/editor PR (UWS-502\nvoice-dictation), Cursor BugBot 2026-06-04.\n\n---\n\n### BP-002 — useState flag as concurrency guard\n\n**Where it bites**: Rapid double-action (double-click, double-tap,\ndouble-submit) bypasses the guard and re-enters. State that was\nsupposed to be guarded (counters, accumulators, in-flight requests)\ngets reset or duplicated.\n\n**The shape**:\n\n```ts\nconst [isRunning, setIsRunning] = useState(false)\n\nconst handleClick = useCallback(() => {\n  if (isRunning) return            // stale read across rapid clicks\n  setIsRunning(true)\n  beginAction()\n}, [isRunning])\n```\n\nReact batches state updates and may not have re-rendered between\ntwo rapid clicks. The second click reads the *stale* `isRunning`\n(still `false`) and re-enters.\n\n**Why it slips past basic review**: It looks textbook React. The\nrace is invisible until tested with `userEvent.dblClick` or a real\ndouble-tap.\n\n**The fix**:\n\n```ts\nconst isRunningRef = useRef(false)\n\nconst handleClick = useCallback(() => {\n  if (isRunningRef.current) return  // synchronous read; no race\n  isRunningRef.current = true\n  beginAction()\n}, [])\n\n// or: disable the button while in flight\n\u003cbutton disabled={isRunning} onClick={handleClick}>...\u003c/button>\n```\n\nFor complex flows, use both — `useRef` for the guard, `useState` for\nthe UI's disabled flag.\n\n**Where first observed**: example-app/editor PR (UWS-502\nvoice-dictation), Cursor BugBot 2026-06-04.\n\n---\n\n### BP-003 — No-op / silently-swallowed errors\n\n**Where it bites**: A failure happens, nothing tells the user, nothing\ntells the team. Reported as \"it just doesn't work\" weeks later. The\nsupport ticket has no logs to trace.\n\n**The shape**:\n\n```ts\ntry {\n  await api.savePreference(...)\n} catch (e) {\n  console.log(e)   // not Sentry, not user-facing, just stdout in dev\n}\n```\n\nor:\n\n```ts\ntry {\n  parse(input)\n} catch (e) {\n  // intentionally ignored\n}\nreturn null  // and the caller does nothing meaningful with null\n```\n\n**Why it slips past basic review**: `console.log` looks like\nlogging. The reviewer sees \"error is handled\" and moves on. In\nproduction there's no console reader, the error vanishes.\n\n**The fix**:\n\n```ts\ntry {\n  await api.savePreference(...)\n} catch (e) {\n  reportError(e, { surface: 'preferences.save', userId })\n  toast('Couldn't save your preference. Try again.')\n  // OR re-throw if the caller can handle it\n}\n```\n\nEvery catch must answer two questions: (a) is the user told?\n(b) is the team told? If both are \"no,\" it's BP-003.\n\n**Where first observed**: example-app/editor PR (UWS-502\nvoice-dictation), Cursor BugBot 2026-06-04.\n\n---\n\n### BP-004 — Analytics fired before action succeeded\n\n**Where it bites**: Funnel metrics lie. `feature_started` count is\nhigher than `feature_completed` count by more than it should be,\nbecause `_started` fires even when the start failed.\n\n**The shape**:\n\n```ts\ntrackEvent('checkout_started')         // fires unconditionally\nconst ok = await beginCheckout()\nif (!ok) return showError()\n// no start event was actually a real start\n```\n\n**Why it slips past basic review**: Analytics is often added late;\nreviewers don't think about funnel math.\n\n**The fix**:\n\n```ts\nconst ok = await beginCheckout()\nif (!ok) {\n  trackEvent('checkout_start_failed', { reason })\n  return showError()\n}\ntrackEvent('checkout_started')         // fires only on real start\n```\n\n**Where first observed**: Inferred from BP-001 — same root pattern;\ngets its own ID because the fix is different (don't move catch, move\nthe event-fire).\n\n---\n\n### BP-005 — State writes after unmount / dispose\n\n**Where it bites**: React warns \"Cannot update state on an unmounted\ncomponent.\" Flutter throws \"setState called after dispose.\" Go panics\non a channel send to a closed channel. Memory leaks. Sentry noise.\n\n**The shape**:\n\n```ts\nuseEffect(() => {\n  fetch('/data').then(res => {\n    setData(res)   // component may be unmounted by now\n  })\n}, [])\n```\n\n**Why it slips past basic review**: Works fine 99% of the time.\nThe 1% is a route change mid-fetch.\n\n**The fix**:\n\n```ts\nuseEffect(() => {\n  let alive = true\n  fetch('/data').then(res => {\n    if (alive) setData(res)\n  })\n  return () => { alive = false }\n}, [])\n\n// or, with AbortController for cancellation upstream:\nuseEffect(() => {\n  const ctrl = new AbortController()\n  fetch('/data', { signal: ctrl.signal })\n    .then(res => setData(res))\n    .catch(err => { if (err.name !== 'AbortError') reportError(err) })\n  return () => ctrl.abort()\n}, [])\n```\n\n**Where first observed**: Common React pattern; called out by Cursor on\nmultiple repos in the wild. Promoted here as a default check.\n\n---\n\n### BP-006 — Effect missing dependencies (or worse, lying about them)\n\n**Where it bites**: Effect uses a value but doesn't list it in deps;\nthe effect closes over a stale value. Or worse, the developer added\n`// eslint-disable-next-line react-hooks/exhaustive-deps` to silence\nthe warning.\n\n**The shape**:\n\n```ts\nuseEffect(() => {\n  setupListener(userId)   // userId is read, not declared\n}, [])\n```\n\nor:\n\n```ts\n// eslint-disable-next-line react-hooks/exhaustive-deps\nuseEffect(() => { ... }, [a, b])  // missing c, with a comment hiding it\n```\n\n**Why it slips past basic review**: ESLint catches it *if* the rule\nis on and not disabled. Many repos disable it locally for\n\"refactoring later.\"\n\n**The fix**: list every value the effect reads. If you need to\nintentionally not re-run on a value change, refactor — extract to a\nref or restructure the effect — don't lie with `disable-next-line`.\n\n`react-hooks/exhaustive-deps: error` (not warn) at the repo's eslint\nroot is the mechanical fix. See `reference/RECOMMENDED-LINT-RULES.md`.\n\n**Where first observed**: Common React; promoted here as a default\ncheck.\n\n---\n\n## Stack-specific equivalents\n\nEach pattern above has a canonical analogue in other stacks. The\ncritic should flag them by the same `BP-NNN` even when the language\ndiffers:\n\n| Pattern | TS/React | Flutter | Go | Python |\n|---|---|---|---|---|\n| BP-001 | empty `catch` + setState | empty `catch` + setState | empty `if err != nil {}` + side effects | bare `except: pass` + state mutation |\n| BP-002 | `useState` race | `setState` race in BLoC stream | unbuffered channel read race | shared dict mutation without lock |\n| BP-003 | `console.log(e)` | `print(e)` | `_ = err` | `pass` in except |\n| BP-005 | state after unmount | `setState` after `dispose` | send on closed channel | task after loop close |\n| BP-006 | missing effect deps | missing `riverpod` deps | missing context propagation | n/a |\n\nWhen adding a new pattern in TS, also write the Go / Flutter\nequivalent if obvious; this keeps the catalog cross-stack.\n\n---\n\n## How the catalog gets used end-to-end\n\n```\nPR is shipped → Cursor / human / postmortem flags a pattern we missed\n              ↓\n        add BP-NNN entry here\n              ↓\n   next /implement run reads this file as part of pre-write recon\n   (avoids the pattern at write time)\n              ↓\n   next /implement self-review runs code-review with the full library\n   (catches the pattern if it slipped through anyway)\n              ↓\n   pattern is permanently caught from this point forward\n```\n\nThe catalog has a one-way ratchet: every Cursor finding makes the\nnext PR cleaner. No pattern is ever caught twice.\n\n---\n\n## Audit\n\nQuarterly, scan recent PRs against the catalog:\n\n- Patterns flagged by external reviewers (Cursor, humans) but NOT in\n  this file → add as BP-NNN.\n- Patterns in this file but never triggered by the critic → either\n  the critic prompt is missing the cue, or the pattern is no longer\n  relevant; investigate and update.\n\nThe audit lives at `eval/bug-patterns.test.mjs` (TBD) — a future\npatch will add a recall scorer that re-runs the critic against a\nfixture diff per pattern and fails CI if any pattern's detection\ndrops.\n"},{"id":"reference-bug-patterns-candidates","path":"reference/bug-patterns.candidates.md","base":"bug-patterns.candidates.md","title":"Bug-pattern candidates — staging (NOT active)","md":"# Bug-pattern candidates — staging (NOT active)\n\nPatterns proposed by postmortems land here first. **Nothing in this file is\nenforced** — the `code-review` critic only reads `BUG-PATTERNS.md`. A human\nreviews each candidate and, if it's a real, generalizable, diff-detectable\nclass of bug, promotes it into `BUG-PATTERNS.md` (see \"Accepting a candidate\"\nin that file). This human-accept gate is deliberate: auto-activating a check\non every PR risks false-positive blockers across the whole team.\n\nEach candidate uses the same entry format as the active catalog, plus two\nextra fields the promoter resolves:\n\n- `**Severity**:` — `warning` by default for machine-proposed patterns\n  (promote to `blocker` only once it's proven precise).\n- `**Status**:` — `provisional` while in this file.\n\nValidate this file's structure any time with:\n\n```\nnode scripts/validate.mjs --check-patterns reference/BUG-PATTERNS.md reference/bug-patterns.candidates.md\n```\n\n---\n\n## Candidates\n\n\u003c!-- Postmortems append candidate entries below this line. Empty for now. --\u003e\n"},{"id":"reference-STACK-PROFILES","path":"reference/STACK-PROFILES.md","base":"STACK-PROFILES.md","title":"Stack profiles (toolchain reference)","md":"# Stack profiles (toolchain reference)\n\nManifest assumes NOTHING about your stack. Skills that build or test\ncode (`implement`, `verify-deployment`) read the toolchain from\n`repos.yml`. If a repo declares an explicit `toolchain`, that wins. If\nit only declares a `framework`, skills infer sensible defaults from the\ntable below. If your stack isn't listed, declare `toolchain` explicitly\nand it works anyway.\n\nThis file is the single source of default commands. Change a default\nhere and every skill inherits it.\n\n## How resolution works\n\nFor any repo, a skill resolves each command in this order:\n\n1. **Explicit `toolchain.\u003ccommand>` in `repos.yml`** — always wins.\n2. **Inferred from `framework`** — using the defaults table below.\n3. **Inferred from `languages`** — coarser fallback if no framework.\n4. **If still unknown** — the skill STOPS and asks the user for the\n   command rather than guessing. Never run a guessed build/test command.\n\n## repos.yml shape\n\n```yaml\n- name: web\n  framework: nextjs          # drives default toolchain\n  languages: [typescript, tsx]\n  eventSdk: amplitude\n  # Optional explicit overrides — only specify what differs from defaults:\n  toolchain:\n    test: \"npm run test:ci\"        # override just this one\n    # install / lint / build / testE2E inherited from the nextjs profile\n```\n\n## Default toolchains by framework\n\n### Web\n\n| framework | install | test | testE2E | lint | typecheck | build | eventSdk default |\n|---|---|---|---|---|---|---|---|\n| `nextjs` | `npm ci` | `npm test` | `npx playwright test` | `npm run lint` | `tsc --noEmit` | `npm run build` | amplitude |\n| `react` (Vite) | `npm ci` | `npm test` | `npx playwright test` | `npm run lint` | `tsc --noEmit` | `npm run build` | amplitude |\n| `react` (CRA) | `npm ci` | `npm test -- --watchAll=false` | `npx cypress run` | `npm run lint` | `tsc --noEmit` | `npm run build` | amplitude |\n| `vue` | `npm ci` | `npm run test:unit` | `npx playwright test` | `npm run lint` | `vue-tsc --noEmit` | `npm run build` | amplitude |\n| `angular` | `npm ci` | `ng test --watch=false` | `npx playwright test` | `ng lint` | `tsc --noEmit` | `ng build` | amplitude |\n| `svelte` | `npm ci` | `npm test` | `npx playwright test` | `npm run lint` | `svelte-check` | `npm run build` | amplitude |\n\n### Mobile\n\n| framework | install | test | testE2E | lint | build | eventSdk default |\n|---|---|---|---|---|---|---|\n| `flutter` | `flutter pub get` | `flutter test` | `flutter test integration_test/` | `flutter analyze` | `flutter build apk --release` / `flutter build ios --release` | firebase |\n| `ios-native` (Swift) | `xcodebuild -resolvePackageDependencies` | `xcodebuild test -scheme \u003cS>` | `xcodebuild test -scheme \u003cS>UITests` | `swiftlint` | `xcodebuild -scheme \u003cS> build` | firebase |\n| `android-native` (Kotlin) | `./gradlew dependencies` | `./gradlew test` | `./gradlew connectedAndroidTest` | `./gradlew lint` (or ktlint/detekt) | `./gradlew assembleRelease` | firebase |\n| `react-native` | `npm ci && npx pod-install` | `npm test` | `npx detox test` | `npm run lint` | `npx react-native run-android/ios` | amplitude |\n\nFor native iOS/Android, the scheme/module name comes from the repo's\n`srcDir` or an explicit `toolchain.scheme` / `toolchain.module`.\n\n### Backend\n\n| framework / language | install | test | lint | build | eventSdk default |\n|---|---|---|---|---|---|\n| `express` / `nestjs` / `fastify` (Node) | `npm ci` | `npm test` | `npm run lint` | `npm run build` | amplitude-node |\n| `fastapi` / `flask` / `django` (Python) | `pip install -r requirements.txt` | `pytest` | `ruff check` | `—` | server-side firebase / custom |\n| `gin` / `echo` / stdlib (Go) | `go mod download` | `go test ./...` | `golangci-lint run` | `go build ./...` | custom |\n| `rails` (Ruby) | `bundle install` | `bundle exec rspec` | `rubocop` | `—` | custom |\n| `spring` (Java/Kotlin) | `./gradlew dependencies` | `./gradlew test` | `./gradlew checkstyleMain` | `./gradlew build` | custom |\n\n## Test framework + file conventions per stack\n\nThe Implementer writes tests in the idiom of the target repo. The\ntest it generates per acceptance criterion depends on the stack:\n\n| Stack | Test framework | Test file location | Tag convention |\n|---|---|---|---|\n| Next/React | Playwright or Cypress | `e2e/` or `cypress/e2e/` | `@contract:\u003cID> @ac:\u003cACn>` in test name |\n| Vue/Angular/Svelte | Playwright | `e2e/` | same |\n| Flutter | `integration_test` / Patrol | `integration_test/` | contract id in test name |\n| iOS native | XCTest / XCUITest | `\u003cApp>UITests/` | contract id in test method name |\n| Android native | Espresso / JUnit | `androidTest/` | contract id in test method name |\n| Node backend | Jest / Vitest | `tests/` or `__tests__/` | `@contract:\u003cID>` in describe block |\n| Python backend | pytest | `tests/` | `test_contract_\u003cID>_\u003cACn>` |\n| Go backend | `testing` | `*_test.go` | `TestContract\u003cID>_\u003cACn>` |\n\n## Instrumentation SDK call patterns per stack\n\nThe instrumentation critic and the Implementer use these to find/emit\nanalytics events:\n\n| eventSdk | emit call | grep pattern (for collision check) |\n|---|---|---|\n| amplitude (web) | `track('\u003cevent>', {...})` | `track\\(['\"]\u003cevent>` |\n| amplitude-node | `amplitude.logEvent({event_type:'\u003cevent>'})` | `logEvent.*\u003cevent>` |\n| firebase (Flutter) | `FirebaseAnalytics.instance.logEvent(name:'\u003cevent>')` | `logEvent.*name:.*\u003cevent>` |\n| firebase (iOS) | `Analytics.logEvent(\"\u003cevent>\", parameters:)` | `logEvent\\([\"']\u003cevent>` |\n| firebase (Android) | `firebaseAnalytics.logEvent(\"\u003cevent>\", bundle)` | `logEvent\\([\"']\u003cevent>` |\n| mixpanel (web) | `mixpanel.track('\u003cevent>')` | `mixpanel.track\\(['\"]\u003cevent>` |\n| segment | `analytics.track('\u003cevent>')` | `analytics.track\\(['\"]\u003cevent>` |\n| custom / server-log | per the repo's logging convention | declared in repos.yml |\n\n## The hard rule\n\nA skill must NEVER run a build or test command it inferred with low\nconfidence. If `framework` is unset and `languages` doesn't map to a\nknown profile, the skill stops and asks: \"What's the test command for\nthis repo?\" — and suggests adding it to `repos.yml` so it's not asked\nagain. Guessing a wrong command wastes a CI run and erodes trust.\n"},{"id":"reference-PR-COMMENT-STYLE","path":"reference/PR-COMMENT-STYLE.md","base":"PR-COMMENT-STYLE.md","title":"PR-comment style","md":"# PR-comment style\n\nThe one rule that everything else follows: **a PR comment is read by\nthe busiest person on the team.** Write so they understand in 10\nseconds what's wrong, why it matters, and what to do.\n\nThe opposite of this style is what AI tools commonly produce:\n\n> CR-007: useState flag used as concurrency guard. The handler reads\n> `isRecording` from state which is stale across rapid renders.\n> Suggest `useRef`.\n\nThat's technically correct but reads like a compiler error. A junior\ndev seeing it asks \"what does that *mean*?\" A PM seeing it skips it.\n\nThis is the same finding rewritten in this style:\n\n> 🐛 **Race condition on rapid clicks**\n>\n> When the user clicks the mic button twice quickly, the second\n> click runs before React has updated `isRecording`. The guard\n> thinks the session is still off and fires again — resetting\n> `insertedCharCount` to 0.\n>\n> **Why it matters.** Users who double-tap (common on mobile, common\n> when impatient) will lose their dictation character count and may\n> see weird state during the brief overlap.\n>\n> **The fix.** Use `useRef` for the \"is it running\" flag instead\n> of `useState`. Refs update synchronously, so the second click\n> sees the right value.\n>\n> ```ts\n> // before\n> const [isRecording, setIsRecording] = useState(false)\n> const beginSession = useCallback(() => {\n>   if (isRecording) return       // stale across rapid clicks\n>   setIsRecording(true)\n>   void startRecording()\n> }, [isRecording, startRecording])\n>\n> // after\n> const isRecordingRef = useRef(false)\n> const beginSession = useCallback(() => {\n>   if (isRecordingRef.current) return   // synchronous, no race\n>   isRecordingRef.current = true\n>   void startRecording()\n> }, [startRecording])\n> ```\n>\n> `voice-dictation-toolbar-button.tsx:42`\n\nSame information. The second one a junior reads and acts on; a PM\nreads and understands the user impact.\n\n## The four-part structure (every finding)\n\nEvery PR comment / critic finding follows this:\n\n### 1. Title line — a plain-English diagnosis\n\n- Lead with what's happening, not the rule name. \"Race condition on\n  rapid clicks\" > \"useState flag used as concurrency guard.\"\n- One emoji at the start helps scanning: 🐛 bug / ⚠️ risk / 💡 nit\n  / 🔒 security / 🐢 perf. One emoji, no more.\n- Bold the title. Eight words or fewer.\n\n### 2. What happens — plain English, not code\n\n- Describe the buggy sequence the way you'd describe it to a teammate\n  at lunch.\n- Name the user action, the system reaction, and the bad outcome.\n- No jargon as the lead. \"React hasn't re-rendered\" is fine *inside*\n  the explanation; it can't be the explanation.\n\n### 3. Why it matters — user impact\n\n- One line. Who hits it, how often, what they see.\n- \"Users who double-tap will lose their character count\" is right.\n- \"This violates React state hygiene\" is wrong — that's the rule,\n  not the impact.\n\n### 4. The fix — a concrete code snippet\n\n- Show `// before` and `// after`. The diff is the artifact; words\n  are the explanation around it.\n- If the fix is non-obvious or has tradeoffs, add one line below the\n  snippet about why this version works.\n- End with the file path and line number.\n\n## What NOT to do\n\n- ❌ Don't lead with the critic ID (CR-007). It's a reference, not a\n  headline. Put it at the very end, small.\n- ❌ Don't dump the rule name as the title. \"useState flag used as\n  concurrency guard\" is what you found, not what's wrong.\n- ❌ Don't write findings without a code snippet. If the fix is genuinely\n  prose-only (e.g., \"remove this file\"), write what to type.\n- ❌ Don't stack multiple findings into one comment. One issue per\n  comment so reviewers can resolve them individually.\n- ❌ Don't write \"the user should ...\". The user isn't reading this;\n  the dev is. Say \"you can fix this by ...\" or just show the fix.\n- ❌ Don't apologize, hedge, or pad. \"It might be worth considering\n  potentially ...\" → just say it.\n\n## Length budget\n\n- **Blocker** finding: up to ~150 words + code snippet.\n- **Warning** finding: up to ~80 words + code snippet.\n- **Info** finding: one line. If it needs more, it's a warning.\n\nGoing over budget is the smell that the finding is two findings.\nSplit it.\n\n## Applies to\n\nThis style applies to every comment Manifest agents post:\n\n- `code-review` critic findings (CR-N)\n- `verify-pr` AC-coverage findings\n- `critic-*` findings written into `.findings.md` (the human view —\n  the JSON file in `.findings.json` keeps the structured fields)\n- Implementer self-review comments\n- `bug-triage` comments on filed issues\n- `/fix-pr` change explanations\n- Any `@claude /...` agent reply on a PR\n\nThe critics that produce JSON (per `reference/CRITIC-PROTOCOL.md`)\nmust populate these additional optional fields so the consumer can\nrender this style without re-parsing the `message`:\n\n```json\n{\n  \"id\": \"CR-007\",\n  \"critic\": \"code-review\",\n  \"severity\": \"warning\",\n  \"plainTitle\": \"Race condition on rapid clicks\",\n  \"whatHappens\": \"When the user clicks the mic button twice quickly...\",\n  \"whyItMatters\": \"Users who double-tap will lose their character count...\",\n  \"theFix\": \"Use `useRef` for the \\\"is it running\\\" flag instead of `useState`...\",\n  \"codeSnippet\": \"// before\\nconst [isRecording, ...]\\n\\n// after\\n...\",\n  \"file\": \"voice-dictation-toolbar-button.tsx\",\n  \"line\": 42,\n  \"status\": \"open\"\n}\n```\n\nThese fields are **additive** — they don't replace the existing\nschema (`message`, `suggestion`, `file`, `line`). They give the\nrendering layer the prose it needs without forcing the critic to\ndo markdown formatting in `message`.\n\nA finding that's missing `plainTitle` or `whatHappens` is a critic\nbug — surface it loudly. Don't let the old terse format leak through\nbecause some critic prompt forgot to follow the protocol.\n"},{"id":"reference-RECOMMENDED-LINT-RULES","path":"reference/RECOMMENDED-LINT-RULES.md","base":"RECOMMENDED-LINT-RULES.md","title":"Recommended lint rules — catch BUG-PATTERNS mechanically","md":"# Recommended lint rules — catch BUG-PATTERNS mechanically\n\nMost of `reference/BUG-PATTERNS.md` is mechanically detectable by\nthe right linter rules with the right severity. Turning these on\nin your repo's own config means the patterns get caught at \"save\"\ntime in the editor — not at PR time by a critic, and definitely\nnot at review time by Cursor.\n\n**The goal**: by the time the implementer pushes, the linter has\nalready rejected anything in BUG-PATTERNS. Cursor (and the\ncode-review critic) have less to find. Fewer iterations.\n\nCopy the block below into your repo's lint config. Keep it; the\nmaintenance cost is near zero, the value is \"no more whack-a-mole.\"\n\n---\n\n## TypeScript / JavaScript (ESLint)\n\n```js\n// .eslintrc.cjs (or eslint.config.js with the flat config)\nmodule.exports = {\n  // ... your existing config\n  rules: {\n    // BP-001: no empty catch (catches the empty-catch-with-side-effects shape\n    // before the side-effects question even comes up).\n    \"no-empty\": [\"error\", { \"allowEmptyCatch\": false }],\n\n    // BP-001 + BP-003: every catch must do something with the error.\n    \"@typescript-eslint/no-unused-vars\": [\"error\", {\n      \"args\": \"all\",\n      \"argsIgnorePattern\": \"^_\",\n      \"caughtErrors\": \"all\",\n      \"caughtErrorsIgnorePattern\": \"^_\"\n    }],\n\n    // BP-006: effect dependencies must be exhaustive. ERROR, not WARN —\n    // warning-level rules get ignored in CI and the bug ships anyway.\n    \"react-hooks/exhaustive-deps\": \"error\",\n    \"react-hooks/rules-of-hooks\": \"error\",\n\n    // BP-003: console.log isn't logging. Use the reporter.\n    \"no-console\": [\"error\", { \"allow\": [\"warn\", \"error\"] }],\n\n    // BP-005-adjacent: floating promises (.then without .catch, async without\n    // await) are silent failure paths.\n    \"@typescript-eslint/no-floating-promises\": \"error\",\n    \"@typescript-eslint/no-misused-promises\": \"error\",\n\n    // Adjacent good hygiene Cursor catches: unchecked indexed access,\n    // unsafe `any`, returning `any` from typed functions.\n    \"@typescript-eslint/no-explicit-any\": \"error\",\n    \"@typescript-eslint/no-unsafe-return\": \"error\",\n\n    // BP-002-adjacent: forbid `// eslint-disable-next-line` without a reason.\n    // Hidden disables are how the deps-exhaustive rule gets defeated.\n    \"eslint-comments/require-description\": [\"error\", {\n      \"ignore\": []\n    }],\n  },\n}\n```\n\n**TypeScript compiler — `tsconfig.json`:**\n\n```json\n{\n  \"compilerOptions\": {\n    \"strict\": true,\n    \"noUncheckedIndexedAccess\": true,\n    \"noImplicitOverride\": true,\n    \"noFallthroughCasesInSwitch\": true,\n    \"noPropertyAccessFromIndexSignature\": true,\n    \"exactOptionalPropertyTypes\": true\n  }\n}\n```\n\n`noUncheckedIndexedAccess` alone catches a huge class of \"thing\nmight be undefined\" bugs the implementer wouldn't otherwise type.\n\n**Install requirements:**\n\n```bash\nnpm i -D eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser \\\n  eslint-plugin-react-hooks eslint-plugin-eslint-comments\n```\n\n**CI step:**\n\n```yaml\n- run: npx tsc --noEmit\n- run: npx eslint . --max-warnings 0   # max-warnings 0 is the gate\n- run: npm test\n```\n\n`--max-warnings 0` is essential. Warning-level rules that don't fail\nthe build are how patterns leak through.\n\n---\n\n## Flutter / Dart\n\n```yaml\n# analysis_options.yaml\ninclude: package:flutter_lints/flutter.yaml\n\nanalyzer:\n  errors:\n    # BP-001 / BP-003: empty catches and unused exception variables.\n    empty_catches: error\n    unused_catch_clause: error\n    # BP-005: state-after-dispose.\n    invalid_use_of_protected_member: error\n\n  language:\n    strict-casts: true\n    strict-inference: true\n    strict-raw-types: true\n\nlinter:\n  rules:\n    # BP-001: catch shouldn't be empty.\n    - empty_catches\n    - unused_catch_clause\n    - unused_catch_stack\n\n    # BP-003: don't swallow errors with `print`.\n    - avoid_print\n\n    # BP-005: cancel timers / subscriptions on dispose.\n    - cancel_subscriptions\n    - close_sinks\n\n    # BP-006-adjacent (Dart): missing await, async returning non-Future.\n    - unawaited_futures\n    - await_only_futures\n\n    # Adjacent good hygiene.\n    - always_declare_return_types\n    - prefer_final_locals\n    - prefer_typing_uninitialized_variables\n}\n```\n\n**CI step:**\n\n```yaml\n- run: flutter analyze --fatal-warnings --fatal-infos\n- run: flutter test\n```\n\n`--fatal-warnings --fatal-infos` is the equivalent of ESLint\n`--max-warnings 0` — everything blocks.\n\n---\n\n## Go\n\n```yaml\n# .golangci.yml\nlinters:\n  enable:\n    - errcheck       # BP-001 / BP-003 — unchecked error returns\n    - errorlint      # error wrapping correctness\n    - gocritic       # adjacent code smells\n    - govet\n    - ineffassign\n    - staticcheck    # broad static checks Cursor would catch\n    - unused\n    - bodyclose      # BP-003 adjacent — unclosed response bodies leak\n    - sqlclosecheck\n    - rowserrcheck\n    - contextcheck   # BP-005 adjacent — context not propagated\n    - nilerr         # BP-003 — returning nil after assigning err\n    - nilnil         # both return values nil — usually a bug\n\nlinters-settings:\n  errcheck:\n    # blank-assignment to err is also banned\n    check-blank: true\n  govet:\n    enable-all: true\n```\n\n**CI step:**\n\n```yaml\n- run: go vet ./...\n- run: golangci-lint run --max-issues-per-linter=0 --max-same-issues=0\n- run: go test ./...\n```\n\n---\n\n## Python\n\n```toml\n# pyproject.toml\n[tool.ruff]\nselect = [\n  \"E\",    # pycodestyle errors\n  \"F\",    # pyflakes\n  \"B\",    # bugbear — BP-equivalents\n  \"S\",    # bandit security\n  \"BLE\",  # BP-001 / BP-003 — blind-except (`except:` or `except Exception:` w/o handling)\n  \"TRY\",  # try-except correctness\n  \"RET\",  # return-from-finally and other return surprises\n  \"SIM\",  # simplifications that often hide bugs\n  \"ASYNC\", # async correctness\n]\nignore = []\n\n[tool.ruff.per-file-ignores]\n\"tests/*\" = [\"S101\"]  # asserts allowed in tests\n\n[tool.mypy]\nstrict = true\nwarn_unreachable = true\ndisallow_any_explicit = true\n```\n\n**CI step:**\n\n```yaml\n- run: ruff check .\n- run: mypy .\n- run: pytest\n```\n\n---\n\n## How this plugs into Manifest\n\n- The implementer's local-run step (`skills/implement/SKILL.md` step 6)\n  runs the repo's resolved lint / typecheck / test commands. These\n  fail under the strict configs above, which means the empty-catch /\n  race / no-op-error patterns get caught at write time.\n- `workflows/pr-verify.yml` has an opt-in static-checks block (see\n  the commented-out section); the recommendations above are what to\n  put inside it.\n- The `code-review` critic still scans for the non-mechanical\n  variants of BUG-PATTERNS (the linter catches the obvious shape;\n  the critic catches the obfuscated shape — e.g., `err && doNothing(err)`\n  instead of `catch {}`).\n\nThe two layers complement each other: linter is cheap and mechanical;\ncritic is reasoning-based. Both reference `BUG-PATTERNS.md` so they\nstay in sync.\n\n---\n\n## A note on adoption\n\nYou don't need to flip every rule on at once. Recommended sequence\nwhen adopting in an existing repo:\n\n1. **First** — turn on the BP-001 / BP-003 rules (`no-empty`,\n   `no-floating-promises`, `no-unused-vars` for catches). These\n   catch the highest-volume Cursor findings.\n2. **Then** — `react-hooks/exhaustive-deps: error` (this one's\n   noisy on legacy code; either fix or `// eslint-disable-next-line`\n   with a reason per `eslint-comments/require-description`).\n3. **Then** — TypeScript strict mode + `noUncheckedIndexedAccess`.\n   Migrate file-by-file with `// @ts-strict-ignore` as the\n   short-term escape hatch.\n4. **Finally** — `--max-warnings 0` in CI to make all the above\n   actually blocking.\n\nRepos that adopt all four usually see Cursor findings per PR drop\nby ~70% within a few PRs. The remaining 30% are the genuinely\nnon-mechanical bugs the critic and the human reviewer earn their\nkeep on.\n"}]},{"title":"Guides","docs":[{"id":"docs-INSTALL-FOR-TRYERS","path":"docs/INSTALL-FOR-TRYERS.md","base":"INSTALL-FOR-TRYERS.md","title":"Install Manifest (for teammates trying it out)","md":"# Install Manifest (for teammates trying it out)\n\nTwo commands. Targeted at someone who just wants to install and try.\n\n## Prerequisites\n\n- Claude Code installed (any plan — your existing subscription auth\n  is sufficient for trying it interactively)\n- GitHub MCP connected in your Claude Code (for the regression\n  critic to scan code across repos)\n\n## Install\n\n```bash\n# 1. Add the Manifest marketplace\n/plugin marketplace add https://github.com/iampawan/Manifest\n\n# 2. Install the plugin\n/plugin install manifest@manifest\n\n# 3. Verify\n/plugin\n```\n\nYou should see `manifest` listed as installed. Skills auto-discover\nfrom `skills/*/SKILL.md`; slash commands (`/contract`, `/implement`,\n`/verify-pr`, `/launch`) become available immediately.\n\nFor Cowork users: same install, same plugin. User-scoped plugins are\nvisible in both Claude Code and Cowork mode.\n\n## First-run setup\n\nIn whichever directory you'll author contracts (typically the root of\na product repo, or a separate \"specs\" repo):\n\n```bash\n# Make a contracts directory\nmkdir -p .manifest/contracts\n\n# Tell the regression critic about your repos\ncp ~/.claude/plugins/manifest/examples/repos.yml.example .manifest/repos.yml\n# Then edit .manifest/repos.yml — replace the org/repo names with yours\n```\n\n## Try it\n\nTwo entry points to pick from, depending on where the PRD already\nlives:\n\n**Option A — you're the author / co-author.** No PRD yet, just an\nidea or a JIRA link:\n\n```\n/contract new \"A small real feature from your backlog\"\n```\n\nThe intake skill asks five questions and produces a draft contract\nin `.manifest/contracts/\u003cID>.md`. Then:\n\n```\n/contract verify \u003cID>\n```\n\nThis runs the critics in parallel and writes a findings file next to\nthe contract. You'll see what got caught and which gates aren't yet\ngreen.\n\n**Option B — you're a dev and your PM already wrote the PRD somewhere\nelse** (0.18+). Paste any source — JIRA URL, Google Doc, Slack\nmessage link, Notion page, or just paste the text:\n\n```\n/contract pickup https://your-org.atlassian.net/browse/ENG-1234\n```\n\nThe agent fetches the PRD, runs the critics, and sorts every gap\ninto three buckets you can act on in minutes — auto-fill from code,\ndev decides, only PM can answer. Questions to your PM go out as one\nbatched JIRA comment / Slack reply in your voice — PM stays in their\ntool. Opt in per repo in `.manifest/repos.yml`:\n\n```yaml\npickup:\n  enabled: true\n  identifyAgent: true\n  defaultChannel: jira\n```\n\nSee [GUIDE.md section 1g](../GUIDE.md#1g-pickup-flow--when-the-pm-authored-elsewhere)\nfor the full walkthrough.\n\n## Updates\n\nWhen a new version is published:\n\n```bash\n/plugin marketplace update manifest\n/plugin install manifest@manifest   # re-install to pull the latest\n```\n\n(Claude Code doesn't auto-update plugins by default; the re-install\npattern is the canonical way to refresh.)\n\n## If installation fails\n\n- **\"marketplace not found\"**: check the URL — must be a GitHub repo\n  that contains `.claude-plugin/marketplace.json` at its root.\n- **Private repo, auth errors**: easiest workaround is to clone\n  locally and install from the local path: `/plugin marketplace add\n  /path/to/local/clone`\n- **Slash commands not showing**: run `/plugin` and confirm the\n  plugin is enabled. Restart Claude Code if needed.\n\n## What to do next\n\nRead [`GUIDE.md`](GUIDE.md) for the full walkthrough. The single\nhighest-value first move is the \"retrospective comparison\" pattern\n— run the critics against a recently-shipped feature's PRD and show the\nbugs they would have caught at spec time.\n"},{"id":"docs-RELIABILITY","path":"docs/RELIABILITY.md","base":"RELIABILITY.md","title":"Manifest reliability hardening","md":"# Manifest reliability hardening\n\nA v0.1 prompt-only prototype has predictable weaknesses: non-deterministic\noutput, no eval coverage, cost, version drift. This doc tracks the plan to\nmake Manifest production-grade, organized around one keystone idea.\n\n## The keystone: deterministic core + judgment layer\n\nEvery critic used to be an LLM prompt. LLM prompts are non-deterministic\nby nature — you can reduce variance but never eliminate it. So we split:\n\n- **Deterministic layer** (`scripts/validate.mjs`) — real code for\n  everything mechanically checkable. Field presence, AC coverage, sizing\n  arithmetic, readiness computation, output-schema validation. 100%\n  reproducible, free, unit-testable.\n- **Judgment layer** (LLM critics) — only genuine reasoning: missing edge\n  cases, security analysis, regression conflicts, copy quality. Hardened\n  with a shared protocol, schema validation, and model pinning.\n\nThis split is already implemented. The rest of this doc tracks the\nremaining hardening, mapped to the issues that motivated it.\n\n---\n\n## Issue → fix status\n\n### 1. Non-deterministic output / out-of-schema severities\n**Status: addressed.**\n- Mechanical checks moved to `scripts/validate.mjs` — deterministic.\n- `reference/CRITIC-PROTOCOL.md` defines severity as a closed enum (blocker/\n  warning/info). Forbidden values (high/medium/low/...) are named\n  explicitly.\n- `validate.mjs --check-findings` rejects any out-of-schema severity\n  and exits non-zero. Verified: it catches \"high\" and \"medium\".\n- **Remaining**: lower temperature on judgment critics where the\n  runtime allows it; document the temp setting per critic.\n\n### 2. No eval harness\n**Status: BUILT (v0.2.0).** `eval/` has golden contracts (clean +\nseeded-gaps) and 13 unit tests for the validator — all passing. The\neval CI workflow (`workflows/eval.yml`) runs them on every change and\nfails the build on regression or schema violation. The harness already\ncaught a real parser bug (`\\Z` end-anchor) during development.\nRemaining: golden-contract recall tests for the LLM judgment critics\n(needs real critic runs in CI).\n**(original plan below for reference)**\n- Build `eval/` with golden contracts and expected findings.\n- For the deterministic layer: standard unit tests (`node --test`).\n  These are exact-match assertions — the validator output is\n  deterministic, so tests are trivially reliable.\n- For the judgment layer: golden-contract eval. Run each judgment\n  critic against a fixed contract, assert that expected blockers are\n  found (recall) and that no forbidden severities appear (schema).\n  Tolerate variance in non-critical findings; assert on the\n  load-bearing ones.\n- Run evals in CI on every plugin change. A drop in recall on the\n  golden set fails the build.\n\n**Stability sweep (run-to-run variance).** Recall scores one run; it\ndoesn't catch a critic that's *flaky* — catching a required gap on some\nruns but not others. That's the specific risk introduced by routing\ncritics to different models per tier. `scoreStability(runs, golden)` in\n`scripts/recall.mjs` scores N repeated runs of the same fixture, reports a\nper-gap hit rate + the run-to-run stdev of required recall, and fails if\nany required gap's hit rate falls below `stabilityThreshold` (default 1.0).\nWired into `eval.yml` as an opt-in sweep gated on the\n`MANIFEST_STABILITY_RUNS` repo variable (it multiplies LLM cost by N, so\nit's off by default — good for a nightly/scheduled run). CLI:\n`recall.mjs --stability \u003cgolden> \u003crun1.json> \u003crun2.json> …`.\n\n### 3. No shared rule layer\n**Status: done.**\n- `reference/CRITIC-PROTOCOL.md` is the single source for severity defs, output\n  schema, ID prefixes, anti-patterns, and the deterministic-vs-judgment\n  boundary. Every critic references it instead of duplicating.\n- **Remaining**: update each critic SKILL.md to open with the protocol\n  reference and delete its duplicated severity/anti-pattern blocks.\n\n### 4. LLM-cost-heavy (9 subagents per verify)\n**Status: partially addressed.**\n- Mechanical checks now run in code (zero tokens). The LLM critics do\n  strictly less work.\n- **Remaining**:\n  - Batch related judgment critics into fewer sub-agent calls.\n  - Use a cheaper model for the lighter judgment critics (naming\n    quality, copy quality) and reserve the strong model for\n    edge-cases / security / regression.\n  - Content-hash cache: if `contractHash` is unchanged since the last\n    verify, skip re-running and reuse the prior findings.\n\n### 5. Loose versioning / no reproducibility\n**Status: planned.**\n- Adopt semver. Tag releases (`v0.2.0`).\n- Install by tag, not main: `/plugin install manifest@manifest` pinned\n  to a tag in the marketplace entry.\n- Every findings file records `verifiedWith: { pluginVersion, model,\n  protocolVersion, contractHash }` (already in the contract-verify\n  spec). This makes any findings file reproducible-by-reference.\n- **Remaining**: add a `CHANGELOG.md`; wire release tagging.\n\n### 6. State conflict across branches\n**Status: addressed by convention (specs-repo); real service deferred.**\n- **The fix: a dedicated specs repo on a single `main` branch.** All\n  contracts live in one repo; git's total commit order makes it a\n  consistent central store — no two devs get diverging findings for\n  the same contract. This also solves \"where do cross-repo contracts\n  live.\" See GUIDE 1d.\n- `contractHash` stamping still detects staleness (your findings vs a\n  newer committed version).\n- `owner` / `lockedBy` / `lockedAt` add advisory \"someone's working\n  this\" awareness on the single branch.\n- **What a real service would still add** (the deferred v2+): real-time\n  concurrent-edit locking and a query API without `git pull`. Two\n  people editing the *same* contract at once still get a normal git\n  merge conflict (rare). Deferred until single-branch git causes real\n  friction; the plugin is built so a service wraps the same contract\n  format rather than replacing it.\n\n### 7. Silent integration failures (missing scopes)\n**Status: BUILT (v0.2.0).** Write-path skills declare `requiredScopes`\nin frontmatter. `/setup` (setup-check) verifies granted scopes and maps\neach gap to the command it would break. `contract-promote` refuses up\nfront if `github:issues:write` is missing, and reports (never silently\nskips) optional steps like the JIRA epic.\nRemaining: automated scope introspection where the runtime exposes it;\notherwise setup-check lists scopes for the user to verify manually.\n**(original plan below for reference)**\n- Skills will declare required scopes in frontmatter, e.g.\n  `requiredScopes: [github:issues:write, github:contents:write]`.\n- `/setup` (setup-check skill) will verify actual granted scopes, not\n  just connection presence, and fail loud on a gap.\n- `contract-promote` will check `github:issues:write` BEFORE the\n  tracking-issue step and refuse with a clear message if missing —\n  no more silent failure.\n- **Remaining**: implement scope introspection in setup-check;\n  add precondition checks to promote and other write-path skills.\n\n### 8. Force-runs too permissive\n**Status: BUILT (v0.2.0).** `scripts/validate.mjs` exits non-zero on parse/input\nerror. `verify-deployment` now has an explicit precondition step that\nREFUSES on null/empty target with a distinct `{ \"result\": \"refused\" }`\n— it never substitutes a misleading `hold` verdict for missing input.\n**(original status below for reference)**\n- `scripts/validate.mjs` exits 2 on parse/input error — callers must stop.\n- **Remaining**: add explicit precondition validation to\n  verify-deployment (refuse on null/empty env URL with a distinct\n  \"invalid input\" result, never a misleading \"hold\" verdict). The\n  protocol's anti-patterns already forbid \"degrade silently on bad\n  input\"; enforce it with a code precondition.\n\n### 9. Behavior changes with the model\n**Status: mitigated.**\n- Pin the model in judgment-critic invocations where the runtime\n  allows specifying it.\n- Record the model in every findings file (`verifiedWith.model`).\n- The eval suite (issue #2) is the real defense: it catches drift\n  when a model update changes outputs, before that reaches users.\n- **Remaining**: can't control model behavior; the eval gate is the\n  mitigation. Document the supported/tested model per release.\n\n### 10. Context-window exhaustion on long runs (lossy auto-summarization)\n**Status: mitigated.**\n- The Implementer runs for hours; the context window fills and the runtime\n  auto-summarizes earlier turns *lossily*, so an agent that trusts its\n  in-context memory of the plan/ACs/progress can drift or redo work.\n- **Fix — externalize state, don't memorize it.** Every load-bearing fact\n  lives in a durable file the agent re-reads as ground truth: the revision\n  (spec + ACs), the implementation-plan (scope), the code-context cache\n  (conventions), and a new working-state file\n  `\u003cID>.implement-state.json` the Implementer checkpoints after every\n  behavior (AC status, files touched, decisions).\n- A deterministic read — `validate.mjs --implement-status \u003cID>` — recovers\n  exactly what's done and what's left in ~100 tokens after any\n  summarization, and makes runs **resumable** (re-invoking continues from\n  the state file instead of restarting). Schema + status are unit-tested.\n- **Remaining**: can't stop the runtime from compacting; the mitigation is\n  to make compaction non-destructive by keeping the source of truth on disk.\n\n---\n\n## Build order (recommended)\n\n1. **Done**: deterministic validator + shared protocol + schema\n   validation + wire into contract-verify.\n2. **Next**: eval harness (unit tests for validator + golden-contract\n   eval for judgment critics) — this is the highest-leverage remaining\n   piece because it makes every future change safe.\n3. **Then**: scope declarations + setup-check scope verification +\n   promote precondition (kills the silent-failure class).\n4. **Then**: versioning discipline (semver tags, install-by-tag,\n   CHANGELOG).\n5. **Then**: cost work (batching, cheaper model for light critics,\n   content-hash cache).\n6. **Later / maybe**: central state store, if branch divergence ever\n   becomes a real pain rather than a detectable one.\n\n## What's genuinely unsolvable (be honest)\n\n- LLMs will never be bit-for-bit deterministic on judgment tasks. The\n  fix is \"move everything that CAN be deterministic into code, validate\n  the rest's output, and catch drift with evals\" — not \"make the LLM\n  deterministic.\"\n- Model updates can shift judgment-critic behavior. We can detect it\n  (evals) and pin where possible, but not prevent it entirely.\n- True multi-writer state consistency needs infrastructure the plugin\n  doesn't have. Hash-stamping makes divergence visible; eliminating it\n  is a service-layer problem.\n\nThe honest framing for the team: the deterministic layer is as reliable\nas any code you write. The judgment layer is as reliable as a careful\nsenior reviewer who occasionally phrases things differently — bounded by\na schema, checked by evals, and never the sole authority on whether a\ncontract passes (that verdict is code).\n"},{"id":"docs-PUBLISH-CHECKLIST","path":"docs/PUBLISH-CHECKLIST.md","base":"PUBLISH-CHECKLIST.md","title":"Publish checklist — ship Manifest to your team","md":"# Publish checklist — ship Manifest to your team\n\nOne page. Gets you from \"works on my laptop\" to `/plugin install\nmanifest` for teammates. ~15 minutes.\n\n## 0. Prerequisite — pick the org/repo name\n\nYou'll publish to a GitHub repo, e.g. `your-org/manifest`. Decide it\nnow; you'll substitute it below.\n\n## 1. Point the marketplace at your repo\n\n`.claude-plugin/marketplace.json` declares which GitHub repo the plugin\ninstalls from. Set the `repo` field to your fork's `owner/repo`:\n\n```json\n\"source\": { \"source\": \"github\", \"repo\": \"your-org/manifest\" }\n```\n\nUse this structured `{ \"source\": \"github\", \"repo\": \"...\" }` form — not a\nbare `\"./\"` local path, which triggers a \"source type your Claude Code\nversion does not support\" error on install.\n\n## 2. Test locally BEFORE pushing (this is the gate)\n\nThe marketplace.json schema has changed across Claude Code versions\nand errored once already — so verify on your machine first:\n\n```bash\n# From the plugin folder\ncd /path/to/manifest\n\n# 2a. Validate the manifests are well-formed JSON\ncat .claude-plugin/plugin.json      | python3 -m json.tool > /dev/null && echo \"plugin.json ok\"\ncat .claude-plugin/marketplace.json | python3 -m json.tool > /dev/null && echo \"marketplace.json ok\"\n\n# 2b. Run the eval suite (deterministic layer must be green)\ncd scripts && npm install && cd ..\nnode --test eval/validate.test.mjs eval/detect.test.mjs   # expect 30 passing\n\n# 2c. Load it as a plugin and confirm commands appear\nclaude --plugin-dir .\n#   then in Claude Code: /plugin   (manifest should list)\n#                        /manifest (tutorial should run)\n```\n\nIf `--plugin-dir` throws the \"source type\" error again, the\nmarketplace.json is the cause — temporarily rename it to\n`.disabled` for local dev; it's only needed once published. Then\nverify the marketplace.json format against the current docs:\nhttps://code.claude.com/docs/en/plugin-marketplaces\n\n## 3. Push to GitHub\n\n```bash\ncd /path/to/manifest\ngit init                      # if not already a repo\ngit add -A\ngit commit -m \"Manifest v0.3.0\"\ngh repo create your-org/manifest --private --source=. --push\n#   (drop --private for a public repo)\n```\n\n## 4. Tag the release\n\nInstall pins to a tag, so teammates get reproducible behavior:\n\n```bash\ngit tag v0.3.0\ngit push origin v0.3.0\n```\n\n## 5. Teammates install (two commands)\n\n```\n/plugin marketplace add your-org/manifest\n/plugin install manifest\n```\n\nThen `/setup` (runs the detection wizard) and `/manifest` (tutorial).\n\nHand them `docs/INSTALL-FOR-TRYERS.md` — it's the teammate-facing\nversion of this.\n\n## 6. Shipping an update later\n\n```bash\n# You: bump version in plugin.json + marketplace.json, update CHANGELOG\nnode scripts/build-docs.mjs          # regenerate docs/manifest-docs.html from the latest docs\ngit commit -am \"Manifest v0.3.1\"\ngit tag v0.3.1 && git push origin main v0.3.1\n\n# Teammates:\n/plugin refresh\n/plugin install manifest@v0.3.1     # or re-install to get latest tag\n```\n\n`scripts/build-docs.mjs` rebuilds the single-file docs hub\n(`docs/manifest-docs.html`) from the current markdown — run it after\nupdating the CHANGELOG so the browsable docs and the version badge stay in\nsync. New `docs/releases/*.md` files are picked up automatically.\n\nClaude Code doesn't auto-update plugins — teammates re-install to pull\na new version. Announce updates (Slack) so people know to refresh.\n\n## 7. Wire a target repo (per product repo, once)\n\nIn each repo where features get built:\n\n```bash\nmkdir -p .manifest/contracts\ncp /path/to/manifest/workflows/*.yml .github/workflows/   # for CI later\n# Run /setup in that repo to auto-generate .manifest/repos.yml\ngit add .manifest/ .github/workflows/ && git commit -m \"chore: add Manifest\"\n```\n\n### 7a. Enable the pickup flow (optional, 0.18+)\n\nIf devs on this repo will pick up PRDs that PMs author in JIRA /\nGoogle Docs / Slack / Notion, opt into the pickup flow in the same\n`.manifest/repos.yml`:\n\n```yaml\npickup:\n  enabled: true            # opt in\n  identifyAgent: true      # \"(via Manifest)\" footer on PM-facing posts\n  defaultChannel: jira     # or: slack | notion | gdoc\n  blockingByDefault: false # questions are non-blocking unless dev flags\n  cacheTTL: 24h            # codebase analysis cache lifetime\n```\n\nWithout this flag, `/contract pickup` falls back to `/contract new`\nwith a notice. Existing flows are unchanged either way. See\n[GUIDE.md section 1g](../GUIDE.md#1g-pickup-flow--when-the-pm-authored-elsewhere)\nfor the full spec.\n\nSet the CI secret (one of):\n- `CLAUDE_CODE_OAUTH_TOKEN` (subscription auth — preferred), or\n- `ANTHROPIC_API_KEY`\nPlus `SENTRY_AUTH_TOKEN`, analytics key, `SLACK_BOT_TOKEN`, `JIRA_API_TOKEN`\nas you enable those stages.\n\n## The one thing to double-check\n\nThe marketplace.json source format is the only piece that bit us\nbefore and that varies by Claude Code version. Steps 2b/2c are the\ngate — if `/plugin marketplace add` + `/plugin install` works for you\nlocally (or from the pushed repo), it'll work for teammates. If it\nerrors, the format needs adjusting to your Claude Code version per the\ndocs link in step 2; everything else in the plugin is version-stable.\n"},{"id":"docs-superseded-critic-sizing","path":"docs/superseded-critic-sizing.md","base":"superseded-critic-sizing.md","title":"Sizing critic","md":"> SUPERSEDED in v0.3.0. Sizing is now computed deterministically by\n> scripts/validate.mjs (computeSizing). This LLM critic is no longer\n> registered. Kept as a record of the original rubric.\n\n---\nname: critic-sizing\ndescription: Critic that classifies a verified contract as Small (24h), Medium (72h), or Large (no SLA). The keystone that routes work to the right pipeline path. Runs LAST in contract-verify, after all other critics have produced their findings.\n---\n\n# Sizing critic\n\n> **Protocol:** Follow `reference/CRITIC-PROTOCOL.md` at the plugin root for severity\n> definitions (the closed enum blocker/warning/info), the output JSON schema,\n> ID prefixes, and shared anti-patterns. This skill defines only WHAT to look\n> for. Do not invent severities like \"high\"/\"medium\" — the validator rejects them.\n> Do not re-check anything the deterministic validator (`scripts/validate.mjs`)\n> already covers; add the judgment layer on top.\n\nThe pipeline can only meet its SLAs if the work is correctly sized.\nMisclassification is more costly than slow classification — when in\ndoubt, escalate to the larger bucket.\n\n## Inputs\n\n- The parsed contract.\n- The full findings array from the other 8 critics.\n\n## Process\n\n### 1. Refuse if blockers are open\n\nIf any other critic emitted a `blocker`, return `complexity: null` with\na finding that says \"cannot size until blockers are resolved.\" Sizing\nruns *after* the others for this reason.\n\n### 2. Apply the rubric mechanically\n\nStart with **small** and escalate if any rule fires:\n\n#### Escalates to Medium if any of these hold:\n- More than 1 platform in scope\n- More than 3 behaviors\n- Adds a new email, push, or notification template\n- Additive schema change (new column/field, no migration)\n- Touches more than 5 files according to regression critic's references\n- Behavior calls out to a third-party service this codebase doesn't\n  already use\n\n#### Escalates to Large if any of these hold:\n- Breaking change to an existing API or data shape\n- Schema migration on a table the regression critic flagged as hot\n- Touches authentication, authorization, billing, or payment primitives\n- Adds a brand-new vendor (not one already integrated)\n- 3+ platforms\n- Adds a new service / process / background worker\n- Any contract field marked `riskOverride: high`\n- More than 8 behaviors\n\n### 3. Apply risk override\n\nEven if mechanical rules say Small, escalate to Medium (and warn) if:\n- Behavior touches PII or financial data\n- Any security critic finding is severity ≥ warning\n- The success metric is one the team has publicly committed to\n\nThe risk axis matters more than the size axis. A 10-line copy change on\nthe checkout page is still risky even if it's tiny.\n\n### 4. Emit a sizing finding\n\nReturn ONE finding with severity `info` summarizing the decision:\n\n```json\n{\n  \"id\": \"SZ-001\",\n  \"critic\": \"sizing\",\n  \"severity\": \"info\",\n  \"message\": \"Sized as SMALL — 1 platform (web), 2 behaviors, no schema, flag-gated.\",\n  \"suggestion\": \"If you intended this for iOS too, add the platform and re-verify (will escalate to Medium).\",\n  \"fragmentRef\": \"frontmatter\",\n  \"status\": \"open\"\n}\n```\n\nIf escalated, include in the message *which rule* triggered the\nescalation — the user needs to know why.\n\n### 5. Set the field\n\nThe orchestrator (`contract-verify`) reads your finding and sets\n`contract.complexity` to `small`, `medium`, or `large` in the\nfrontmatter.\n\n## Anti-patterns\n\n- Don't average the rules. ANY one escalating rule wins.\n- Don't size a contract with open blockers — refuse.\n- Don't size based on \"vibe.\" Cite the specific rule.\n"}]},{"title":"Proposals","docs":[{"id":"docs-proposals-model-tiering-and-advisor","path":"docs/proposals/model-tiering-and-advisor.md","base":"model-tiering-and-advisor.md","title":"Design proposal: model tiering + advisor escalation","md":"# Design proposal: model tiering + advisor escalation\n\n**Status:** Draft / proposal (not adopted)\n**Date:** 2026-06-29\n**Scope:** How Manifest picks the right model for each unit of work, optimizes\ntokens, and uses Claude Code's `/advisor` tool for hard calls.\n\n---\n\n## 1. Problem\n\nManifest fans out ~10 LLM critics per contract verify, plus the Implementer and\ncode-review in CI. Today every critic runs at the same model tier (it inherits\nthe session model). Two costs follow:\n\n- **Token waste.** Mechanical, format-heavy critics (e.g. comms-completeness,\n  minimality) don't need a frontier model, but pay frontier rates anyway.\n- **No escalation path.** A critic that hits genuine ambiguity has no way to\n  \"ask a stronger model\" — it either guesses or over-flags. The only lever is\n  to run *everything* heavy, which is the expensive default.\n\nGUIDE.md §②/verify already *states* the intent — \"heavy critics use a strong\nmodel, light ones a fast model\" — but it's documentation, not wiring. The only\nreal `model:` pin in the repo is the example in `CRITIC-PROTOCOL.md`.\n\nThis proposal makes that intent real and adds a second, complementary lever:\nClaude Code's built-in `/advisor`.\n\n## 2. What's already solved — don't rebuild\n\nManifest already does the highest-leverage token work, and this proposal\ndeliberately leaves it untouched:\n\n- `scripts/validate.mjs` does all mechanical checks in **code, zero tokens**,\n  before any critic fires. Critics only add the judgment layer.\n- Verify is incremental: **no-op** reuses findings, **incremental** re-runs only\n  critics over changed behaviors, **`--fast`** skips the regression scan.\n- Findings are cached and reused unless the contract's API surface actually\n  moved.\n\nThe wins below are *on top of* this, not a replacement for it.\n\n## 3. Lever A — the system routes itself (no human picks a model)\n\nThe design goal: a dev running `/contract verify` should **never think about\nmodels**. So model choice must be made *by the system*, automatically. There are\ntwo ways to do that, and the right answer combines them.\n\n### 3.1 The routing principle: route on signals already computed, in code\n\nThe naive way to be \"smart\" is an LLM classifier that reads the task and picks a\nmodel. **Don't.** That costs a token call and — fatally for Manifest — it\nreintroduces non-determinism into the verdict path, fighting the whole\nreproducible-by-reference design. The verdict mechanism must stay deterministic.\n\nThe better way: the router is **code reading signals Manifest already produces\nfor free.** `computeSizing()` in `validate.mjs` already classifies every\ncontract into `complexity: small | medium | large` from behavior count, platform\ncount, and risk flags (`touchesAuth`, `touchesBilling`, `schemaMigration`,\n`riskOverride`), with `reasons`. `changeType: bug-fix` already selects a lean\ncritic set. These are the exact inputs a model router needs — already computed,\nalready deterministic, already the thing that decides \"is this big enough to need\n`/contract decompose`.\" Reuse it as the model router and the choice is both smart\n*and* reproducible.\n\n### 3.2 The wiring: a baseline tier per critic, escalated by complexity\n\n> **Status: implemented (phase 1).** The router lives in\n> `scripts/validate.mjs` as `computeModelPlan()` and is emitted as\n> `modelPlan` in the validator output; the verify orchestrator reads it and\n> spawns each critic at its assigned model. Chosen over per-frontmatter\n> `model:` pins because verify dispatches critics from the orchestrator (not\n> as standalone agents), and a code-router is unit-testable and reproducible —\n> see `eval/validate.test.mjs`.\n\nTwo layers, both automatic:\n\n**Baseline** — each critic has a default tier in `CRITIC_BASELINE`\n(model aliases `haiku` | `sonnet` | `opus`):\n\n| Baseline tier | Model | Critics | Rationale |\n|---|---|---|---|\n| Light | `haiku` | minimality, comms-completeness | Presence/shape of states + copy; near-mechanical. |\n| Default | `sonnet` | edge-cases, instrumentation, perf-budget, platform-parity | Reasoning over one contract's behaviors. |\n| Heavy | `sonnet`→`opus` | regression, security, scalability | Cross-repo / adversarial; escalates by complexity (below). |\n\n**Escalation by complexity** — the orchestrator overrides the heavy critics'\nmodel from the sizing bucket, so the *same* security critic runs cheaper on a\ntrivial change and stronger on a risky one:\n\n| `complexity` (from sizing) | Heavy critics run at | Reason |\n|---|---|---|\n| `small` | `sonnet` | 1–3 behaviors, single platform — Opus is overkill. |\n| `medium` | `sonnet` | multi-behavior / multi-platform — Sonnet holds. |\n| `large` | `opus` | 8+ behaviors, 3+ platforms, or a risk flag (auth/billing/migration). |\n\nPlus the existing lean path: `changeType: bug-fix` already runs fewer critics,\nso a one-line fix is cheap *and* light without any new logic.\n\nSo nobody picks a model. A tiny CSS fix runs almost entirely on Haiku/Sonnet; an\nauth-flow change across three platforms automatically pulls Opus onto the\nsecurity and regression critics — because `computeSizing` already flagged\n`touchesAuth` and `large`. The router is a lookup over a number the validator\nalready returns.\n\n`critic-code-context` (dev-side repo auto-fill) is I/O-bound, not\nreasoning-bound — baseline it at `sonnet`, revisit with data.\n\nThe baseline tier and the complexity→tier table are **static, version-pinned\nmappings**. The *input* (sizing) varies per contract; the *mapping* does not —\nso the model choice is a deterministic function of the contract, which is what\nkeeps findings reproducible (see §5).\n\n## 4. Lever B — `/advisor` for the hard calls\n\n`/advisor` is a real, built-in Claude Code tool (v2.1.98+, Anthropic API only;\nnot on Bedrock/Vertex/Foundry; experimental). It lets the main model consult a\nstronger secondary model **at decision points** — before committing to an\napproach, when stuck on a recurring error, before declaring done. The advisor\nsees full context and returns guidance folded back into the session. Billing is\nper advisor call at the advisor model's rate, so a fast main model + strong\nadvisor typically costs less than running the strong model throughout.\n\nThis is the *escalate-on-uncertainty* half of the strategy, and it slots into\nexactly the places tiering can't reach:\n\n- **The Implementer in CI.** Run the Implementer on a mid-tier model with\n  `--advisor opus`. It escalates before committing to a plan and before\n  declaring ACs covered — the two moments where a wrong call is costly — instead\n  of paying frontier rates for every token of boilerplate codegen.\n- **Light/default critics that hit ambiguity.** Rather than promoting a whole\n  critic to `opus`, let a `haiku`/`sonnet` critic consult the advisor only when\n  a specific finding is genuinely borderline. Cheap common case; strong judgment\n  exactly where it's load-bearing.\n\nHow to enable: `--advisor \u003cmodel>` on the CI invocation, `/advisor`\ninteractively, or \"consult the advisor\" in a prompt. `CLAUDE_CODE_DISABLE_ADVISOR_TOOL=1`\nturns it off. Because it's experimental + API-only, treat it as **opt-in per\nrepo** (mirror the `pickup.enabled` pattern in `.manifest/repos.yml`) so\nBedrock/Vertex users degrade gracefully to plain tiering.\n\n## 5. The reproducibility wrinkle (must handle)\n\n`CRITIC-PROTOCOL.md` §\"Model + version pinning\" records **one** `model:` in each\nfindings file's `verifiedWith` frontmatter, and the eval suite pins model +\nplugin version + protocol version so behavioral drift is caught in CI. Per-critic\ntiering breaks the \"one model\" assumption.\n\nResolution:\n\n- Change `verifiedWith.model` from a scalar to a **per-tier or per-critic map**,\n  e.g.\n  ```yaml\n  verifiedWith:\n    pluginVersion: 0.19.0\n    models: { light: haiku-4-5, default: sonnet-4-6, heavy: opus-4-8 }\n    protocolVersion: 2\n    contractHash: sha256:…\n  ```\n- Bump `protocolVersion` (this is a provenance schema change).\n- Update `scripts/validate.mjs` to accept the map and the eval fixtures to pin\n  per-tier models, so drift detection still works — just per tier.\n- Advisor calls are non-deterministic by nature, so when the advisor fires,\n  record `advisorConsulted: true` (and the advisor model) in provenance. Keep\n  advisor **out of the deterministic eval gates** — it's an aid to the run, not\n  part of the reproducible verdict. The hard gate stays \"zero open blockers,\"\n  computed by code.\n\n## 6. Expected token/cost impact\n\nRough, directional — confirm with an eval run before committing:\n\n- ~2 of ~10 critics drop from Sonnet→Haiku and ~3 sit at Sonnet rather than a\n  blanket-Opus default → meaningful per-verify reduction, with the heavy three\n  unchanged so detection quality on the expensive misses is preserved.\n- Implementer flips from \"Opus throughout\" to \"mid-tier + Opus advisor at 2\n  decision points\" → the biggest single saving, since codegen is the\n  token-heaviest step.\n- Net: cheaper common case, **equal-or-better** judgment where it matters,\n  because spend is concentrated at decision points instead of smeared across\n  every token.\n\n## 7. Rollout\n\n1. **Baseline tiering + complexity override — DONE (phase 1).**\n   `computeModelPlan()` in `validate.mjs` computes a per-critic model map from\n   the baseline tiers and `sizing.complexity`; the verify orchestrator obeys\n   `modelPlan`. Honors `conventions.criticModels` from `.manifest/repos.yml`.\n   Covered by 5 unit tests. No protocol bump, caches unaffected — `modelPlan`\n   is additive output, not part of the contract hash or the verdict.\n2. **Provenance v2 — DONE.** `verifiedWith` now records a per-tier `models`\n   map + `complexity` instead of a single `model` scalar; `PROTOCOL_VERSION`\n   bumped 1→2 (documented in `CRITIC-PROTOCOL.md`), which invalidates v1 caches\n   by design. The orchestrator copies `models`/`complexity` from the validator's\n   `modelPlan`. Locked by tests (v1-stale-under-v2, version-is-2).\n3. **Measure** — run the eval suite to confirm findings parity per tier and\n   capture real token deltas. Adjust the rubric from data (e.g. if Haiku\n   under-flags comms-completeness, promote it back to Sonnet).\n4. **Advisor for the Implementer — DONE (phase 1).** `pr-verify.yml` passes\n   `--advisor`/`--model` to both Implementer invocations (build + fix mode),\n   gated on the `MANIFEST_ADVISOR_MODEL` / `MANIFEST_IMPLEMENTER_MODEL` repo\n   variables (opt-in; unset = unchanged). The `implement` skill consults the\n   advisor at three decision points only — before committing to the plan,\n   before declaring done, and when a fix loop is stuck — and degrades to normal\n   operation when no advisor is configured (Bedrock/Vertex, or unset). Still\n   open: optionally let borderline *critic* findings consult the advisor too.\n\n## 8. Open questions\n\n- Does `haiku` hold finding quality on comms-completeness/minimality, or does the\n  validator already cover so much that those critics are thin enough to drop to\n  Haiku safely? **Eval decides.**\n- Per-**critic** vs per-**tier** model map in provenance — per-tier is simpler\n  and probably enough; per-critic is more precise but noisier. Lean per-tier.\n- Advisor is experimental + API-only. Acceptable as opt-in, but it shouldn't\n  become a hard dependency of any gate.\n\n## 9. Recommendation\n\nDo §3 now — baseline tiers plus the complexity override driven by\n`computeSizing`. This is the answer to \"people don't know which model to use\":\nthey never choose, and the system adapts per contract using a signal it already\ncomputes for free, deterministically. Adopt `/advisor` for the **Implementer in\nCI** as the first escalation use, since that's the token-heaviest step and where\nescalate-on-uncertainty pays off most. Keep the deterministic validator +\nzero-open-blockers gate as the source of truth throughout — model routing changes\n*cost and judgment quality*, never the *verdict mechanism*.\n"},{"id":"docs-proposals-next-features-roadmap","path":"docs/proposals/next-features-roadmap.md","base":"next-features-roadmap.md","title":"Next features — impact assessment","md":"# Next features — impact assessment\n\n**Status:** Draft / for decision\n**Date:** 2026-06-29\n**Context:** Follow-on to `model-tiering-and-advisor.md`. Four candidate\nfeatures, each scored on impact, effort, and risk, with a recommended\nsequence. The theme is *closing loops* the current pipeline leaves open —\nmeasurement, learning, and stability — so the system improves itself rather\nthan staying static.\n\n## Summary\n\n| # | Feature | Impact | Effort | Risk | Reuses |\n|---|---|---|---|---|---|\n| 1 | Cost/token observability ✅ DONE | High | S–M | Low | findings.json provenance, modelPlan |\n| 2 | Postmortem → bug-pattern loop ✅ DONE | High | M | Low–Med | BUG-PATTERNS.md, code-review critic, postmortem skill |\n| 3 | Finding-stability / variance tracker ✅ DONE | Med | S | Low | recall.mjs + eval/golden (already exist) |\n| 4 | Critic-level advisor escalation ✅ DONE | Med | S | Med | advisor (wired), CRITIC-PROTOCOL |\n\nEffort: S ≈ a focused change + tests; M ≈ multi-file with a new flow. Risk is\nabout the verdict/determinism property, not general bugs.\n\n---\n\n## 1. Cost/token observability — ✅ SHIPPED\n\n> Implemented: `computeCost`/`normalizeModel` + a `--cost` rollup in\n> `validate.mjs`, priced from `reference/model-pricing.json`; `usage` block\n> recorded in `findings.json` (critics) and `\u003cID>.implement.json` (Implementer +\n> advisor); schema in `CRITIC-PROTOCOL.md`; surfaced as `/manifest cost` with a\n> by-complexity / by-model-tier / by-critic breakdown. Kept strictly as\n> observability — never a gate or provenance input. 5 unit tests; suite green.\n\n**What.** Record actual tokens + cost per critic and per Implementer run in\n`findings.json` provenance (next to the `models`/`complexity` we already\nstore), and a small rollup (`/manifest cost` or an eval-time report) showing\ncost by complexity and by critic over time.\n\n**Why / impact.** This is the missing half of the routing + advisor work just\nshipped. We changed *how* models are chosen to save tokens but added no way to\n**measure the saving** — the design doc literally says \"confirm with an eval\nrun.\" Without this you can't answer \"did tiering help?\", \"is Haiku\nunder-flagging so we're paying for re-runs?\", or \"is the advisor paying for\nitself?\" It turns the routing rubric from a guess into a data-tuned dial. High\nimpact precisely because it makes every other model decision measurable.\n\n**Effort.** S–M. Capture usage from the run, write it to the `.json`; the\nrollup is a small script. No protocol-breaking change (additive provenance).\n\n**Risk.** Low. Additive; doesn't touch the verdict. Main caveat: token usage is\n**not** deterministic, so keep it OUT of eval gates and the reproducible\nprovenance set (same rule we applied to the advisor) — record it as\nobservability, never as a gate input.\n\n**Dependency.** None. Best done first — it's the instrument the others are\ntuned against.\n\n## 2. Postmortem → bug-pattern learning loop — ✅ SHIPPED\n\n> Implemented: `/postmortem` proposes a candidate in\n> `reference/bug-patterns.candidates.md` (staging, unenforced) when a cause is a\n> diff-detectable bug class; a maintainer promotes it into `BUG-PATTERNS.md`\n> (next id via `validate.mjs --next-pattern-id`), where `code-review` enforces\n> it. Safety: human-accept gate + `warning`-until-proven default (honored by the\n> code-review skill). Deterministic catalog validator (`--check-patterns`:\n> well-formed entries, unique + monotonic ids) wired into `eval.yml`; 7 unit\n> tests; suite green.\n\n**What.** When a postmortem identifies a root cause that code review *could*\nhave caught, promote it into a new `BP-NNN` entry in `reference/BUG-PATTERNS.md`\n(with a provenance link back to the incident), so the `code-review` critic —\nwhich already loads and checks every active `BP-` pattern against each diff —\nenforces it forever after.\n\n**Why / impact.** Highest strategic payoff: the system gets permanently smarter\nwith each incident instead of relearning the same lesson. The same class of bug\ncan't ship twice. All the pieces already exist (`rollback-postmortem` skill,\n`BUG-PATTERNS.md`, code-review's `BP-` loop) — the only missing link is the\npromotion step that connects them. This is the clearest \"self-improving system\"\nfeature on the list.\n\n**Effort.** M. Add a \"candidate bug pattern\" output to the postmortem skill,\nplus a lightweight review/accept gate so a human confirms before a pattern\nbecomes a hard check (auto-adding blocking checks unreviewed would be risky).\n\n**Risk.** Low–Med. The risk is a noisy or over-broad pattern turning into\nfalse-positive blockers on every PR. Mitigate with: human-accept before a\npattern goes active, a severity default of `warning` (not `blocker`) for\nmachine-proposed patterns until proven, and the same 12-finding cap discipline.\n\n**Dependency.** Independent, but more valuable once #1 exists (you can see\nwhether a new pattern adds review cost).\n\n## 3. Finding-stability / variance tracker — ✅ SHIPPED\n\n> Implemented: `scoreStability(runs, golden)` in `scripts/recall.mjs` scores N\n> repeated runs of a fixture — per-gap hit rate, run-to-run stdev of required\n> recall, and a flaky-gap list — failing when a required gap's hit rate drops\n> below `stabilityThreshold` (default 1.0). CLI `recall.mjs --stability`; opt-in\n> `eval.yml` sweep gated on `MANIFEST_STABILITY_RUNS`; noted in `RELIABILITY.md`.\n> 6 unit tests; suite green. Pure/deterministic given the runs, like `scoreRecall`.\n\n**What.** Extend the existing `recall.mjs` + `eval/golden` harness to track\nfinding **variance run-to-run**, and specifically across model tiers — surfacing\nwhen a critic's findings become unstable (the protocol's own \"convergence line\"\nidea, measured).\n\n**Why / impact.** You lean hard on determinism and reproducible-by-reference\nfindings. Mixing models per tier (what we just shipped) is exactly the change\nthat could introduce drift on the judgment layer. This guards that property: if\nmoving comms-completeness to Haiku makes its findings flap, the tracker catches\nit in CI, not in a dev's confused re-verify. Medium impact — it's insurance on\nthe routing change rather than new capability.\n\n**Effort.** S. The recall harness and golden fixtures already exist; this adds a\nvariance metric and a threshold, not a new harness.\n\n**Risk.** Low. Test-only; never touches production runs or the verdict.\n\n**Dependency.** Pairs naturally with #1 (cost) — together they're the\n\"measurement\" half of the loop. Do alongside or right after #1.\n\n## 4. Critic-level advisor escalation — ✅ SHIPPED\n\n> Implemented: a fast-tier critic may consult the advisor on a borderline\n> `warning`/`info` call only — defined in `CRITIC-PROTOCOL.md`, opt-in via\n> `conventions.criticAdvisor`. The safety constraint is **enforced in code**:\n> `validateFindings` rejects any advisor-influenced `blocker`\n> (`metadata.advisorConsulted` + `severity: blocker`), so the promotability\n> gate stays fully deterministic. Advisor-influenced findings are marked and\n> excluded from reproducible provenance/eval. 4 unit tests + CLI check; suite\n> green.\n\n**What.** Let a light/default critic (Haiku/Sonnet) consult the advisor on a\nsingle **borderline** finding, instead of promoting the whole critic to a strong\nmodel. Already half-scoped in `model-tiering-and-advisor.md`.\n\n**Why / impact.** Extends the cheap-first/escalate-on-uncertainty pattern from\nthe Implementer to the critics — strong judgment exactly where a finding is\ngenuinely ambiguous, common case stays cheap. Medium impact; the per-tier\nrouting already captures most of the win, so this is a refinement.\n\n**Effort.** S. Advisor is already wired; this is guidance in the critic protocol\nplus a trigger condition.\n\n**Risk.** Med — and this is the important one. The advisor is non-deterministic,\nand critics produce **verdict-bearing** findings (unlike the Implementer). An\nadvisor-influenced finding could make the verdict non-reproducible, which fights\nthe whole design. **Constraint:** an advisor may only help a critic *downgrade\nor add caveats* / decide whether to emit, and the result must be recorded as\nadvisor-influenced and excluded from the reproducible-provenance comparison — or,\nsafer, scope it to advisory (`warning`/`info`) findings only, never blockers.\nWorth doing last, carefully, after the measurement features can show its effect.\n\n---\n\n## Recommended sequence\n\n1. **Cost/token observability (#1)** — first, because it's the instrument\n   everything else is judged by, and it completes the loop on work already\n   shipped.\n2. **Finding-stability tracker (#3)** — alongside/just after #1; together they\n   are the measurement layer, and #3 is cheap because the harness exists.\n3. **Postmortem → bug-pattern loop (#2)** — the strategic bet; do it once you\n   can measure its review-cost impact (via #1).\n4. **Critic-level advisor escalation (#4)** — last and most cautiously, because\n   it's the only one that can touch verdict reproducibility; gate it behind the\n   stability tracker so drift is visible.\n\nNet: do the two measurement features first (cheap, low-risk, and they de-risk\neverything after), then the high-value learning loop, then the delicate\nescalation refinement under the protection of the stability tracker.\n"}]},{"title":"Releases","docs":[{"id":"docs-releases-v0-18-2","path":"docs/releases/v0.18.2.md","base":"v0.18.2.md","title":"v0.18.2 — code quality hardening + dashboard-style PRs + plain-English comments","md":"# v0.18.2 — code quality hardening + dashboard-style PRs + plain-English comments\n\n**TL;DR.** Cursor BugBot caught three bug classes on the first\nManifest-shipped voice-dictation PRs that `code-review` should have\ncaught itself. This patch closes them at the source. It also reshapes\nthe PR body into a dashboard a reviewer reads in 30 seconds and a\nfinding into a 10-second-readable block — both items you've been\nasking for.\n\nNo migration. All additive.\n\n---\n\n## What was wrong\n\nThe first PRs Manifest shipped against the UWS-502 voice-dictation\ncontract had three Cursor-flagged issues across two repos:\n\n1. **Contract self-contradiction** — B4 said both \"only tap/Esc/blur\n   ends the session\" and \"network/no-speech/aborted errors stop the\n   session.\" A state-machine reader gets ambiguity; the implementer\n   guessed wrong.\n2. **Empty catch + side effects.** `try { recognition.start() } catch {}`\n   followed by `setIsRecording(true)` + start-event analytics. The\n   action could fail silently and the UI lies about success.\n3. **`useState` race guard on rapid clicks.** Reading `isRecording` from\n   state across two rapid clicks → second click sees stale guard,\n   re-enters, zeros `insertedCharCount`.\n\nAll three were in `code-review`'s territory and should have been\nflagged before the PR shipped to a human. This release adds the\npatterns and a self-review pass that catches them before the first\npush.\n\n---\n\n## What changed\n\n### Spec layer — `critic-edge-cases` now checks internal consistency\n\nToday's `critic-edge-cases` asks gap questions (\"what happens if X\").\nIt didn't ask \"do the answers in the spec agree with each other.\"\nThat's the gap that landed the B4 contradiction.\n\nNew section in `skills/critic-edge-cases/SKILL.md`: **State-machine\ncon
