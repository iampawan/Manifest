mplementation run and ~1.5–2× the\n  agent compute (`code-review` runs once pre-push and once in CI).\n  Net wall-clock is a win when external reviewers would otherwise\n  catch ≥1 thing per PR; a small overhead on PRs that would have\n  been clean anyway. Tunable so teams can dial up the threshold or\n  turn off if the overhead doesn't pay off for their diff sizes.\n\n- **`reference/PR-COMMENT-STYLE.md` — new shared style guide.** Every\n  PR comment (critic finding, verify-pr coverage, implementer\n  self-review, fix-pr explanation, bug-triage update) follows the\n  same four-part structure: plain-English title with emoji · what\n  happens · why it matters · the fix with code snippet · file:line.\n  Length budgets enforce concision (blocker ≤ 150 words; warning\n  ≤ 80; info ≤ 1 line).\n\n- **`workflows/pr-verify.yml`: optional stack-native static checks.**\n  Added a commented-out block with the canonical lint / typecheck /\n  test commands per stack (Node / Flutter / Go). Repos whose own CI\n  already runs these can leave it off; repos relying on Manifest can\n  uncomment the block for their stack and get strict pre-AI checks\n  on every PR push.\n\n### Why these are 0.18.2, not 0.18.1\n0.18.1 fixed the *pickup* skill (the Spec entry). 0.18.2 fixes the\n*implementer + reviewer* skills (the Build phase). Different code\npaths, different bugs, different commit. The motivating Cursor\nfindings on UWS-502 voice-dictation PRs all landed in the implementer's\noutput and should never have reached the reviewer's queue in their\noriginal form.\n\n### Migration\nNone. All changes are additive (new critic patterns, new schema\nfields, new SKILL.md sections, a new reference doc). Existing\ncontracts and PRs keep working. Repos relying on the pre-0.18.2\nPR-body template will see a richer body on the next implementer\nrun — no config flip needed.\n\n## [0.18.1] — pickup skill hardening from first real-run feedback\n\nFirst end-to-end test of `/contract pickup` surfaced three real\ngaps. All closed in this patch — no API changes, no new dependencies,\nno migration. Existing 0.18.0 contracts and config keep working.\n\n### Changed\n- **Phase 2 now runs the full critic set inline, unambiguously.** The\n  0.18.0 skill prose left room for the agent to draft the contract,\n  run only `critic-code-context`, and then suggest `/contract verify`\n  as a follow-up — which happened in the first real run. The skill is\n  now explicit: pickup IS the verify. In Phase 2 the agent runs the\n  validator + all the standard judgment critics selected per content\n  (edge-cases / regression / security / instrumentation /\n  comms-completeness / platform-parity / scalability / perf-budget)\n  + `critic-code-context` in one parallel batch, and writes\n  `.findings.{md,json}` exactly as `contract-verify` would. New\n  anti-patterns explicitly forbid suggesting `/contract verify` as a\n  next step and producing a card with only Bucket A.\n\n- **Phase 1.0 preflight — no more silent degradation without\n  `repos.yml`.** 0.18.0 ran pickup happily without\n  `.manifest/repos.yml` and reassured the dev \"fine here — automation\n  is inert.\" That hid a real loss: cross-repo regression scan, cached\n  auto-fill, PM-channel routing, and the answer-watcher all need\n  `repos.yml`. The skill now gates Phase 1 on the file. If missing,\n  the agent stops, lists the four affected features explicitly, and\n  offers to run `/manifest setup` (~30 seconds) or proceed with\n  `pickup.degradedMode: true` recorded in the contract frontmatter so\n  the rest of the pipeline knows. Same gate when a critical MCP isn't\n  connected for the pasted source. Anti-pattern added: don't say\n  \"fine here\" — surface the loss, let the dev decide.\n\n- **Card output reframed for someone reading their first pickup.**\n  0.18.0 led with the contract ID (`SC-001`), bucket letters, and\n  file paths as table columns — fine for someone who already knew the\n  codebase, opaque otherwise. New rules: feature title in plain\n  English leads (contract ID drops to a small metadata row); bucket\n  headlines in plain English (\"Agent filled in 4 from your code\"\n  instead of \"Bucket A — auto-filled from code\"); every technical\n  reference gets a plain-English line above it; file paths drop to\n  `↳ refs:` footnotes; jargon gets a parenthesized gloss the first\n  time it appears; question IDs (`Q-N`) stay in frontmatter and never\n  surface in the human card.\n\n### Why these are 0.18.1, not 0.18.0\n0.18.0 shipped the design + scaffolding. 0.18.1 closes the gaps the\nfirst real run exposed. The skill prose was the difference between\n\"works on paper\" and \"behaves the way the docs claim\" — that's a\nbehavioral change worth a version bump even though no `.json` schema\nor workflow file changed.\n\n## [0.18.0] — dev-centric pickup flow (opt-in)\n\nA new mental model for the most common real-world case: the PM\nwrites a PRD elsewhere (JIRA / Google Doc / Slack / Notion / paste /\nscreenshot) and walks away, and the dev has to make it build-ready\non their own — using code, history, and dependency context the PM\ndoesn't have. Manifest does the code archaeology *for* the dev and\nsurfaces only the decisions that need a human.\n\nThe PM stays in their normal tool. They never have to touch\nManifest — questions go out as one batched JIRA comment / Slack DM\nin the dev's voice; answers materialize as AC edits with provenance\ncomments.\n\nThis release ships the design + scaffolding for the flow. It's\nopt-in per repo via `pickup.enabled: true` in `repos.yml`; without\nthe flag, `/contract pickup` falls back to `/contract new` with a\nnotice. Existing flows (`/contract new`, verify, promote, implement,\ncanary, launch) are unchanged.\n\n### Added\n- **`/contract pickup \u003csource>`** — new subcommand for the\n  dev-centric flow. Source can be any URL (JIRA, Google Doc,\n  Linear, Notion, Confluence, Slack message link, GitHub issue,\n  Figma), pasted text, or a dropped image. Fetches via the right\n  MCP, follows linked docs one level deep, pulls related history\n  (past contracts, postmortems, recent Sentry, active concurrent\n  work). See [skills/contract-pickup/SKILL.md](skills/contract-pickup/SKILL.md).\n- **Three-bucket gap sorter.** Every gap in the PRD lands in\n  exactly one of: **A. agent fills from code/history** (one-tap\n  accept), **B. dev decides** (engineering judgment), **C. only PM\n  can answer** (drafted as a PM-facing question). Dev burns through\n  A in seconds, walks B with judgment, sends batched C questions\n  to the PM.\n- **`critic-code-context`** — new dev-side critic that produces the\n  Bucket A auto-fill proposals (perfBudget from stack defaults,\n  event names from the existing catalog, copy from i18n keys, AC\n  patterns from similar landed contracts) and Bucket B dev-decides\n  items (rolled-back history, dependency budgets, shared modules,\n  locale/device branches the codebase already handles). See\n  [skills/critic-code-context/SKILL.md](skills/critic-code-context/SKILL.md).\n- **PM-channel question posting.** Drafted questions go to the PM\n  via the channel the source came from (JIRA comment, Slack\n  reply-in-thread, Notion comment, Google Doc suggestion) in the\n  dev's voice. Optional `— \u003cdev> (via Manifest)` footer for audit\n  (`pickup.identifyAgent` in `repos.yml`).\n- **Answer watcher.** Polls the PM channel for replies; on\n  detection, parses the answer, applies it as an AC edit with a\n  provenance comment (`\u003c!-- From: Q-N · \u003cPM> · \u003cdate> --\u003e`), moves\n  the question to the sidecar `\u003cID>.qa.md` log, and re-verifies\n  incrementally. Implementation on non-blocking behaviors can run\n  in parallel.\n- **`ROADMAP.md`** at the repo root — captures the broader vision\n  (development / customer support / operations agents) and the\n  impact-ordered immediate priority list this release is one piece\n  of.\n\n### Configuration\nNew `pickup` block in `repos.yml`:\n\n```yaml\npickup:\n  enabled: true            # opt in\n  identifyAgent: true      # \"(via Manifest)\" footer on PM-facing posts\n  defaultChannel: jira     # or: slack | notion | gdoc\n  blockingByDefault: false # questions are non-blocking unless dev flags\n  cacheTTL: 24h            # codebase analysis cache lifetime\n```\n\n### Cache builder + answer watcher (closed mid-cycle)\nWhat started as deferred made it into this release:\n- **`scripts/build-code-context.mjs`** — idempotent, atomically-writing\n  cache builder. Scans target repos for event catalog, i18n keys, flags,\n  shared modules; indexes past contracts by surface area; flags\n  rolled-back / partial history. Output goes to\n  `.manifest/.cache/code-context.json`. Sub-second lookups after the\n  first build. Runnable locally (`node scripts/build-code-context.mjs`)\n  or on cron via `workflows/code-context-build.yml`.\n- **`scripts/answer-watcher.mjs`** — polls PM channels for replies to\n  open pickup-flow questions. Stateless detector that emits a JSON\n  report; the contract-pickup skill consumes the report and applies AC\n  edits + provenance comments + qa.md updates. Runnable locally or on\n  the 15-minute cron in `workflows/answer-watch.yml`.\n\n### Known gaps (still deferred)\n- **Answer-watcher channel adapters are stubs** — they log what they\n  would call but return `mcp-unavailable` by default. Production\n  detection needs either (a) running from inside Claude Code / Cowork\n  with the relevant MCP, or (b) a thin REST proxy on the MCP host. v0.18\n  ships the detection harness + report schema; production wiring lands\n  in a follow-up.\n- **Cross-repo scanning in the cache builder** uses the `path:` field\n  from `repos.yml`. GitHub-only entries (no local `path:`) are skipped\n  for now — pulling source via the GitHub MCP is a follow-up.\n- **Slack message-link parsing** covers the common URL shape; exotic\n  workspace URLs may need a follow-up patch.\n\n### Mental model — when to use which entry point\n- **PM authors in Manifest** (rare today, but the ideal) →\n  `/contract new`. Same as before. Conversational; PM owns the\n  contract.\n- **PM authored elsewhere; dev picks it up** (the common case) →\n  `/contract pickup \u003csource>`. Dev owns the contract; PM stays in\n  their tool.\n\n## [0.17.0] — see your diagrams + findings tell you HOW to fix\n\n### Added\n- **`/contract diagram \u003cID>`** (`scripts/render-diagram.mjs`) — renders a\n  contract's Mermaid blocks into a standalone `\u003cID>.diagram.html` you\n  open in any browser, so you can SEE the diagram even when the `.md`\n  isn't on GitHub and you're deciding from your IDE. Dependency-free\n  (Mermaid via CDN at view time). Docs also point to IDE markdown\n  preview, which renders Mermaid natively/with an extension. 5 new tests.\n- **Diagrams are now optional** — add one only when a branching/state\n  flow makes the contract clearer; skipped by default for simple/bug-fix\n  changes (no more forced flowchart).\n\n### Changed\n- **Findings now tell you HOW, not just what.** The deterministic\n  validator's `suggestion` strings are concrete paste-in templates —\n  e.g. a missing AC suggests `- AC\u003cn> (B2): Given …, when …, then …`; a\n  missing commsStates gives the four-state skeleton with guidance.\n  CRITIC-PROTOCOL now requires every critic `suggestion` to show the\n  shape of the fix and where to make it, not just name the gap.\n\n## [0.16.0] — migrate existing contracts to the new layout\n\n### Added\n- **`scripts/migrate-contract.mjs`** + `/contract migrate \u003cID>` — a\n  deterministic reformat that brings an existing contract to the v0.15\n  grouped frontmatter (YOU-AUTHOR / MANIFEST-MANAGES), adds `changeType`\n  if absent, and leaves the body untouched. **Preserves every value** —\n  managed state (timestamps, status, `landed`, `bugFollowups`) and any\n  unknown fields — and is idempotent. Refuses frozen `\u003cID>.r\u003cN>.md`\n  snapshots. 6 new tests (88 total).\n- Loads frontmatter with `JSON_SCHEMA` so ISO timestamps stay verbatim\n  strings — the default schema parses them to `Date` and re-emits\n  `...000Z`, which would silently rewrite every timestamp. (Caught by a\n  preservation test.)\n\n## [0.15.0] — author-friendly contracts (what to edit, where, what to remove)\n\nThe findings got readable in 0.14.0; this does the same for the contract\nthe author actually edits.\n\n### Changed\n- **Frontmatter split into two labelled groups** in CONTRACT-FORMAT and\n  in what `contract-new` scaffolds: `# ── YOU AUTHOR (edit these) ──`\n  (just `id`, `title`, `changeType`, `platforms`, `createdBy`) and\n  `# ── MANIFEST MANAGES — don't edit ──` (status, complexity,\n  timestamps, fix counters, guard/rollout fields, bugFollowups). No more\n  guessing which fields are yours.\n- **New \"Editing a contract\" section** — maps each findings location\n  (`B2`, `AC3`, `frontmatter`, a section name) to exactly where in the\n  file, says which sections you own, and clarifies *what to remove*:\n  `Out of scope` is where you defer work, drop a behavior by removing the\n  **whole** block (a half-specified behavior is a blocker), and the\n  optional `rollbackTriggers`/`rolloutPlan` blocks are deletable.\n- Optional frontmatter blocks are now clearly marked optional/deletable\n  rather than shown as if required.\n\n## [0.14.0] — readable findings (human-first `.md`)\n\nFindings felt hard to read and people weren't sure how to edit them. Two\nfixes — one a clarification, one a format change:\n\n### Changed\n- **You never hand-edit `findings.md`.** It's the read-only *output* of\n  verify; you edit the **contract** and re-verify (or `/contract fix`),\n  which regenerates it. Stated up front in the file's own banner and the\n  docs.\n- **`findings.md` is now human-first; machine metadata moved to the\n  `.json`.** The `.md` frontmatter is tiny (readiness, promotable,\n  counts) — the wall of `sha256:` hashes, `regressionScan`,\n  `criticsRun`, and normalization notes that used to greet the reader\n  now live in `findings.json` only (where the `--changed` planner and\n  tooling read them). The body lists blockers in full with plain-English\n  fixes, **summarizes** the advisory warnings/info (one line each, full\n  text in the `.json`) instead of dumping dozens of paragraphs, demotes\n  critic IDs to small trailing tags, and ends with \"What to do next.\"\n- **Critics now write in plain English.** CRITIC-PROTOCOL requires\n  `message`/`suggestion` to read like a reviewer's note — jargon spelled\n  out, location in human terms, ID not leading the sentence.\n\n## [0.13.0] — bounded contract verify→fix loop\n\nThe slow part of authoring was the manual round-trip: verify → \"Claude,\nfix it\" → re-verify → a *new* blocker appears → repeat, each pass paying\nfull verify cost. New `/contract fix \u003cID>` collapses it.\n\n### Added\n- **`/contract fix \u003cID>`** (contract-verify fix mode) — runs verify,\n  applies the fixes for **all open blockers in one batch**, re-verifies\n  **incrementally**, and loops until 0 blockers or a 3-pass cap\n  (`maxFixIterations`), then reports a promotable contract. Targets\n  blockers only (warnings stay advisory); on the cap it stops and hands\n  back the remaining blockers instead of churning. One command instead\n  of N hand-driven passes.\n- Key rule that kills the \"re-verify finds new blockers\" whack-a-mole:\n  when a fix adds a behavior/AC, it's added **complete** (all required\n  fields at once) so the next pass doesn't block on the fragment just\n  added — the #1 source of cascading blockers.\n- New `verifyFixIterations` frontmatter counter (distinct from the PR\n  loop's `fixIterations`; both capped by `maxFixIterations`).\n\n## [0.12.0] — solo / zero-footprint mode\n\n### Added\n- **Solo / zero-footprint mode** (GUIDE §1f + a setup-init choice) — use\n  Manifest as an individual contributor without adding a single file,\n  workflow, or Action to a team's repo. Contracts + `repos.yml` live in\n  a separate repo you own (or a local-only folder) and point at the team\n  repo by its `github:` slug via your existing read access; you run the\n  skills (`/contract`, `/code-review`, `/implement`) locally and open a\n  normal PR. The team sees nothing Manifest-related. `setup-init` now\n  asks team-vs-solo and, in solo mode, writes config elsewhere and skips\n  workflow installation entirely. No format changes — adopt the full CI\n  loop later if the team wants it.\n\n## [0.11.0] — native iOS / Android deploy verification\n\n`verify-deployment` could verify web, Flutter, and backend, but native\nSwift/Kotlin apps fell through (the Flutter sub-mode is keyed on\n`languages: [dart]`), so a native contract had no runnable sub-mode.\n\n### Added\n- **Sub-mode D: native mobile** in `verify-deployment` — iOS (Swift,\n  `xcodebuild test`) and Android (Kotlin, `gradlew test` /\n  `connectedAndroidTest`), with three checkpoints: pre-release (CI\n  sim/emulator), internal-track (Firebase Test Lab real-device matrix),\n  and prod (telemetry: Firebase Analytics + Crashlytics crash-free % +\n  Performance). Recognizes that native ships via **store staged\n  rollout** (no feature flag): a `rollback` verdict means *halt the\n  staged rollout*, not flip a flag. Implementer already supported native\n  via STACK-PROFILES; this closes the verification half.\n- **Native mobile CI guidance** — GUIDE §3.4b plus headers in\n  `pr-verify.yml` / `verify-deploy.yml`: iOS jobs need\n  `runs-on: macos-latest` + Xcode setup; Android needs the SDK +\n  `setup-java`; per-repo signing / Firebase Test Lab secrets. Covers the\n  two-separate-features / two-repos / two-teams case (single-platform\n  contracts in each repo, no shared specs repo or parity ceremony).\n\n## [0.10.0] — proportional scope (stop over-engineering small bugs)\n\nDriven by a real run where a one-line bug fix grew into a 5-revision\nepic (a new analytics event, a 7-day shadow baseline, a flag with\nmount-time caching, 21 ACs). The critics were calibrated for net-new\nfeatures and only ever ADD; nothing argued for cutting. Three fixes:\n\n### Added\n- **`changeType: feature | bug-fix` frontmatter** (default `feature`).\n  A `bug-fix` contract verifies LEAN: `contract-verify` runs only\n  `minimality` + scoped `edge-cases` + `regression` + `security`\n  (if relevant); **turns the instrumentation critic OFF** and drops the\n  success-metric / shadow-baseline requirement (a bug's metric is the\n  regression test). `contract-new` sets `bug-fix` for bug intake and\n  scaffolds without a success-metrics section or new events. The\n  validator reports `changeType` in its output.\n- **`critic-minimality` (new, always-runs)** — the counterweight that\n  pushes back on disproportionate scope: feature-grade telemetry /\n  shadow phases / flags / exhaustive speculative edge cases on a small\n  change. Emits `MIN-` findings at `warning` (advisory). Added to the\n  protocol's canonical names + ID prefixes.\n\n### Changed\n- **CRITIC-PROTOCOL framing: \"handle OR explicitly defer.\"** Every\n  critic's `suggestion` must let the author *descope* (move to Out of\n  scope) rather than only \"add handling for X\" — so scope can't grow one\n  finding at a time, and readiness no longer requires building\n  everything a critic noticed. Critics calibrate to `changeType` /\n  `complexity` and bias toward deferral on bug fixes.\n\n### Why\nA bug fix should verify against ~2-3 scoped critics, not a feature's\nfull suite. The UWS-257 contract under the old rules would now: skip\ninstrumentation entirely, drop the shadow baseline + success metric, and\nget a `minimality` warning on the flag/analytics scope — i.e. ~80% smaller.\n\n## [0.9.0] — blockers are the only hard gate (no more endless verify)\n\nVerify could feel endless because reaching `verified` required **0\nwarnings**, and warnings are the LLM-variable findings that reshuffle\nrun-to-run. Now a dev clears a finite, stable set and ships.\n\n### Changed\n- **`promotable` = zero open blockers** is the real gate\n  (`computeReadiness` now returns it). Warnings and info are advisory —\n  they refine the `readiness` signal but **never block promotion**.\n  `contract-promote` now gates on `promotable`, not `status: verified`;\n  it surfaces open warnings and proceeds (you can fix or acknowledge\n  them, but you don't have to).\n- **New `acknowledged` finding status** — a human reviews a warning and\n  accepts it; it leaves the open set and never re-litigates. Added to\n  the finding-status enum (`open | resolved | dismissed | acknowledged`)\n  in both `validateFindings` and `validateReviewFindings`.\n- `contract-verify` and `/status` now lead with `promotable` and list\n  blockers (must-fix) separately from warnings (advisory); verify\n  carries `acknowledged`/`dismissed` statuses forward across re-verifies.\n\n### Why it converges\nBlockers (deterministic facts + serious judgment issues) are stable and\nfinite → drive to zero. Warnings → fix or acknowledge → don't resurface.\nUnchanged content → caching + incremental re-verify reuse prior findings.\nSo the loop terminates instead of chasing run-to-run variance. 4 new\ntests (82 total).\n\n## [0.8.0] — faster verify & re-verify\n\nThe deterministic validator was already \u003c1s; the wall-clock is the LLM\ncritics. This release makes verify do the *smallest correct* amount of\nwork, especially on the edit→re-verify loop.\n\n### Added\n- **Incremental re-verify.** `validate.mjs` now hashes each behavior\n  (+ its ACs) and a global context bucket (`fragmentHashes`), plus an\n  `apiSurfaceHash`. The new `--changed` mode emits a re-run plan: which\n  localized critics to re-run over which changed behaviors, whether the\n  cross-cutting critics need re-running, and whether regression should\n  `rescan` / `reason-only` / `reuse`. Verify follows the plan and reuses\n  prior findings for unchanged fragments — so fixing one finding\n  re-runs one critic over one behavior, not the whole suite. 9 new tests\n  (78 total).\n- **`--fast` verify** — `/contract verify \u003cID> --fast` runs only\n  edge-cases + security and skips the regression scan, for a quick\n  draft-loop verdict. Stamped `verifyMode: fast`; **not promotable** —\n  contract-promote refuses a fast-only verify.\n- **Regression scan caching.** The slowest critic now reuses its repo\n  scan when the API surface + scanned repo head SHAs are unchanged\n  (recorded in the findings' `regressionScan` block); it only re-fetches\n  on a real surface change. Prefers the cheap `declared` scan depth\n  while iterating, full depth on the final verify.\n- **Model tiering** — heavy critics (edge-cases/security/regression/\n  scalability) use a strong model, light ones a fast model; override via\n  `conventions.criticModels`.\n\n### Notes\n- All wins are \"run fewer critics over less input and reuse prior\n  results\" — individual LLM-critic latency is unchanged. Correctness is\n  preserved: any structural change still re-runs the cross-cutting\n  critics; only localized critics (comms/perf/platform/instrumentation)\n  are scoped to changed behaviors.\n\n## [0.7.0] — contextual perfBudget / commsStates gating\n\nProcess proportional to the behavior, not blanket boilerplate.\n\n### Changed\n- **`commsStates` is now required only for user-facing behaviors.**\n  Server-only behaviors (platforms all `server`/`backend`) are exempt —\n  no more demanding four UI states for a backend job.\n- **`perfBudget` gating is configurable** via `conventions.perfBudget`\n  in `repos.yml` (or `perfBudgetPolicy` per contract): `required`\n  (blocker), `warn` (warning — **the new default**, so a missing budget\n  no longer blocks the pipeline), or `off`. When checked, **one relevant\n  numeric field is enough** (ttiMs for UI, p95LatencyMs for a network\n  call) — a behavior with no network call needn't invent a p95. A `TBD`/\n  non-numeric value is flagged at the policy severity.\n- Renamed/rebranded the whole plugin **Shipline → Manifest** (name,\n  slugs, `.manifest/` convention, `/manifest` command, repo reference).\n\n### Notes\n- The two critic skills (`perf-budget`, `comms-completeness`) now defer\n  field-presence to the validator and focus on judgment (are budgets\n  realistic; is error copy actionable). 6 new validator tests (69 total).\n- Rationale: the blanket \"all three fields on every behavior\" rule\n  created friction for backend behaviors and teams without perf\n  telemetry, contradicting \"works with whatever infrastructure you\n  have.\" The value is kept where it's cheap (user-facing UI states) and\n  made opt-in where it isn't.\n\n## [0.6.0] — bug→fix loop closure (+ trigger fix)\n\n### Fixed\n- **Monitoring trigger never fired.** `launch-monitor.yml` matched\n  contracts on `prodRolloutAt:`, but the contract format stores the\n  rollout timestamp as `prodRollout100At:` — so the daily launch-report\n  and bug-triage sweep silently found zero contracts. Corrected the\n  field name (and the day-index computation that used it).\n\n### Added\n- **bug-triage now closes its loop.** After filing/deduping a cluster it\n  routes the bug back into the pipeline: trivial/high-confidence (or any\n  S0/S1) can auto-enter the `/fix` express lane; bigger ones draft a\n  `/contract` stub. Guardrails: propose-by-default, auto-start only for\n  high-confidence-trivial or S0/S1, ≤2 auto-starts per run, never\n  auto-merge (the fix still goes through verify-pr + code-review +\n  human approval). The route is seeded from the triage evidence\n  (symptom, repro, suspect file + git-blame owner, contract context).\n- New `bugFollowups` contract frontmatter — links the routed ticket ↔\n  fix PR / new contract ↔ originating contract; an open follow-up\n  tempers the `landed` verdict. The cluster is marked `routed` in the\n  bug-log so the next nightly run doesn't re-route it.\n\n### Notes\n- No new credentials required: routing reuses the scopes the Implementer\n  already declares (`github:contents:write` / `pull_requests:write`) and\n  the tracker MCP bug-triage already uses. Without write access it\n  degrades to *proposing* the route in Slack / a PR comment.\n\n## [0.5.0] — recall harness, canary orchestrator, rollback ending\n\nFills the gaps a self-audit surfaced: the missing half of the\nreliability story, the described-but-unbuilt canary orchestrator, and\nthe one place the end-to-end loop had no ending.\n\n### Added\n- **Critic recall harness** — `eval/contracts/judgment-gaps.md` is a\n  structurally-complete contract (zero deterministic findings) with\n  planted *judgment* defects; `eval/golden/judgment-gaps.expected.json`\n  declares which critic must catch each. `scripts/recall.mjs` is a\n  deterministic scorer (recall + schema check) with 7 unit tests; the\n  `critic-recall` job in `eval.yml` runs the verify skill against the\n  fixture and scores it (skips cleanly without LLM creds). This is the\n  drift defense RELIABILITY.md #2 asked for — a recall drop fails CI.\n  `contract-verify` now also emits a machine-readable `.findings.json`.\n- **Canary orchestrator (recommend-and-approve)** — `rolloutPlan`\n  (stages + bake `holdHours`) in `repos.yml` / contract frontmatter;\n  `rollback-guard` now recommends the next ramp step on a healthy check;\n  `/canary \u003cID>` shows the current stage + next step. The system never\n  advances the flag — a human does. Fixed the GUIDE wording that\n  implied an automated orchestrator existed.\n- **Post-rollback / postmortem loop** — `rollback-postmortem` skill +\n  `/postmortem \u003cID>`: records `landed: rolled-back` + `rolledBackAt`,\n  writes a blameless postmortem from the contract timeline + guard\n  reports + Sentry, and reopens the work as a follow-up (never closes it\n  as done). The rollback ending the loop was missing.\n\n### Changed\n- **Workflow robustness.** `launch-monitor.yml` and `rollback-guard.yml`\n  share a `concurrency: manifest-state-writer` group and rebase before\n  push, so concurrent crons no longer race on the specs repo.\n  Launch-monitor gained **missed-cron catch-up**: it produces any\n  reached-but-unwritten milestone report instead of requiring an exact\n  day match (a delayed/skipped scheduled run no longer drops a report).\n- **code-review** gained a dependency / supply-chain check (avoidable\n  new deps, unpinned ranges, typosquats, license flags, lockfile drift)\n  when the diff touches a manifest/lockfile.\n- New frontmatter: `currentRolloutPercent`, `rolledBackAt`, optional\n  per-contract `rolloutPlan`.\n\n## [0.4.0] — code review, the fix loop, and a rollout guard\n\nCloses the two gaps between \"the spec is good\" and \"the running feature\nis safe\": code-level review of the diff, and a watcher on the rollout.\n\n### Added\n- **`code-review` skill (PR stage)** — reviews the diff for security,\n  correctness, performance, and maintainability defects, distinct from\n  `verify-pr`'s AC/contract conformance. Emits `CR-` findings on the\n  shared `blocker/warning/info` enum, schema-checked by\n  `validate.mjs --check-review`; open blockers gate the merge. Runs in\n  `pr-verify.yml` alongside verify-pr; `/code-review \u003cPR>` to run it\n  manually. GUIDE ②.\n- **Review→fix loop** — `@claude /fix-pr \u003cID>` runs the Implementer in\n  fix-mode: it reads the open `code-review` / `verify-pr` findings,\n  fixes them narrowly, re-pushes, and CI re-verifies. Bounded by\n  `maxFixIterations` (default 3) then escalates to a human — no churn.\n- **`rollback-guard` skill + `rollback-guard.yml`** — during the rollout\n  window, samples Sentry errors, crash-free rate, and release adoption\n  against the contract's budgets + optional `rollbackTriggers`, and\n  RECOMMENDS `proceed | hold | recommend-rollback`. It never executes a\n  rollback — a `recommend-rollback` posts a top-level Slack alert to the\n  owner with the breached signal and the exact action. `/rollback-check\n  \u003cID>` to run on demand. GUIDE ③.\n- New contract frontmatter: `fixIterations` / `maxFixIterations` (loop\n  cap), `guardVerdict` / `guardCheckedAt`, and a `rollbackTriggers`\n  block. CONTRACT-FORMAT updated.\n- `validate.mjs` gains `validateReviewFindings` + `validateGuardVerdict`\n  with `--check-review` / `--check-guard` CLI modes (exit codes gate CI:\n  2 = open review blockers, 3 = recommend-rollback). 11 new tests (56\n  total).\n\n### Notes\n- The guard deliberately recommends rather than acts — pausing a canary,\n  flipping a flag, or reverting is a production change a human owns.\n  This matches `verify-deployment`'s long-standing \"don't auto-rollback\"\n  stance.\n\n## [0.3.3] — lifecycle & retention\n\n### Added\n- **Archival/retention** — landed contracts (day-28) auto-archive to\n  `.manifest/archive/\u003cyear>/\u003cID>/`; keeps contract + final report,\n  prunes process exhaust (git history retains it). `retention: keep-all`\n  to archive everything. Manual `/contract archive \u003cID>`. Keeps the\n  active contracts folder lean as the team ships more features. GUIDE 1e.\n\n## [0.3.2] — central state (specs-repo model)\n\n### Added\n- **Dedicated specs-repo model** for central state — one repo on one\n  `main` branch is a consistent source of truth (no per-branch\n  divergence); also the home for cross-repo contracts. GUIDE 1d.\n- **Advisory locks** — `owner` / `lockedBy` / `lockedAt`; verify and\n  implement warn if someone else holds a recent lock (advisory, git\n  is the arbiter).\n\n### Notes\n- A real-time central *service* (locking + query API) remains a\n  deferred v2+; the plugin is built so it would wrap the same contract\n  format, not replace it.\n\n## [0.3.1] — content-hash caching\n\n### Added\n- **Content-hash caching** — `/contract verify` skips the LLM critics\n  when the contract content + plugin version are unchanged since the\n  last verify (reuses prior findings). No-op re-runs (CI, habit,\n  iterating on other files) now cost zero tokens. `--force` overrides.\n  `validate.mjs --cache-check` powers it; 5 tests.\n\n## [0.3.0] — right-sized process + leaner critics\n\nProcess proportional to risk, end to end.\n\n### Added\n- **Express lane** (`/fix` + `quick-fix` skill) for trivial bugs and\n  tiny changes — skips the contract ceremony (no critics/SLA/launch\n  report), triages first and escalates to `/contract` if the change is\n  bigger than trivial. Plus a deterministic stack detector\n  (`scripts/detect.mjs`, 16 tests) and the `setup-init` wizard that\n  auto-generates `repos.yml` (no external code-index MCP needed).\n- **Smart Large support** — `/contract decompose` turns a Large\n  contract into an epic with dependency-ordered Small/Medium children;\n  migrations/auth flagged `human-led`. Large is made tractable, not\n  refused.\n- Stack-agnostic Implementer + STACK-PROFILES toolchain reference\n  (web/mobile/backend; no assumed npm/Playwright).\n- **SLA countdown in every update** — `validate.mjs --sla` prints time-\n  left / overdue; implement, verify-pr, verify-deploy, and promote all\n  lead their updates with it (4 tests).\n- **All times shown in IST + UTC** (e.g. `13:30 IST / 08:00 UTC`).\n- **`/status [\u003cID>]`** — phase + SLA + readiness + next action for one\n  contract, or a dashboard of everything in flight (overdue first).\n  Deterministic via `validate.mjs --status` + `derivePhase` (6 tests).\n- **Slack per-contract threading** — one top-level message per contract\n  (the promote anchor); every later update threads under it via\n  `slackThreadTs`. One channel, no spam. Urgent items (overdue,\n  rollback, auto-pause) also post a brief top-level alert.\n\n### Changed\n- **Critic set optimized.** `critic-sizing` removed (the validator\n  computes sizing deterministically — superseded record in\n  `docs/superseded-critic-sizing.md`). `platform-parity`,\n  `scalability`, and `perf-budget` judgment now run **conditionally**\n  (only when relevant), cutting tokens and noise. Always-run core:\n  edge-cases, regression, security.\n- Repo docs reorganized: root has 3 files; specs in `reference/`,\n  planning docs in `docs/`.\n\n### Fixed\n- Validator skips behavior checks on `type: epic` contracts.\n\n## [0.2.0] — reliability hardening\n\nThe \"make it real for teams\" release. Addresses the production-grade\ngaps in the v0.1 prototype.\n\n### Added\n- **Deterministic validator** (`scripts/validate.mjs`) — real code for\n  all mechanical checks (field presence, AC coverage, sizing, readiness,\n  output-schema validation). Reproducible, free, unit-tested.\n- **Shared critic protocol** (`CRITIC-PROTOCOL.md`) — single source for\n  the closed severity enum (blocker/warning/info), output schema, ID\n  prefixes, and anti-patterns. All 9 critics reference it.\n- **Eval harness** (`eval/`) — golden contracts + unit tests for the\n  validator. 13 tests, all passing. This is the regression gate that\n  makes future changes safe.\n- **Scope declarations** — write-path skills declare `requiredScopes`;\n  `/setup` verifies actual granted scopes; `contract-promote` refuses\n  up front if `github:issues:write` is missing (no more silent\n  tracking-issue failures).\n- **Input preconditions** — `verify-deployment` refuses on null/empty\n  target instead of emitting a misleading `hold` verdict.\n- **Provenance stamping** — findings files record pluginVersion, model,\n  protocolVersion, and contractHash for reproducibility.\n- **CI workflow** (`workflows/eval.yml`) — runs the eval suite on every\n  change; fails the build on test failure or schema violation.\n\n### Changed\n- `contract-verify` is now a two-layer orchestrator: deterministic\n  validator first, then ONLY judgment critics (not all 9 as LLM calls).\n  Lower cost, deterministic verdict.\n- Contract format requires explicit `AC1 (B1):` behavior references so\n  AC coverage is deterministically checkable.\n- `verify-deployment` is platform-aware (web / Flutter / backend).\n- Regression critic does cross-repo API dependency tracing.\n\n### Fixed\n- Parser used `\\Z` (invalid in JS regex) as an end anchor, silently\n  breaking AC→behavior parsing. Caught by the new eval harness.\n- Out-of-schema severities (\"high\", \"medium\") are now rejected by the\n  validator instead of leaking through.\n\n### Known limitations (see RELIABILITY.md)\n- Judgment-critic output still varies run-to-run (bounded by schema +\n  protocol, but not bit-identical — inherent to LLMs).\n- Content-hash caching designed, not yet implemented.\n- True central state across branches not built (divergence is\n  detectable via contractHash, not prevented).\n- Model pinning depends on runtime support; the eval suite is the\n  drift-detection mechanism.\n\n## [0.1.0] — prototype\n\n- Initial plugin: 9 critic skills, contract lifecycle (new/verify/\n  promote), implement/verify/launch agents, GitHub Actions workflows,\n  tutorial, setup-check, multi-repo config.\n- All critics were LLM prompts (non-deterministic). Superseded by the\n  two-layer architecture in 0.2.0.\n"},{"id":"CONTRIBUTING","path":"CONTRIBUTING.md","base":"CONTRIBUTING.md","title":"Contributing to Manifest","md":"# Contributing to Manifest\n\nThanks for your interest in improving Manifest. This guide covers how the\nproject is laid out, how to run the tests, and what we look for in a pull\nrequest.\n\n## Prerequisites\n\n- **Claude Code** (or Cowork) — to load and exercise the plugin\n- **Node.js 18+** — the deterministic layer and its tests are plain Node\n  (`node --test`), no build step or test framework to install\n\n## Setup\n\n```bash\n# Install the validator's only dependency (js-yaml)\ncd scripts && npm install\n\n# Run the full eval suite from the repo root — must be green (93 tests today)\ncd .. && node --test eval/*.test.mjs\n```\n\nTo load your working copy as a live plugin while you iterate:\n\n```bash\nclaude --plugin-dir .\n```\n\nSKILL.md edits are picked up on the next invocation; changes to\n`plugin.json` / `marketplace.json` need a Claude Code restart.\n\n## Project layout\n\n| Path | What lives here |\n|---|---|\n| `skills/*/SKILL.md` | Skills — markdown + frontmatter. The `description` field tells Claude *when* to invoke the skill, so keep it specific. |\n| `commands/*.md` | Slash command definitions (`/contract`, `/implement`, …). |\n| `scripts/*.mjs` | The **deterministic layer** — validator, sizing, stack detection, diagram render. Pure Node, fully unit-tested. |\n| `eval/*.test.mjs` | Tests for everything in `scripts/`. Fixtures live in `eval/contracts/` and `eval/golden/`. |\n| `reference/` | Specs the skills read at runtime — contract format, the shared critic protocol, per-stack toolchains. |\n| `workflows/*.yml` | GitHub Actions that get copied into a target repo's `.github/workflows/`. |\n| `docs/` | Human-facing planning and install docs. |\n\n## Two-layer design (please preserve it)\n\nManifest deliberately splits verification into two layers:\n\n- **Deterministic** (`scripts/`) — anything mechanical and reproducible:\n  schema checks, sizing arithmetic, the readiness verdict. This is code,\n  not an LLM prompt, and **the readiness verdict is never judged by an\n  LLM.** Changes here require a corresponding test in `eval/`.\n- **Judgment** (LLM critics) — only genuine reasoning. Critic rules are\n  defined once in `reference/CRITIC-PROTOCOL.md`; critic output is\n  schema-validated by the deterministic layer.\n\nWhen in doubt, push logic toward the deterministic layer.\n\n## Making a change\n\n1. **Branch** off `main`.\n2. **Add or update a test** for any change to `scripts/` — the eval suite\n   must stay green (`node --test eval/*.test.mjs`).\n3. **Keep commit messages conventional** — `feat:`, `fix:`, `docs:`,\n   `chore:`, etc.\n4. **Update `CHANGELOG.md`** and bump the `version` in both\n   `.claude-plugin/plugin.json` and `.claude-plugin/marketplace.json` if\n   the change is user-visible.\n5. **Open a PR** describing what changed and why. Note if any\n   `workflows/*.yml` changed, since consumers must re-copy those into\n   their own repos.\n\n## Reporting bugs / requesting features\n\nOpen a GitHub issue with steps to reproduce (for bugs) or the problem\nyou're trying to solve (for features). Including the Manifest version\n(from `.claude-plugin/plugin.json`) and your Claude Code version helps.\n\n## License\n\nBy contributing, you agree that your contributions will be licensed under\nthe [MIT License](LICENSE).\n"}]},{"title":"Reference","docs":[{"id":"reference-CONTRACT-FORMAT","path":"reference/CONTRACT-FORMAT.md","base":"CONTRACT-FORMAT.md","title":"Contract format","md":"# Contract format\n\nA contract is a markdown file at `.manifest/contracts/\u003cID>.md` with YAML\nfrontmatter and structured sections. The format is designed to be both\nhuman-readable and machine-parseable.\n\n## Minimal template\n\nThe frontmatter splits in two: a short set **you author**, and the rest\nthat **Manifest manages** as the contract moves through the pipeline.\nYou only edit the author fields (`id`, `title`, `changeType`,\n`platforms`, `createdBy`) and the body sections below — never the\nmanaged fields. See \"Editing a contract\" right after this template.\n\n```markdown\n---\n# ── YOU AUTHOR (edit these) ──\nid: SC-001\ntitle: Saved payment methods on web and iOS\nstatus: draft               # draft | verifying | verified | promoted\ncomplexity: null            # set by critic-sizing: small | medium | large\nchangeType: feature         # feature | bug-fix — drives how much rigor verify applies\nplatforms: [web, ios]\ncreatedBy: pawan@example.com\nrevision: 1\n\n# Cycle-time timestamps — each stamped by the skill that triggers the\n# transition. The Launch Report computes total cycle time from these.\ncreatedAt: 2026-05-19T09:00:00Z        # /contract new\nverifiedAt: null                        # readiness gate goes green\npromotedAt: null                        # /contract promote (SLA timer starts here)\nslaDeadline: null                       # promotedAt + 24h or 72h\nprOpenedAt: null                        # implement skill opens PR\nprMergedAt: null                        # PR merged to main\nqaDeployedAt: null                      # successful deploy to QA env\ncanaryStartedAt: null                   # 1% rollout begins\nprodRollout100At: null                  # feature flag hits 100%\nlandedAt: null                          # day-28 verdict committed\nlanded: null                            # true | false | partial | rolled-back\nslaHit: null                            # promotedAt → prodRollout100At within SLA?\n\n# Fix-loop counters (bounded so loops can't churn). maxFixIterations caps both.\nfixIterations: 0                        # PR-stage review→fix passes (implement fix-mode)\nverifyFixIterations: 0                  # spec-stage verify→fix passes (/contract fix)\nmaxFixIterations: 3                     # cap for both; override via repos.yml conventions\n\n# Rollout health (set by rollback-guard while the feature is ramping)\nguardVerdict: null                      # proceed | hold | recommend-rollback\nguardCheckedAt: null                    # last rollback-guard sample (ISO)\ncurrentRolloutPercent: null             # current canary stage; human advances the flag, guard records it\nrolledBackAt: null                      # set by rollback-postmortem if the feature was reverted\n\n# Post-launch bugs routed back into the pipeline (set by bug-triage).\n# An open follow-up means landing is at risk — launch-report tempers its\n# verdict accordingly. route: fix | contract; status: open | merged | closed.\nbugFollowups: []                        # e.g. [{ ticket: BUG-101, route: fix, ref: \"PR#234\", status: open }]\n# rolloutPlan: (optional per-contract override of repos.yml conventions.rolloutPlan)\n#   stages: [{ percent: 1, holdHours: 2 }, { percent: 10, holdHours: 4 }, ...]\nrollbackTriggers:                       # optional explicit guardrails; defaults used if absent\n  errorRateMultiplier: 3                # error rate > N× baseline → breach\n  crashFreeFloor: 99.0                  # crash-free users % must stay ≥ this\n  newIssueSeverity: blocker             # new Sentry issue at/above this → breach\n  minAdoptionForSignal: 0.05            # ignore signals until ≥ this fraction on the release\n---\n\n## Editing a contract — what to change, where, what to remove\n\nYou edit the contract by hand (or ask Claude to), then re-verify. When\nfindings point at a location, here's where it is and what's safe to do:\n\n| Findings says… | Edit here |\n|---|---|\n| `B2`, \"in B1's description\" | the `### B2.` behavior block (one block per behavior) |\n| `AC3`, \"under Acceptance criteria\" | the `## Acceptance criteria` list (`- AC\u003cn> (B\u003cn>):` lines) |\n| `frontmatter` | only the YOU-AUTHOR fields (`id`, `title`, `changeType`, `platforms`, `createdBy`) |\n| `Goal` / `Success metrics` / a section name | that `## \u003csection>` |\n\n- **What you own (edit freely):** `Goal`, `Success metrics` (omit it\n  entirely for a bug-fix), the `### B\u003cn>` behaviors, `Acceptance\n  criteria`, `Diagrams`, `Out of scope`, `Open questions`, and the five\n  author frontmatter fields.\n- **What to remove / defer:** `## Out of scope` is the place to *defer*\n  work — move a finding there instead of building it if it isn't needed\n  now (this is how you keep scope small). To drop a behavior, remove the\n  **whole** `### B\u003cn>` block — don't leave it half-specified, because a\n  behavior missing its required fields (instrumentation / perfBudget /\n  commsStates / an AC) is a blocker.\n- **What never to touch:** every frontmatter field except the five\n  author ones — `status`, `complexity`, the timestamps, the fix\n  counters, the guard/rollout fields, `bugFollowups`. The tool sets\n  those; editing them by hand only confuses the SLA/cycle-time math.\n\n## Goal\n\nOne paragraph. What problem does this solve, for whom, why now?\n\n## Success metrics\n\n- metric: percent_of_checkouts_using_saved_card\n  eventName: checkout_completed\n  property: payment_method_source\n  target: \">= 30% within 28 days\"\n  window: 28d\n\n## Behaviors\n\n### B1. User adds a card during checkout\n- platforms: [web, ios]\n- instrumentation:\n    eventName: payment_method_added\n    properties: [source, card_brand]\n    expectedRatePerDay: 200\n- perfBudget:\n    ttiMs: 1500\n    p95LatencyMs: 800\n    errorRatePct: 0.5\n- commsStates:\n    empty: \"No saved cards yet\"\n    loading: \"Saving your card...\"\n    success: \"Card saved. You'll see it next time.\"\n    error: \"We couldn't save that. Try again or use a different card.\"\n\n### B2. User selects a saved card at checkout\n- ...\n\n## Acceptance criteria\n\nEach AC MUST declare which behavior it covers, using `(B\u003cn>)` right\nafter the AC id. The deterministic validator uses this to verify that\nevery behavior has at least one AC — without explicit linkage it can't\ncheck coverage. One AC can cover multiple behaviors: `AC1 (B1, B2):`.\n\n- AC1 (B1): Given a logged-in user with no saved cards, when they complete\n  checkout and check \"Save this card\", then a payment_method_added event\n  fires with source=\"checkout\" and the card appears on /account/payment-methods.\n- AC2 (B2): ...\n\n## Diagrams (optional)\n\nInclude a Mermaid diagram only when a branching/state/multi-actor flow\ngenuinely makes the contract clearer — skip it for a simple change or a\nbug fix. **To see it as a picture, not text:** open the file in your\nIDE's markdown *preview* (VS Code with the Mermaid extension, JetBrains\nand Obsidian render it natively), or run `/contract diagram \u003cID>` to\nwrite a standalone `\u003cID>.diagram.html` you can open in any browser.\n\n```mermaid\nflowchart LR\n  Checkout --\u003e AddCard --\u003e SaveDecision --\u003e Stored\n  Stored --\u003e NextCheckout --\u003e SelectSaved --\u003e Pay\n```\n\n## Out of scope\n\nExplicitly list what this does NOT include, so reviewers don't add scope.\n\n## Open questions\n\nThings the author needs answered before promote. Critics will flag these.\n```\n\n## Field reference\n\n### Frontmatter\n\n| Field | Required | Notes |\n|---|---|---|\n| `id` | yes | Short stable ID. Prefix by epic area (SC, AUTH, etc.) |\n| `title` | yes | One line |\n| `status` | yes | State machine: draft → verifying → verified → promoted |\n| `complexity` | set by the validator | small / medium / large |\n| `platforms` | yes | Subset of [web, ios, android, server, email] |\n| `revision` | yes | Bumps on every promoted edit |\n| `type` | no | `epic` for a decomposed Large contract; omitted otherwise |\n| `parent` | no | On a child: the epic ID it belongs to |\n| `children` | no | On an epic: ordered list of child contract IDs |\n| `dependsOn` | no | On a child: child IDs that must ship first |\n| `implementation` | no | `agent` (default) or `human-led` (migrations/auth — speced + verified by Manifest, human writes the code) |\n| `slackThreadTs` | set on promote | Slack `thread_ts` of the contract's anchor message; later updates reply in this thread |\n| `slackChannel` | set on promote | The channel the thread lives in (default `#manifest`) |\n| `owner` | set at intake | Who owns this contract (email/handle) |\n| `lockedBy` | advisory | Who is actively working it right now; set on verify/implement, cleared on completion |\n| `lockedAt` | advisory | ISO time the lock was taken (a lock older than ~2h is treated as stale) |\n\n### Central state — where contracts live\n\nContracts are the source of truth, so they need ONE home. For a\nmulti-repo product, that home is a **dedicated specs repo** (e.g.\n`your-org/manifest-contracts`) on a single `main` branch — not the\n`.manifest/` of any one code repo. Git gives a total commit order on\none branch, so that repo *is* a consistent central store: no two devs\nget diverging findings for the same contract. Code PRs in the product\nrepos reference the contract by ID; they don't carry contract state.\n`/status` run in the specs repo is the live dashboard.\n\nThe `owner` / `lockedBy` / `lockedAt` fields are an **advisory** layer\non top: they help teammates avoid stepping on each other, but they're\nonly meaningful in the single-branch specs-repo model (a lock in a\ngit file across divergent branches diverges like anything else). They\nwarn, they don't hard-block — git remains the real arbiter.\n\nA real-time, concurrent-edit-locked central *service* (Firestore/\nPostgres + API) is the v2+ upgrade if single-branch git ever causes\nreal friction; the plugin is deliberately built so that service would\nwrap the same contract format rather than replace it.\n\n### Large contracts → epics\n\nA `large` contract is not refused. `/contract decompose \u003cID>` turns it\ninto an **epic** (`type: epic`) whose `children` are dependency-ordered\nSmall/Medium contracts. The epic owns the overall success metric\n(measured across all children); each child is a normal contract with\n`parent` set, verified and promoted in order. Risky children\n(migrations, auth) carry `implementation: human-led`. The validator\nskips behavior-level checks on an epic (its behaviors live in the\nchildren). See the `contract-decompose` skill.\n\n### Cycle-time timestamps\n\nEvery transition stamps a timestamp. The Launch Report computes total\ncycle time and per-phase durations from these. Each stamp is set by\nthe skill or workflow that triggers the transition:\n\n| Field | Set by | Captures |\n|---|---|---|\n| `createdAt` | `contract-new` | When intake started |\n| `verifiedAt` | `contract-verify` | When readiness went green |\n| `promotedAt` | `contract-promote` | When SLA timer started |\n| `slaDeadline` | `contract-promote` | promotedAt + 24h (small) or 72h (medium) |\n| `prOpenedAt` | `implement` | When the Implementer opened the PR |\n| `prMergedAt` | `verify-pr` (on merge) | When the PR merged to main |\n| `qaDeployedAt` | `verify-deployment` | When QA deploy succeeded |\n| `canaryStartedAt` | `verify-deployment` | When 1% rollout began |\n| `prodRollout100At` | `verify-deployment` | When flag hit 100% |\n| `landedAt` | `launch-report` | When day-28 verdict committed |\n| `landed` | `launch-report` | Final verdict |\n| `slaHit` | `launch-report` | Did promotedAt → prodRollout100At fit the SLA? |\n\nThe Launch Report includes a cycle-time section per day surfacing:\n- **Total intake → prod**: createdAt → prodRollout100At\n- **Promoted → prod**: promotedAt → prodRollout100At (the SLA window)\n- **Per-phase**: time in each phase (spec / build / ship / land)\n\nTrack these across many contracts and you get a real distribution of\nyour team's actual cycle time — which is more valuable than any\nsingle SLA promise.\n\n### Slack threading — one channel, no spam (convention)\n\nAll Manifest updates post to ONE channel (`#manifest` by default), but\nthey DON'T flood it. Each contract gets exactly **one top-level\nmessage** (the promotion announcement); every later update — implement\ndone, verify verdict, canary approval, launch reports day 1/7/14/28,\nbug triage — posts as a **threaded reply** under it.\n\nThe mechanism: `contract-promote` posts the anchor message and records\nits Slack `thread_ts` on the contract:\n\n```yaml\nslackThreadTs: \"1716192000.123456\"   # set by contract-promote\nslackChannel: \"#manifest\"            # the channel the thread lives in\n```\n\nEvery later skill that posts (implement, verify-deploy, launch-report,\nbug-triage) posts with `thread_ts: \u003cslackThreadTs>` so it lands in the\nthread, not the channel. Result: the channel shows one line per\ncontract; click in to see its whole history.\n\n**Exception — urgent alerts.** SLA overdue, a `rollback` verdict, or a\ncanary auto-pause ALSO post a brief top-level alert that links back to\nthe thread, so genuinely urgent things aren't buried. Everything else\nstays threaded.\n\n### SLA countdown in every update (convention)\n\nEvery status update during the build/ship phases — PR comments,\nSlack messages, command output — leads with the current SLA line so\nthe dev always knows where they stand. Get it deterministically:\n\n```bash\nnode \u003cplugin-root>/scripts/validate.mjs --sla .manifest/contracts/\u003cID>.md\n```\n\nIt prints one of:\n- `⏳ SLA: 18h 20m left (due \u003ctime>)` — on track\n- `⏳⚠️ SLA: 3h 10m left (due \u003ctime>)` — under 20% of the window left\n- `⚠️ SLA OVERDUE by 2h 5m (was due \u003ctime>)` — past deadline (exit 1)\n- `SLA: not started (promote to start the timer)` — pre-promote\n\nThe implement, verify-pr, verify-deploy, and promote skills all\nprepend this line. The countdown resolves once the feature hits 100%\nprod (then `slaHit` records the final hit/miss).\n\n### Behavior fields\n\nEvery behavior needs `instrumentation` and an acceptance criterion. The\nother two fields are **contextual**, so the gate fits the behavior\ninstead of demanding boilerplate:\n\n- **`commsStates`** is a UI concern — required only for **user-facing**\n  behaviors (platforms include web/ios/android/etc.). A **server-only**\n  behavior (platforms are all `server`/`backend`) is exempt.\n- **`perfBudget`** is governed by a policy: `required` (missing/`TBD` is\n  a blocker), `warn` (a warning — visible but doesn't block; **the\n  default**), or `off` (not checked). Set it per repo via\n  `conventions.perfBudget` in `repos.yml`, or per contract via the\n  `perfBudgetPolicy` frontmatter field. When checked, you need only\n  **one numeric field that's relevant** (e.g. `ttiMs` for UI,\n  `p95LatencyMs` for a network call) — a behavior with no network call\n  doesn't have to invent a p95.\n\n### Change type — `feature` vs `bug-fix`\n\n`changeType` tells verify how much rigor to apply. The default\n(`feature`) runs full rigor. **`bug-fix` deliberately runs lean**, so a\nsmall bug doesn't get feature-grade ceremony:\n\n- **No success-metric / shadow-baseline requirement.** A bug fix's\n  \"metric\" is *the bug is gone + a regression test passes* — not a new\n  product-analytics event. The `## Success metrics` section is optional\n  for a bug-fix contract.\n- **Instrumentation critic OFF.** Don't demand a new event taxonomy. A\n  behavior may declare `instrumentation: none` with a one-line rationale.\n- **Edge-cases and comms scoped to the change.** Critics evaluate the\n  bug's actual surface and the copy that's actually changing — they do\n  NOT enumerate exhaustive edge cases (IME, SSR, full Unicode classes,\n  drag-drop, …) that a net-new feature would warrant. Such cases are\n  *deferred to Out of scope* unless they ARE the bug.\n- **Reduced critic set**: edge-cases (scoped), regression, security (if\n  relevant). The `minimality` critic always runs and pushes back on\n  disproportionate scope.\n\nIf a \"bug fix\" genuinely needs new instrumentation, a flag, or spans\nplatforms, it isn't a bug fix — set `changeType: feature` (or it's\nreally a feature contract). The point is to stop a one-line gate from\ngrowing a shadow-observation phase.\n\n### Sizing rules (set by critic-sizing)\n\n| Bucket | Rules |\n|---|---|\n| **small** | 1 platform, ≤3 behaviors, no schema, no auth, flag-gated |\n| **medium** | ≤2 platforms, ≤8 behaviors, additive schema OK, existing vendors |\n| **large** | Anything else — exits the pipeline |\n\n## Findings file\n\nVerification produces `.manifest/contracts/\u003cID>.findings.md`:\n\n```markdown\n---\ncontractId: SC-001\nverifiedAt: 2026-05-19T10:00:00Z\nverifiedRevision: 1\nreadiness: review_needed\nconfidenceScore: 0.78\n---\n\n## Open blockers (0)\n\n(none)\n\n## Warnings (2)\n\n### W1 [instrumentation-coverage] B3 has no instrumentation field\nSuggestion: add an event for \"user removes saved card\", at least `payment_method_removed`.\nStatus: open\n\n### W2 [platform-parity] B2 only describes web behavior\nSuggestion: clarify iOS interaction (modal vs full screen).\nStatus: open\n\n## Info (5)\n...\n```\n"},{"id":"reference-CRITIC-RULES","path":"reference/CRITIC-RULES.md","base":"CRITIC-RULES.md","title":"Critic rules (compact runtime digest)","md":"# Critic rules (compact runtime digest)\n\nThis is the **compact** rule layer a critic loads at run time — only what you\nneed to emit valid output. The full human/orchestrator reference (provenance,\ncost, model pinning, rationale) is `CRITIC-PROTOCOL.md`; you do NOT need it to\nrun. Keep this digest and that file in sync (a test enforces the hard facts).\n\n## Output — return a JSON array; every element matches this shape\n\n```json\n{\n  \"id\": \"\u003cPREFIX>-\u003cNNN>\",          // e.g. EC-001\n  \"critic\": \"\u003ccanonical name>\",    // see prefixes below\n  \"severity\": \"blocker | warning | info\",\n  \"message\": \"one-line plain-English statement of the gap\",\n  \"suggestion\": \"concrete fix: where to edit + the shape of the edit\",\n  \"fragmentRef\": \"B2 | AC3 | frontmatter | \u003csection>\",\n  \"references\": [\"repo:path:line\"],   // optional; required for regression\n  \"source\": \"github-mcp | local-clone | contract-only\",\n  \"status\": \"open\"                    // open | resolved | dismissed | acknowledged\n}\n```\n\n## Severity — CLOSED enum, exactly these three\n\n`blocker` (prevents progress: data/security/perms, missing required field,\nbroken cross-repo contract, breaking change) · `warning` (should fix, doesn't\nblock on its own) · `info` (worth knowing).\n**FORBIDDEN:** `high`/`medium`/`low`/`critical`/`major`/`minor`/`p0`/`p1`/numbers.\nThe validator rejects anything else and the run fails loud. \"High\"→blocker,\n\"medium\"→warning, \"low\"→info.\n\n## Critic name → ID prefix\n\n```\nminimality MIN-   edge-cases EC-   platform-parity PP-   instrumentation INS-\ncomms-completeness COMMS-   perf-budget PERF-   regression RG-   security SEC-\nscalability SC-   sizing SZ-\n```\n\n## Determinism (minimize run-to-run variance)\n\n- Use the closed enum. Cap at **12 findings per critic** — raise your bar, don't pad.\n- Ground every finding in a concrete `fragmentRef` (and `references` for regression).\n- Don't re-report what's already in the contract. Read first.\n- Order by severity (blockers first), then fragment order.\n- **Don't re-check what `scripts/validate.mjs` already enforces** (field presence,\n  AC count, sizing, platform-subset) — add the judgment layer on top.\n\n## Anti-patterns\n\n- Don't emit out-of-enum severities. Don't duplicate the deterministic checks.\n- Don't speculate without grounding. Don't exceed 12. Don't propose code changes —\n  propose *spec clarifications* (code is the Implementer's job).\n- Don't soften a real blocker to be \"nice.\" If it blocks, it blocks.\n- Don't degrade silently on bad input — if you can't run (missing repo access,\n  null input), say so as an `info` finding with the reason; never fake a verdict.\n\n## Message + suggestion — write for a human\n\n- `message`/`suggestion` are plain English a non-author can act on. Spell out\n  jargon (\"the 50ms responsiveness budget\", not \"p75 ttiMs\"); say where in human\n  terms (\"under Acceptance criteria\"); don't lead with the ID.\n- `suggestion` shows HOW: where to edit + a fill-in template, not just \"add a\n  description.\" If a thing isn't needed here, say to move it to `## Out of scope`.\n\n## Framing — offer deferral, calibrate to the change\n\nEvery finding is \"handle X **or** explicitly defer X\" (move to `## Out of scope`)\n— so the author can clear it by descoping, and readiness never *requires* building\neverything a critic noticed. Read `changeType`/`complexity`: on a `bug-fix` or\nsmall change, **bias toward deferral** — speculative edge cases/telemetry/flags\nshould be flagged for deferral, not demanded.\n\n## Advisor (only if enabled) — advisory findings ONLY\n\nIf an advisor is available, you may consult it on a **borderline `warning`/`info`**\ncall (whether to emit, or how to phrase it). **Never** on a `blocker` — the\nvalidator rejects an advisor-influenced blocker, keeping the gate deterministic.\nMark any advisor-influenced finding `metadata.advisorConsulted: true`.\n"},{"id":"reference-CRITIC-PROTOCOL","path":"reference/CRITIC-PROTOCOL.md","base":"CRITIC-PROTOCOL.md","title":"Critic protocol (shared rule layer)","md":"# Critic protocol (shared rule layer)\n\nThis is the **full** reference: the runtime rules a critic needs *plus* the\norchestrator/maintainer concerns (provenance, model pinning, cost, advisor\nmechanics, rationale). One source of truth for the rules.\n\n**At run time, critics load the compact `CRITIC-RULES.md` digest instead of\nthis file** — it carries only what's needed to emit valid output (schema,\nseverity enum, ID prefixes, determinism caps, anti-patterns, framing, the\nadvisor constraint), so ~9 parallel critics don't each re-read this whole\ndocument every verify. This file stays the source of truth; if you change a\nhard rule (severity enum, ID prefixes, the 12-cap, schema), update the digest\nto match — `eval/validate.test.mjs` enforces that the digest and the validator\nagree, so drift fails CI. The orchestrator (`contract-verify`) still reads this\nfull file for provenance/cost/advisor orchestration.\n\nEach critic SKILL.md should open with:\n\n> Follow `CRITIC-PROTOCOL.md` at the plugin root for severity\n> definitions, output schema, and shared anti-patterns. This skill\n> only defines WHAT to look for; the protocol defines HOW to report.\n\n---\n\n## Output schema (STRICT)\n\nEvery critic returns a JSON array. Every element MUST match this schema\nexactly. The deterministic validator (`scripts/validate.mjs`) checks\ncritic output against this schema and **rejects** any element that\nviolates it — out-of-schema output is a bug, not a finding.\n\n```json\n[\n  {\n    \"id\": \"string — \u003cCRITIC_PREFIX>-\u003cNNN>, e.g. EC-001\",\n    \"critic\": \"string — one of the canonical critic names below\",\n    \"severity\": \"blocker | warning | info\",\n    \"message\": \"string — one-line statement of the gap\",\n    \"suggestion\": \"string — concrete fix the author should make\",\n    \"fragmentRef\": \"string — B2 | AC3 | frontmatter | \u003csection>\",\n    \"references\": [\"string — optional, repo:path:line entries\"],\n    \"source\": \"github-mcp | local-clone | contract-only\",\n    \"status\": \"open | resolved | dismissed | acknowledged\"\n  }\n]\n```\n\n### Finding status + the gate\n\n`status` is one of: `open` (live), `resolved` (fixed in the contract),\n`dismissed` (the finding was wrong, with a reason), `acknowledged` (a\nhuman reviewed it and accepts it as-is). Only `open` findings count.\n\n**The hard gate is blockers, not all findings.** A contract is\n*promotable* when it has **zero open blockers** — that's the finite,\ndeterministic-plus-serious-judgment set. Warnings and info are advisory:\nthey refine the readiness signal but never block promotion. This is what\nstops verify from feeling endless — a dev clears the stable blocker set\nand ships; they don't chase run-to-run-variable warnings to zero. A\nwarning a human accepts is marked `acknowledged` so it leaves the open\nset and never re-litigates.\n\n### Severity is a CLOSED enum\n\nAllowed values, and ONLY these three:\n\n- **`blocker`** — prevents the contract from progressing. Reserved for:\n  data corruption risk, permission/security holes, missing required\n  fields (instrumentation, ACs, perf budget, comms states), broken\n  API contracts between repos, breaking changes to shipped behavior.\n- **`warning`** — should be addressed but doesn't block readiness on\n  its own. Bad UX, weak error copy, missing platform-specific detail,\n  scaling concerns without a cliff.\n- **`info`** — worth knowing, not blocking. Style nits, suggestions,\n  related code worth being aware of.\n\n**FORBIDDEN values:** `high`, `medium`, `low`, `critical`, `major`,\n`minor`, `p0`, `p1`, numeric severities, or anything else. If you\ncatch yourself wanting \"high,\" it's a `blocker`. \"Medium\" is a\n`warning`. \"Low\" is `info`. The validator will reject anything else\nand the run will fail loudly — do not emit them.\n\n### Canonical critic names\n\nUse exactly these in the `critic` field:\n\n```\nminimality\nedge-cases\nplatform-parity\ninstrumentation\ncomms-completeness\nperf-budget\nregression\nsecurity\nscalability\nsizing\n```\n\n### ID prefixes\n\n```\nminimality         → MIN-\nedge-cases         → EC-\nplatform-parity    → PP-\ninstrumentation    → INS-\ncomms-completeness → COMMS-\nperf-budget        → PERF-\nregression         → RG-\nsecurity           → SEC-\nscalability        → SC-\nsizing             → SZ-\n```\n\n---\n\n## Determinism rules\n\nTo minimize variance run-to-run:\n\n1. **Don't invent severities.** Use the closed enum. (See above.)\n2. **Cap findings.** Max 12 per critic per contract. If you have more,\n   raise your bar for what counts — don't pad.\n3. **Be specific, not speculative.** A finding without a concrete\n   `fragmentRef` (and `references` for regression) is weaker than one\n   with them. Prefer fewer, grounded findings.\n4. **Don't re-report what's already in the contract.** Read first.\n5. **Order findings by severity** (blockers first), then by fragment\n   order. Stable ordering reduces diff noise between runs.\n\n---\n\n## What's deterministic vs judgment\n\nSome checks are mechanical and run in CODE before any critic fires\n(see `scripts/validate.mjs`). Critics must NOT duplicate these — they\nare already enforced deterministically:\n\n| Deterministic (handled by validate.mjs — don't re-check) | Judgment (your job) |\n|---|---|\n| Every behavior HAS an `instrumentation` block | Is the event name semantically right? Collision risk? |\n| Every behavior HAS a `perfBudget` with numeric fields | Are the budgets realistic for the platform? |\n| Every behavior HAS empty/loading/success/error states | Is the error copy actionable? On-brand? |\n| Every behavior HAS ≥1 acceptance criterion | Do the ACs cover the real edge cases? |\n| Behaviors declare `platforms ⊆ contract.platforms` | Is the platform-specific UX actually described? |\n| Sizing rule arithmetic (platform count, behavior count) | (sizing is fully deterministic — see validate.mjs) |\n| Output JSON schema validity | (validated automatically) |\n\nIf the validator already emits a finding for a missing field, you do\nNOT also emit one. You add the *judgment* layer on top: the validator\nsays \"B3 has no instrumentation\"; you (instrumentation critic) propose\nthe right event name and flag collisions.\n\n---\n\n## Model + version pinning\n\nEvery findings file records, in its frontmatter, the plugin version\nand the models that produced it. Critics no longer all run on one model\n— the deterministic router (`computeModelPlan` in `scripts/validate.mjs`)\nassigns each critic a model from the contract's sizing — so provenance\nrecords the **per-tier model map** that was used, not a single scalar:\n\n```yaml\nverifiedWith:\n  pluginVersion: 0.19.0\n  protocolVersion: 2\n  complexity: large              # the sizing bucket that drove routing\n  models:                        # the model each tier ran on (from modelPlan)\n    light: claude-haiku-4-5      # minimality, comms-completeness\n    default: claude-sonnet-4-6   # edge-cases, instrumentation, perf-budget, platform-parity\n    heavy: claude-opus-4-8       # regression, security, scalability\n  contractHash: sha256:abc123…   # hash of the contract content verified\n```\n\nThis keeps findings reproducible-by-reference: if two devs get different\nfindings, compare `contractHash` (different contract content), `models`\n(different engine per tier), and `pluginVersion`. The model map is a\ndeterministic function of `complexity`, so the same contract always\nroutes the same way — the routing decision is reproducible, not a\nper-run guess. The eval suite pins all of these so behavioral drift is\ncaught in CI, not in production.\n\n**Provenance schema is versioned by `protocolVersion`.** v1 recorded a\nsingle `model:` scalar; v2 records the `models` map above. Bumping\n`protocolVersion` deliberately invalidates the verify cache (see\n`cacheStatus`), because a findings file written under the old schema\ncan't faithfully describe which model produced each finding.\n\nNote: the **advisor** (used by the Implementer, not by verify critics) is\nnon-deterministic by design and is therefore NOT part of this reproducible\nprovenance or any eval gate; when it fires, the Implementer records it in\nits PR output, never in a verdict-bearing findings file.\n\n## Cost / token usage (observability — NOT a gate)\n\nToken usage is non-deterministic, so it follows the same rule as the\nadvisor: it's recorded for observability and is **never** a gate input or\npart of the reproducible-provenance comparison. But turning recorded usage\ninto a dollar figure is deterministic code (`computeCost` in\n`scripts/validate.mjs`, priced from `reference/model-pricing.json`), which is\nwhat lets you measure whether model tiering and the advisor actually saved\nmoney.\n\nWhen the runtime exposes per-subagent token counts, record them in the\nfindings `.json` companion (best-effort — omit the block if unavailable):\n\n```jsonc\n\"usage\": {\n  \"recordedAt\": \"\u003cISO>\",\n  \"byCritic\": {\n    \"minimality\": { \"model\": \"claude-haiku-4-5\",  \"inputTokens\": 8000,  \"outputTokens\": 300 },\n    \"security\":   { \"model\": \"claude-opus-4-8\",    \"inputTokens\": 15000, \"outputTokens\": 1200 }\n  },\n  \"advisor\": null            // or { model, inputTokens, outputTokens } if consulted\n}\n```\n\nThe rollup (`validate.mjs --cost`, surfaced as `/manifest cost`) scans these\nblocks and reports cost by complexity, model tier, and critic. Because it's\nobservability, a missing or partial `usage` block degrades gracefully — the\nverdict and caching are entirely unaffected.\n\n## Advisor escalation (critics) — advisory findings ONLY\n\nA critic running on a fast tier may consult the advisor (Claude Code's\n`/advisor`) on a **borderline** call — but only within a hard boundary that\nprotects the deterministic verdict:\n\n- **Allowed:** deciding whether to emit, or how to phrase, a `warning` or\n  `info` finding the critic is genuinely unsure about. The advisor helps the\n  cheap model match the judgment of a strong one *on the soft, advisory layer*.\n- **Forbidden:** influencing a `blocker` in any way. Blockers are the gate\n  (promotable = zero open blockers) and must stay a deterministic-plus-protocol\n  judgment, never an advisor's non-deterministic call. The deterministic\n  validator **rejects** an advisor-influenced blocker (`validateFindings`), so\n  this isn't merely a convention — it's enforced, and a run that tries it fails\n  loud.\n- **Mark it.** An advisor-influenced finding sets\n  `metadata.advisorConsulted: true` (and may record the advisor model). The run\n  records `advisorConsulted: true` in `findings.json` provenance.\n- **Not reproducible, and that's fine.** Advisor-influenced findings are\n  excluded from the reproducible-provenance comparison and the eval recall\n  gates — they're a quality aid on the advisory layer, never part of the\n  reproducible verdict. Since they can only be `warning`/`info`, they never\n  touch promotability.\n\nOpt-in per repo via `conventions.criticAdvisor: true` in `.manifest/repos.yml`\n**and** an advisor being available in the runtime; otherwise critics run\nexactly as before. The point is to spend a strong model's judgment only where a\nsoft call is genuinely ambiguous, without ever destabilizing the gate.\n\n---\n\n## Shared anti-patterns (apply to every critic)\n\n- Don't emit severities outside the closed enum.\n- Don't duplicate deterministic checks the validator already does.\n- Don't speculate without grounding (fragmentRef / references).\n- Don't exceed 12 findings; quality over volume.\n- Don't propose code changes — propose *spec clarifications*. (Code is\n  the Implementer's job.)\n- Don't soften a real blocker into a warning to be \"nice.\" If it\n  blocks, it blocks.\n- Don't degrade silently on bad input. If you can't run (missing repo\n  access, null input), say so as an `info` finding with a clear\n  reason — never produce a misleading verdict from missing data.\n- **Write `message` and `suggestion` in plain English a non-author can\n  act on.** The structured fields (`id`, `critic`, `fragmentRef`,\n  `severity`) carry the machine detail; the human text should read like\n  a reviewer's note, not a log line. Spell out jargon (\"the 50ms\n  responsiveness budget\", not \"the p75 ttiMs budget\"); say where in human\n  terms (\"under Acceptance criteria\"), and don't lead the sentence with\n  the ID.\n- **`suggestion` must show HOW to fix it, not just name the gap.** A\n  good suggestion tells the author *where* to edit and gives the *shape*\n  of the fix — a fill-in template or example — so they can paste-and-fill\n  rather than guess. Don't write \"add a description\"; write \"in B2's\n  description, add a sentence naming who's authorized, e.g. 'Only the\n  re-authenticated account owner can delete.'\" Don't write \"add an AC\";\n  write `Under \"## Acceptance criteria\", add: \"- AC\u003cn> (B2): Given …,\n  when …, then ….\"` If the fix is \"this isn't needed here,\" say\n  explicitly to move it to `## Out of scope`. The deterministic\n  validator already does this for its findings — match that bar.\n\n## Framing: offer deferral, don't only demand handling\n\nA finding is \"handle X **or** explicitly defer X.\" Every critic's\n`suggestion` must allow the author to *descope* — move the item to\n`## Out of scope` as a follow-up — not just \"add handling for X.\" This\nis what stops scope from growing one finding at a time: the author can\nclear a finding by deferring it, and reaching readiness no longer\n*requires* building everything a critic noticed.\n\nCalibrate to the change: read `changeType` and `complexity`. On a\n`bug-fix` (or small change), **bias toward deferral** — the bar is \"what\ndoes fixing this bug actually require,\" not \"what would a net-new feature\nneed.\" Speculative edge cases, new telemetry, and new flags on a bug fix\nshould be flagged for deferral, not demanded. (The `minimality` critic\nis the dedicated counterweight, but every critic shares this framing.)\n"},{"id":"reference-BUG-PATTERNS","path":"reference/BUG-PATTERNS.md","base":"BUG-PATTERNS.md","title":"Bug patterns — Manifest's growing catalog","md":"# Bug patterns — Manifest's growing catalog\n\nThe implementer reads this file and **avoids these patterns**.\nThe `code-review` critic reads this file and **looks for these patterns**.\nBoth stay in sync because both reference the same source.\n\nEvery time an external reviewer (Cursor BugBot, a human reviewer, a\npostmortem) catches a class of bug that Manifest didn't flag itself,\n**the pattern goes here**. The library only grows; it never resets.\n\n## How to add a pattern\n\nWhen a Cursor finding (or a postmortem cause) is something the\nimplementer should have avoided, add an entry below:\n\n```\n### \u003cID> — \u003cplain-English name>\n\n**Where it bites**: \u003cone-line user-visible impact>\n\n**The shape**: \u003ca minimal code example that exhibits the bug>\n\n**Why it slips past basic review**: \u003cone line — what makes it\nnon-obvious>\n\n**The fix**: \u003ca minimal code example after the fix>\n\n**Where first observed**: \u003cPR link, postmortem ID, or \"internal QA\">\n```\n\nPattern IDs follow `BP-NNN`, monotonically increasing. Don't renumber\nwhen you remove a pattern (rare); strike through with `~~BP-007~~`\nand a one-line reason.\n\n## The learning loop (postmortem → candidate → accept)\n\nPatterns from a postmortem are **not added here directly.** The loop has a\ndeliberate human gate so a machine-proposed check can't start blocking every\nPR unreviewed:\n\n1. **Propose.** When `/postmortem` finds a contributing factor that is a\n   code-shaped bug class a diff-level review could have caught, it appends a\n   *candidate* entry to `reference/bug-patterns.candidates.md` (the staging\n   file — nothing there is enforced), with `**Severity**: warning`,\n   `**Status**: provisional`, and `Where first observed: postmortem \u003cID>`.\n2. **Accept (human).** A maintainer reviews the candidate. If it's a real,\n   generalizable, diff-detectable class of bug, they move it into this file\n   under the next id and delete it from candidates. Get the next id with\n   `node scripts/validate.mjs --next-pattern-id`.\n3. **Enforce.** Once here, `code-review` checks it on every diff. A\n   newly-promoted pattern stays at `warning` severity until it's proven\n   precise in practice; only then promote it to `blocker` — this avoids\n   false-positive blockers from an over-broad new pattern.\n\nValidate catalog + candidates structure (run in CI):\n\n```\nnode scripts/validate.mjs --check-patterns reference/BUG-PATTERNS.md reference/bug-patterns.candidates.md\n```\n\n## Rules\n\n- **The implementer's pre-write step** (`skills/implement/SKILL.md`\n  step 3) must scan this file and pre-emptively avoid every active\n  pattern.\n- **The code-review critic** (`skills/code-review/SKILL.md`) must\n  check every active pattern on every diff. Findings cite the\n  `BP-NNN` in their `id` extension (e.g., `CR-007` with metadata\n  `{ \"bugPattern\": \"BP-003\" }`).\n- **The self-review loop** in the implementer runs `code-review`\n  with the **full** library on every iteration — not just the\n  previous round's findings. This is what stops the \"fix one,\n  Cursor finds another\" cycle: by iteration 2, the agent has\n  scanned for every pattern in the catalog, not just the class it\n  just fixed.\n- **Stack-agnostic phrasing**. Patterns describe the shape, not a\n  specific language. The Examples can be in whichever language is\n  clearest, but the pattern applies wherever the shape appears.\n\n---\n\n## Patterns\n\n### BP-001 — Empty catch followed
